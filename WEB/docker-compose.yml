services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bankrotai}
      POSTGRES_USER: ${POSTGRES_USER:-bankrotai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bankrotai} -d ${POSTGRES_DB:-bankrotai}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ..
      dockerfile: WEB/Dockerfile.api
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-bankrotai}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-bankrotai}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      BANKROTAI_API_KEY: ${BANKROTAI_API_KEY:?Set BANKROTAI_API_KEY in .env}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python -m bankrotai.cli init-db
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: WEB/Dockerfile.api
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-bankrotai}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-bankrotai}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      BANKROTAI_API_KEY: ${BANKROTAI_API_KEY:?Set BANKROTAI_API_KEY in .env}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=5).read()"]
      interval: 20s
      timeout: 10s
      retries: 5

  worker:
    build:
      context: ..
      dockerfile: WEB/Dockerfile.api
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-bankrotai}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-bankrotai}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      BANKROTAI_API_KEY: ${BANKROTAI_API_KEY:?Set BANKROTAI_API_KEY in .env}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: celery -A bankrotai.tasks:celery_app worker --loglevel=INFO

  beat:
    build:
      context: ..
      dockerfile: WEB/Dockerfile.api
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-bankrotai}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-bankrotai}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      BANKROTAI_API_KEY: ${BANKROTAI_API_KEY:?Set BANKROTAI_API_KEY in .env}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: celery -A bankrotai.tasks:celery_app beat --loglevel=INFO

  web:
    build:
      context: ..
      dockerfile: WEB/Dockerfile
    environment:
      BANKROTAI_API_KEY: ${BANKROTAI_API_KEY:?Set BANKROTAI_API_KEY in .env}
      WEB_BASIC_AUTH_USER: ${WEB_BASIC_AUTH_USER:?Set WEB_BASIC_AUTH_USER in .env}
      WEB_BASIC_AUTH_PASSWORD: ${WEB_BASIC_AUTH_PASSWORD:?Set WEB_BASIC_AUTH_PASSWORD in .env}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 20s
      timeout: 10s
      retries: 5

volumes:
  postgres_data:
