version: 2

# TORGI is in active production stabilization. Dependabot is intentionally
# security-first: routine version bumps stay disabled to avoid unrelated PR
# churn while security updates remain available and grouped per ecosystem.
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Moscow
    # 0 disables routine version-update PRs, not Dependabot security updates.
    open-pull-requests-limit: 0
    groups:
      python-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /WEB
    schedule:
      interval: weekly
      day: monday
      time: "06:20"
      timezone: Europe/Moscow
    open-pull-requests-limit: 0
    groups:
      web-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:40"
      timezone: Europe/Moscow
    open-pull-requests-limit: 0
    groups:
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"
