name: UTPL read-only source audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  utpl-readonly-audit:
    if: github.head_ref == 'fix/utpl-per-lot-contract-20261109'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install locked test dependencies
        run: pip install -r requirements-dev.lock && pip install --no-deps -e .
      - name: Focused UTPL regression tests
        run: pytest -q tests/test_utpl_lot_contract.py
      - name: Two-pass UTPL public catalogue and 30-detail read-only audit
        run: |
          python scripts/probe_utpl_readonly.py --catalogue --passes 2 --max-pages 1000 --details 30 --delay 0.5 > /tmp/utpl-audit.json
          python - <<'PY'
          import json
          report = json.load(open("/tmp/utpl-audit.json", encoding="utf-8"))
          sample = report["detail_sample"] or {}
          print(json.dumps({
              "source": report["source"],
              "production_enabled": report["production_enabled"],
              "database_writes": report["database_writes"],
              "terminal_verified": report["terminal_verified"],
              "two_pass_digest_match": report["two_pass_digest_match"],
              "passes": [
                  {
                      "pages": item["pages"],
                      "terminal_page": item["terminal_page"],
                      "unique_ids": item["unique_ids"],
                      "digest": item["digest"],
                  }
                  for item in report["passes"]
              ],
              "detail_requested": sample.get("requested"),
              "detail_parsed": sample.get("parsed"),
              "price_success": sample.get("price_success"),
              "status_success": sample.get("status_success"),
              "structured_classifier_success": sample.get("structured_classifier_success"),
              "multi_lot_procedure_count": len(sample.get("multi_lot_procedures") or {}),
          }, indent=2, ensure_ascii=False))
          if not report["terminal_verified"]:
              raise SystemExit("terminal page not verified")
          if report["two_pass_digest_match"] is not True:
              raise SystemExit("two pass catalogue digest mismatch")
          if sample.get("requested", 0) < 30 or sample.get("parsed", 0) < 30:
              raise SystemExit("30 individual details were not verified")
          PY
