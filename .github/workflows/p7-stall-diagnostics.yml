name: P7 stall diagnostics

on:
  push:
    branches:
      - ops/p7-stall-diagnostics-20261006

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, Windows, X64, bankrotai-home]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Inspect P7 Celery result
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $script=@'
          import json
          from sqlalchemy import select
          from bankrotai.db import BackgroundTaskState, SessionLocal
          from bankrotai.tasks import celery_app
          s=SessionLocal()
          try:
              rows=s.scalars(select(BackgroundTaskState).where(BackgroundTaskState.task_type=="geocoding_fast_drain").order_by(BackgroundTaskState.created_at.desc()).limit(3)).all()
              out=[]
              for row in rows:
                  ar=celery_app.AsyncResult(row.task_id)
                  try:
                      info=repr(ar.info)
                  except Exception as exc:
                      info=f"<info-error {exc!r}>"
                  out.append({
                    "task_id":row.task_id,
                    "db_status":row.status,
                    "db_progress":row.progress_json,
                    "db_result":row.result_json,
                    "db_error":row.error_message,
                    "celery_state":ar.state,
                    "celery_info":info[:4000],
                    "celery_traceback":(ar.traceback or "")[-8000:],
                  })
              print(json.dumps(out,default=str,ensure_ascii=False))
          finally:s.close()
          '@
          $script | docker exec -i bankrotai-home-geocoding-worker python -
