name: P7 stall diagnostics

on:
  push:
    branches:
      - ops/p7-stall-diagnostics-20261006

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, Windows, X64, bankrotai-home]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Inspect P7 runtime
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Output '=== P7 DB state ==='
          $script = @'
          import json
          from sqlalchemy import func, select
          from bankrotai.core import utc_now
          from bankrotai.db import AppSetting, BackgroundTaskState, GeoFailure, SessionLocal
          s=SessionLocal()
          try:
              paused=s.scalar(select(AppSetting).where(AppSetting.key=="geocoding_paused"))
              p7=s.scalars(select(BackgroundTaskState).where(BackgroundTaskState.task_type=="geocoding_fast_drain").order_by(BackgroundTaskState.created_at.desc()).limit(3)).all()
              counts=dict(s.execute(select(GeoFailure.status,func.count()).group_by(GeoFailure.status)).all())
              print(json.dumps({
                "paused": None if paused is None else paused.value,
                "failure_status_counts": {str(k):int(v) for k,v in counts.items()},
                "p7":[{"task_id":x.task_id,"status":x.status,"created_at":x.created_at,"started_at":x.started_at,"finished_at":x.finished_at,"progress":x.progress_json,"error":x.error_message} for x in p7]
              }, default=str, ensure_ascii=False))
          finally:s.close()
          '@
          $script | docker exec -i bankrotai-home-geocoding-worker python -

          Write-Output '=== Celery active/reserved/scheduled ==='
          docker exec bankrotai-home-geocoding-worker celery -A bankrotai.tasks.celery_app inspect active --timeout=5
          docker exec bankrotai-home-geocoding-worker celery -A bankrotai.tasks.celery_app inspect reserved --timeout=5
          docker exec bankrotai-home-geocoding-worker celery -A bankrotai.tasks.celery_app inspect scheduled --timeout=5

          Write-Output '=== Redis queue/lock state ==='
          $redisPassword=[IO.File]::ReadAllText('C:\ProgramData\BankrotAI\redis-password.txt').Trim()
          foreach ($key in @('bankrotai:geocoding:batch','geocoding','celery')) {
            Write-Output "KEY=$key TYPE=$(docker exec bankrotai-home-redis redis-cli -a $redisPassword --no-auth-warning TYPE $key | Select-Object -Last 1)"
            docker exec bankrotai-home-redis redis-cli -a $redisPassword --no-auth-warning PTTL $key
            docker exec bankrotai-home-redis redis-cli -a $redisPassword --no-auth-warning LLEN $key
          }

          Write-Output '=== Worker processes ==='
          docker top bankrotai-home-geocoding-worker
