name: Maintain REG.RU Cloudflare tunnel

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regru-cloudflare-tunnel
  cancel-in-progress: false

jobs:
  install-named-tunnel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SSH_HOST: 194.226.126.233
      SSH_PORT: "2222"
    steps:
      - name: Prepare SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.REGRU_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/regru_deploy"
          chmod 600 "$HOME/.ssh/regru_deploy"
          ssh-keyscan -T 20 -p "$SSH_PORT" "$SSH_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Install and start named tunnel
        env:
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_TUNNEL_TOKEN"
          TOKEN_B64="$(printf '%s' "$CLOUDFLARE_TUNNEL_TOKEN" | base64 -w 0)"
          ssh -i "$HOME/.ssh/regru_deploy" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -p "$SSH_PORT" "root@$SSH_HOST" \
            "TOKEN_B64='$TOKEN_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          if ! command -v cloudflared >/dev/null; then
            curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
              -o /usr/local/bin/cloudflared
            chmod 755 /usr/local/bin/cloudflared
          fi
          install -d -m 700 /opt/bankrotai
          printf '%s' "$TOKEN_B64" | base64 -d > /opt/bankrotai/cloudflare-tunnel-token
          chmod 600 /opt/bankrotai/cloudflare-tunnel-token
          systemctl disable --now bankrotai-cloudflared.service 2>/dev/null || true
          cat > /etc/systemd/system/cloudflared.service <<'SERVICE'
          [Unit]
          Description=BankrotAI named Cloudflare tunnel
          After=network-online.target docker.service
          Wants=network-online.target
          [Service]
          Type=simple
          ExecStart=/usr/local/bin/cloudflared tunnel --no-autoupdate --protocol http2 run --token-file /opt/bankrotai/cloudflare-tunnel-token
          Restart=always
          RestartSec=10
          [Install]
          WantedBy=multi-user.target
          SERVICE
          systemctl daemon-reload
          systemctl enable cloudflared.service
          systemctl restart cloudflared.service
          timeout 45 bash -c 'until systemctl is-active --quiet cloudflared.service; do sleep 2; done'
          systemctl is-active --quiet cloudflared.service
          REMOTE

      - name: Verify named tunnel connector
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/regru_deploy" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -p "$SSH_PORT" "root@$SSH_HOST" \
            'bash -s' <<'REMOTE'
          set -euo pipefail
          systemctl is-active --quiet cloudflared.service
          curl --fail --silent --show-error http://127.0.0.1:8000/health/live >/dev/null
          if ! timeout 90 bash -c \
            'until journalctl -u cloudflared.service --since "-3 minutes" --no-pager | grep -Fq "Registered tunnel connection"; do sleep 2; done'; then
            journalctl -u cloudflared.service --since "-3 minutes" --no-pager \
              | tail -n 80 \
              | sed -E 's/eyJ[A-Za-z0-9+\/_=-]+/[REDACTED]/g'
            exit 1
          fi
          journalctl -u cloudflared.service --since "-3 minutes" --no-pager \
            | grep -F "Registered tunnel connection" \
            | tail -n 1
          REMOTE
