name: Maintain REG.RU Cloudflare tunnel

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regru-cloudflare-tunnel
  cancel-in-progress: false

jobs:
  install-named-tunnel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SSH_HOST: 194.226.126.233
      SSH_PORT: "2222"
    steps:
      - name: Prepare SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.REGRU_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/regru_deploy"
          chmod 600 "$HOME/.ssh/regru_deploy"
          ssh-keyscan -T 20 -p "$SSH_PORT" "$SSH_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Install and start named tunnel
        env:
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_TUNNEL_TOKEN"
          TOKEN_B64="$(printf '%s' "$CLOUDFLARE_TUNNEL_TOKEN" | base64 -w 0)"
          ssh -i "$HOME/.ssh/regru_deploy" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -p "$SSH_PORT" "root@$SSH_HOST" \
            "TOKEN_B64='$TOKEN_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          install -d -m 700 /opt/bankrotai
          printf '%s' "$TOKEN_B64" | base64 -d > /opt/bankrotai/cloudflare-tunnel-token
          chmod 600 /opt/bankrotai/cloudflare-tunnel-token
          systemctl disable --now bankrotai-cloudflared.service 2>/dev/null || true
          systemctl disable --now cloudflared.service 2>/dev/null || true
          docker network inspect bankrotai >/dev/null 2>&1 || docker network create bankrotai
          docker pull cloudflare/cloudflared:2026.7.2
          docker rm -f bankrotai-cloudflared >/dev/null 2>&1 || true
          docker run -d \
            --name bankrotai-cloudflared \
            --restart unless-stopped \
            --network bankrotai \
            --user 0:0 \
            --memory 128m \
            --log-opt max-size=10m \
            --log-opt max-file=3 \
            -v /opt/bankrotai/cloudflare-tunnel-token:/run/secrets/cloudflare-tunnel-token:ro \
            cloudflare/cloudflared:2026.7.2 \
            tunnel --no-autoupdate --protocol http2 run \
            --token-file /run/secrets/cloudflare-tunnel-token
          timeout 45 bash -c \
            'until docker ps --filter name=bankrotai-cloudflared --filter status=running --format "{{.Names}}" | grep -Fxq bankrotai-cloudflared; do sleep 2; done'
          REMOTE

      - name: Verify named tunnel connector
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/regru_deploy" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -p "$SSH_PORT" "root@$SSH_HOST" \
            'bash -s' <<'REMOTE'
          set -euo pipefail
          test "$(docker inspect -f '{{.State.Running}}' bankrotai-cloudflared)" = true
          sleep 10
          if ! timeout 15 docker logs bankrotai-cloudflared 2>&1 \
            | grep -F "Registered tunnel connection" >/dev/null; then
            timeout 15 docker logs --tail 80 bankrotai-cloudflared 2>&1 \
              | tail -n 80 \
              | sed -E 's/eyJ[A-Za-z0-9+\/_=-]+/[REDACTED]/g'
            exit 1
          fi
          timeout 15 docker logs bankrotai-cloudflared 2>&1 \
            | grep -F "Registered tunnel connection" \
            | tail -n 1
          REMOTE

      - name: Verify public named tunnel endpoint
        id: public-tunnel-check
        continue-on-error: true
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --max-time 20 \
              https://api.dezster.ru/health/live \
              && test "$(curl --silent --show-error --max-time 30 -o /dev/null -w '%{http_code}' \
                https://dezster.ru/api/auth/me || true)" = "401"; then
              printf '\n'
              break
            fi
            if test "$attempt" = 12; then
              exit 1
            fi
            sleep 5
          done
          for stability_check in $(seq 1 6); do
            test "$(curl --silent --show-error --max-time 20 -o /dev/null -w '%{http_code}' \
              https://api.dezster.ru/health/live || true)" = "200"
            test "$(curl --silent --show-error --max-time 30 -o /dev/null -w '%{http_code}' \
              https://dezster.ru/api/auth/me || true)" = "401"
            if test "$stability_check" != 6; then
              sleep 5
            fi
          done

      - name: Report unstable named tunnel
        if: steps.public-tunnel-check.outcome == 'failure'
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/regru_deploy" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -p "$SSH_PORT" "root@$SSH_HOST" \
            'docker inspect --format "running={{.State.Running}} restart_count={{.RestartCount}} started={{.State.StartedAt}}" bankrotai-cloudflared; docker logs --tail 80 bankrotai-cloudflared 2>&1' \
            | sed -E 's/eyJ[A-Za-z0-9+\/_=-]+/[REDACTED]/g'
          exit 1
