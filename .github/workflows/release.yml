name: Release accepted version

on:
  workflow_run:
    workflows: ["P11 production acceptance"]
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: accepted-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ACCEPTED_SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-python@v7
        with: { python-version: "3.11", cache: pip }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: WEB/package-lock.json }

      - name: Verify repository consistency
        run: python scripts/check-repository-consistency.py

      - name: Wait for exact-SHA production gates
        shell: python
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          import json
          import os
          import time
          import urllib.parse
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["ACCEPTED_SHA"]
          token = os.environ["GITHUB_TOKEN"]
          required = {
              "Production reliability",
              "P1 production data quality",
              "Deploy WEB and API to REG.RU",
              "Deploy Cloudflare edge proxy",
              "Public WEB smoke",
              "Production functional reliability",
              "P11 production acceptance",
          }
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "User-Agent": "sterdez-release-gate",
          }
          url = f"https://api.github.com/repos/{repo}/actions/runs?head_sha={urllib.parse.quote(sha)}&per_page=100"
          deadline = time.monotonic() + 1800
          while True:
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  runs = json.load(response).get("workflow_runs", [])
              states = {}
              for name in required:
                  candidates = [run for run in runs if run.get("name") == name]
                  if any(run.get("status") == "completed" and run.get("conclusion") == "success" for run in candidates):
                      states[name] = "success"
                  elif any(run.get("status") in {"queued", "in_progress", "waiting", "requested", "pending"} for run in candidates):
                      states[name] = "active"
                  elif candidates:
                      states[name] = "failed"
                  else:
                      states[name] = "missing"
              print(json.dumps(states, sort_keys=True))
              if all(value == "success" for value in states.values()):
                  break
              failed = [name for name, value in states.items() if value == "failed"]
              if failed:
                  raise SystemExit(f"Exact-SHA production gate failed: {failed}")
              if time.monotonic() >= deadline:
                  raise SystemExit(f"Timed out waiting for exact-SHA gates: {states}")
              time.sleep(20)

      - name: Build SBOM evidence
        run: |
          python -m pip install --disable-pip-version-check pip-audit==2.10.1
          pip-audit -r requirements.lock -f cyclonedx-json -o sbom-python.json
          cd WEB
          npm ci
          npm sbom --sbom-format=cyclonedx > ../sbom-web.json

      - name: Create accepted GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it unchanged."
            exit 0
          fi
          cat > release-evidence.md <<EOF
          # STERDEZ $TAG

          Accepted Git SHA: $ACCEPTED_SHA

          This release was created only after exact-SHA production reliability, P1, REG.RU deploy, Cloudflare deploy, Public WEB smoke, functional reliability and P11 acceptance were all green.

          The attached CycloneDX SBOMs and SHA-256 checksums are generated from this accepted commit.
          EOF
          sha256sum requirements.lock WEB/package-lock.json sbom-python.json sbom-web.json > SHA256SUMS
          gh release create "$TAG" --target "$ACCEPTED_SHA" --title "STERDEZ $TAG" --notes-file release-evidence.md \
            sbom-python.json sbom-web.json SHA256SUMS
