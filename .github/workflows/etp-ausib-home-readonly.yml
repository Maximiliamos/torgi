name: AUSIB Home read-only endpoint diagnosis

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/etp-ausib-home-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: etp-ausib-home-readonly
  cancel-in-progress: false

jobs:
  inspect:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.head_ref == 'integration/pr1080-pr1085-etp-home-gates-20261104')
    runs-on: [self-hosted, Windows, X64, bankrotai-home]
    timeout-minutes: 10
    steps:
      - name: Probe only public AUSIB URLs from existing Home container
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $probe = @'
          import json
          import re
          import time
          from urllib.parse import urlsplit, urljoin
          import requests
          from bs4 import BeautifulSoup
          from bankrotai.connectors.etp_sources import SOURCE_CONNECTOR_TYPES
          from bankrotai.connectors.etp_sources.common import parse_listing_html

          urls = [
              "https://ausib.ru/",
              "https://ausib.ru/etp/trade/list.html",
              "https://ausib.ru/trade/list.html",
              "https://ausib.ru/trade/view/purchase/general.html?id=104599805",
          ]
          session = requests.Session()
          session.headers["User-Agent"] = (
              "TORGI/1.0 (+https://github.com/Maximiliamos/torgi; public read-only connector)"
          )
          report = []
          for url in urls:
              p = urlsplit(url)
              if p.scheme != "https" or p.hostname != "ausib.ru":
                  raise RuntimeError("Untrusted AUSIB endpoint")
              info = {"url_path": p.path, "query_keys_only": sorted(
                  [part.split("=")[0] for part in p.query.split("&") if part]
              )}
              try:
                  response = session.get(url, timeout=(8, 18), allow_redirects=False)
                  location = response.headers.get("Location")
                  target = urljoin(url, location) if location else None
                  dest = urlsplit(target) if target else None
                  info.update({
                      "status": response.status_code,
                      "body_bytes": len(response.content),
                      "content_type": (response.headers.get("Content-Type") or "").split(";")[0],
                      "redirect_self": target == url if target else None,
                      "redirect_host": dest.hostname if dest else None,
                      "redirect_path": dest.path if dest else None,
                      "contains_lot_detail_href": bool(re.search(
                          rb"/trade/view/purchase/general\.html\?[^\"' >]*id=", response.content
                      )),
                  })
                  if p.path == "/etp/trade/list.html":
                      if response.status_code == 302 and target == url:
                          time.sleep(1)
                          response = session.get(url, timeout=(8, 18), allow_redirects=False)
                          info["same_url_bounded_retry_http"] = response.status_code
                      if response.status_code == 200:
                          try:
                              connector = SOURCE_CONNECTOR_TYPES["ausib.ru"]()
                              items = parse_listing_html(
                                  connector.profile, response.content, page=1
                              )
                              info["normalized_lot_candidates"] = len(items)
                              info["first_three_source_ids"] = [
                                  item.external_id for item in items[:3]
                              ]
                              info["candidates_with_price"] = sum(
                                  item.start_price is not None for item in items
                              )
                          except Exception as exc:
                              info["catalogue_parser_error"] = type(exc).__name__
                  if p.path == "/" and response.status_code == 200:
                      soup = BeautifulSoup(response.content, "html.parser")
                      candidates = []
                      for anchor in soup.select("a[href]"):
                          href = urljoin(url, str(anchor.get("href")))
                          parsed = urlsplit(href)
                          if (parsed.scheme == "https" and parsed.hostname == "ausib.ru"
                                  and "trade" in parsed.path.lower() and "list" in parsed.path.lower()):
                              candidates.append(parsed.path)
                      info["homepage_trade_list_paths"] = sorted(set(candidates))[:12]
              except requests.RequestException as exc:
                  info["transport_error"] = type(exc).__name__
              report.append(info)
              time.sleep(1)
          print(json.dumps({"read_only": True, "database_writes": 0, "results": report},
                           ensure_ascii=False))
          '@
          $result = $probe | docker exec -i bankrotai-home-ingestion-worker python -
          if ($LASTEXITCODE -ne 0 -or -not $result) { throw 'AUSIB read-only probe failed' }
          $payload = $result | Select-Object -Last 1 | ConvertFrom-Json
          if ($payload.read_only -ne $true -or $payload.database_writes -ne 0) {
            throw 'AUSIB probe no-write safety contract missing'
          }
          $payload | ConvertTo-Json -Depth 6 | Add-Content $env:GITHUB_STEP_SUMMARY
          $payload | ConvertTo-Json -Depth 6
