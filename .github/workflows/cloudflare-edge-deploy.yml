name: Deploy Cloudflare edge proxy

on:
  workflow_dispatch:
    inputs:
      diagnostics_only:
        description: Read Cloudflare control-plane state without deploying
        required: false
        default: false
        type: boolean
      configure_direct_origin_only:
        description: Point the Pages API proxy at the stable REG.RU HTTPS origin
        required: false
        default: false
        type: boolean
      configure_api_proxy_only:
        description: Deploy the controlled API hostname failover Worker
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/cloudflare-edge-deploy.yml"

permissions:
  contents: read

concurrency:
  group: cloudflare-edge-production
  cancel-in-progress: false

jobs:
  diagnostics:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.diagnostics_only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Inspect Cloudflare control plane safely
        env:
          EXPECTED_ACCOUNT_ID: 594523a2268d250da0b35a34ae6589cd
          EXPECTED_ZONE_ID: 579174730e5da8c0d9e653d8e45e6900
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          base = "https://api.cloudflare.com/client/v4"
          token = os.environ["CLOUDFLARE_API_TOKEN"]
          account_id = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          expected_account_id = os.environ["EXPECTED_ACCOUNT_ID"]
          expected_zone_id = os.environ["EXPECTED_ZONE_ID"]
          failures = []

          if account_id != expected_account_id:
              raise SystemExit("CLOUDFLARE_ACCOUNT_ID does not match the owner-provided account ID")

          def get(label, path):
              request = urllib.request.Request(
                  base + path,
                  headers={"Authorization": f"Bearer {token}", "Accept": "application/json"},
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      payload = json.load(response)
                      print(json.dumps({"label": label, "http_status": response.status, "payload": payload}, ensure_ascii=False))
                      return payload
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", "replace")
                  try:
                      detail = json.loads(body)
                  except json.JSONDecodeError:
                      detail = {"message": body[:1000]}
                  print(json.dumps({"label": label, "http_status": exc.code, "error": detail}, ensure_ascii=False))
                  failures.append({"label": label, "path": path, "http_status": exc.code})
                  return None

          get("token_verify", f"/accounts/{account_id}/tokens/verify")
          get("account", f"/accounts/{account_id}")
          zones = get("zone", "/zones?" + urllib.parse.urlencode({"name": "dezster.ru", "account.id": account_id}))
          zone_results = zones.get("result", []) if zones else []
          if len(zone_results) != 1 or zone_results[0].get("id") != expected_zone_id:
              failures.append({"label": "zone_identity", "message": "Expected exactly the owner-provided zone ID"})
          zone_id = zone_results[0]["id"] if len(zone_results) == 1 else expected_zone_id
          get("dns_records", f"/zones/{zone_id}/dns_records?per_page=100")
          get("worker_routes", f"/zones/{zone_id}/workers/routes")
          get("worker_scripts", f"/accounts/{account_id}/workers/scripts")
          get("domain_worker_settings", f"/accounts/{account_id}/workers/scripts/bankrotai-domain-proxy/settings")
          get("legacy_tunnel_worker_settings", f"/accounts/{account_id}/workers/scripts/bankrotai-tunnel-proxy/settings")
          get("pages_projects", f"/accounts/{account_id}/pages/projects")
          tunnels = get("tunnels", f"/accounts/{account_id}/cfd_tunnel?is_deleted=false&per_page=100")
          for tunnel in (tunnels.get("result", []) if tunnels else []):
              tunnel_id = tunnel.get("id")
              if not tunnel_id:
                  continue
              get(f"tunnel_config:{tunnel_id}", f"/accounts/{account_id}/cfd_tunnel/{tunnel_id}/configurations")
              get(f"tunnel_connections:{tunnel_id}", f"/accounts/{account_id}/cfd_tunnel/{tunnel_id}/connections")
          if failures:
              print(json.dumps({"cloudflare_diagnostics_failures": failures}, ensure_ascii=False))
              sys.exit(1)
          PY

  configure-direct-origin:
    if: github.event_name == 'workflow_dispatch' && inputs.configure_direct_origin_only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - name: Restore canonical DNS records to captured BEFORE state
        env:
          EXPECTED_ACCOUNT_ID: 594523a2268d250da0b35a34ae6589cd
          EXPECTED_ZONE_ID: 579174730e5da8c0d9e653d8e45e6900
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test "$CLOUDFLARE_ACCOUNT_ID" = "$EXPECTED_ACCOUNT_ID"
          python - <<'PY'
          import json
          import os
          import urllib.request

          api = "https://api.cloudflare.com/client/v4"
          token = os.environ["CLOUDFLARE_API_TOKEN"]
          zone_id = os.environ["EXPECTED_ZONE_ID"]
          before = [
              {"id": "24f2e9b3f7473a6de9823e508ccd9513", "name": "dezster.ru", "type": "A", "content": "194.226.126.233", "ttl": 300, "proxied": False, "comment": None, "tags": []},
              {"id": "fd97cd149b4176329c039f949e7b8a9f", "name": "www.dezster.ru", "type": "A", "content": "194.226.126.233", "ttl": 300, "proxied": False, "comment": None, "tags": []},
              {"id": "9e8e98e68ace6e9b756d87a54d03f656", "name": "api.dezster.ru", "type": "A", "content": "194.226.126.233", "ttl": 300, "proxied": False, "comment": None, "tags": []},
          ]
          headers = {"Authorization": f"Bearer {token}", "Accept": "application/json", "Content-Type": "application/json"}

          def request(method, path, payload=None):
              body = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(api + path, data=body, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=30) as response:
                  result = json.load(response)
              if not result.get("success"):
                  raise RuntimeError(result.get("errors"))
              return result["result"]

          restored = []
          for expected in before:
              current = request("GET", f"/zones/{zone_id}/dns_records/{expected['id']}")
              identity = (current.get("name"), current.get("type"), current.get("content"))
              wanted = (expected["name"], expected["type"], expected["content"])
              if identity != wanted:
                  raise SystemExit(f"DNS record identity mismatch for {expected['id']}")
              payload = {key: expected[key] for key in ("name", "type", "content", "ttl", "proxied", "comment", "tags")}
              result = request("PUT", f"/zones/{zone_id}/dns_records/{expected['id']}", payload)
              restored.append({"id": result["id"], "name": result["name"], "type": result["type"], "content": result["content"], "ttl": result["ttl"], "proxied": result["proxied"]})
          with open("cloudflare-dns-rollback.json", "w", encoding="utf-8") as output:
              json.dump(restored, output, ensure_ascii=False, indent=2)
          print(json.dumps({"rollback_after": restored}, ensure_ascii=False))
          PY
      - name: Enable canonical Cloudflare proxy with automatic rollback
        if: ${{ false }}
        env:
          EXPECTED_ACCOUNT_ID: 594523a2268d250da0b35a34ae6589cd
          EXPECTED_ZONE_ID: 579174730e5da8c0d9e653d8e45e6900
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test "$CLOUDFLARE_ACCOUNT_ID" = "$EXPECTED_ACCOUNT_ID"
          python - <<'PY'
          import json
          import os
          import ssl
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          api = "https://api.cloudflare.com/client/v4"
          token = os.environ["CLOUDFLARE_API_TOKEN"]
          account_id = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          zone_id = os.environ["EXPECTED_ZONE_ID"]
          expected_account_id = os.environ["EXPECTED_ACCOUNT_ID"]
          names = ("dezster.ru", "www.dezster.ru", "api.dezster.ru")
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/json",
              "Content-Type": "application/json",
          }

          if account_id != expected_account_id:
              raise SystemExit("Cloudflare account identity mismatch")

          def cf_request(method, path, payload=None):
              body = None if payload is None else json.dumps(payload).encode()
              request = urllib.request.Request(api + path, data=body, headers=headers, method=method)
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.load(response)
              if not result.get("success"):
                  raise RuntimeError(f"Cloudflare API rejected {method} {path}: {result.get('errors')}")
              return result

          zones = cf_request(
              "GET",
              "/zones?" + urllib.parse.urlencode({"name": "dezster.ru", "account.id": account_id}),
          )["result"]
          if len(zones) != 1 or zones[0].get("id") != zone_id:
              raise SystemExit("Cloudflare zone identity mismatch")

          all_records = cf_request("GET", f"/zones/{zone_id}/dns_records?per_page=100")["result"]
          selected = []
          for name in names:
              matches = [record for record in all_records if record.get("name") == name]
              if len(matches) != 1:
                  raise SystemExit(f"Expected exactly one DNS record for {name}; found {len(matches)}")
              record = matches[0]
              if not record.get("proxiable"):
                  raise SystemExit(f"DNS record is not proxiable: {name}")
              selected.append(record)

          routes = cf_request("GET", f"/zones/{zone_id}/workers/routes")["result"]
          scripts = {
              item.get("id")
              for item in cf_request("GET", f"/accounts/{account_id}/workers/scripts")["result"]
          }
          expected_routes = {
              "dezster.ru/*": "bankrotai-domain-proxy",
              "www.dezster.ru/*": "bankrotai-domain-proxy",
              "api.dezster.ru/*": "bankrotai-api-proxy",
          }
          route_map = {item.get("pattern"): item.get("script") for item in routes}
          if any(route_map.get(pattern) != script for pattern, script in expected_routes.items()):
              raise SystemExit("Canonical Worker route identity mismatch")
          if not set(expected_routes.values()).issubset(scripts):
              raise SystemExit("Canonical Worker script is missing")

          def snapshot(record):
              return {
                  "id": record["id"],
                  "name": record["name"],
                  "type": record["type"],
                  "content": record["content"],
                  "ttl": record["ttl"],
                  "proxied": bool(record.get("proxied")),
                  "comment": record.get("comment"),
                  "tags": record.get("tags", []),
              }

          before = [snapshot(record) for record in selected]
          with open("cloudflare-dns-before.json", "w", encoding="utf-8") as output:
              json.dump(before, output, ensure_ascii=False, indent=2)
          print(json.dumps({"dns_before": before}, ensure_ascii=False))

          def record_payload(record, proxied):
              payload = {
                  "type": record["type"],
                  "name": record["name"],
                  "content": record["content"],
                  "ttl": record["ttl"],
                  "proxied": proxied,
              }
              if record.get("comment") is not None:
                  payload["comment"] = record["comment"]
              if record.get("tags") is not None:
                  payload["tags"] = record.get("tags", [])
              return payload

          changed = []
          try:
              for record in selected:
                  if record.get("proxied"):
                      continue
                  cf_request(
                      "PUT",
                      f"/zones/{zone_id}/dns_records/{record['id']}",
                      record_payload(record, True),
                  )
                  changed.append(record)

              context = ssl.create_default_context()

              def status(url):
                  request = urllib.request.Request(
                      url,
                      headers={"Cache-Control": "no-cache", "User-Agent": "DEZSTER-DNS-Gate/1.0"},
                  )
                  try:
                      with urllib.request.urlopen(request, timeout=20, context=context) as response:
                          return response.status, response.read(4096)
                  except urllib.error.HTTPError as error:
                      return error.code, error.read(4096)
                  except (urllib.error.URLError, TimeoutError, OSError):
                      return 0, b""

              checks = None
              for _attempt in range(24):
                  deployment_status, deployment_body = status("https://dezster.ru/deployment.json")
                  web_live, _ = status("https://dezster.ru/health/live")
                  web_ready, _ = status("https://dezster.ru/health/ready")
                  api_live, _ = status("https://api.dezster.ru/health/live")
                  api_ready, _ = status("https://api.dezster.ru/health/ready")
                  auth_status, _ = status("https://dezster.ru/api/auth/me")
                  direct_ready, _ = status("https://194-226-126-233.sslip.io/health/ready")
                  try:
                      deployed_commit = json.loads(deployment_body).get("commit", "")
                  except (json.JSONDecodeError, AttributeError):
                      deployed_commit = ""
                  checks = {
                      "deployment": deployment_status,
                      "deployed_commit_present": bool(deployed_commit),
                      "web_live": web_live,
                      "web_ready": web_ready,
                      "api_live": api_live,
                      "api_ready": api_ready,
                      "auth": auth_status,
                      "direct_ready": direct_ready,
                  }
                  if checks == {
                      "deployment": 200,
                      "deployed_commit_present": True,
                      "web_live": 200,
                      "web_ready": 200,
                      "api_live": 200,
                      "api_ready": 200,
                      "auth": 401,
                      "direct_ready": 200,
                  }:
                      break
                  time.sleep(5)
              else:
                  raise RuntimeError(f"Canonical route did not stabilize: {checks}")

              after_records = cf_request("GET", f"/zones/{zone_id}/dns_records?per_page=100")["result"]
              after = [snapshot(record) for record in after_records if record.get("name") in names]
              with open("cloudflare-dns-after.json", "w", encoding="utf-8") as output:
                  json.dump(after, output, ensure_ascii=False, indent=2)
              print(json.dumps({"canonical_checks": checks, "dns_after": after}, ensure_ascii=False))
          except BaseException:
              rollback_errors = []
              for record in reversed(changed):
                  try:
                      cf_request(
                          "PUT",
                          f"/zones/{zone_id}/dns_records/{record['id']}",
                          record_payload(record, bool(record.get("proxied"))),
                      )
                  except Exception as error:
                      rollback_errors.append({"name": record["name"], "error": str(error)})
              print(json.dumps({"rollback_restored": [record["name"] for record in changed], "rollback_errors": rollback_errors}, ensure_ascii=False))
              if rollback_errors:
                  raise RuntimeError(f"DNS rollback was incomplete: {rollback_errors}")
              raise
          PY
      - name: Configure encrypted Pages API origin
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          printf '%s' 'https://194-226-126-233.sslip.io' \
            | npx wrangler@4 pages secret put KOYEB_API_ORIGIN --project-name bankrotai
      - name: Preserve sanitized DNS evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cloudflare-dns-switch-${{ github.run_id }}
          path: cloudflare-dns-*.json
          if-no-files-found: warn
          retention-days: 30

  configure-api-proxy:
    if: github.event_name == 'workflow_dispatch' && inputs.configure_api_proxy_only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      KOYEB_SERVICE_KEY: ${{ secrets.KOYEB_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: WEB/package-lock.json }
      - working-directory: WEB
        run: npm ci
      - name: Test and validate API proxy
        working-directory: WEB
        run: |
          set -euo pipefail
          npm test -- api-proxy/worker.test.mjs
          npx wrangler@4 deploy --dry-run --config api-proxy/wrangler.jsonc
      - name: Configure encrypted API service binding
        working-directory: WEB
        run: |
          set -euo pipefail
          test -n "$KOYEB_SERVICE_KEY"
          printf '%s' "$KOYEB_SERVICE_KEY" \
            | npx wrangler@4 secret put KOYEB_SERVICE_KEY --config api-proxy/wrangler.jsonc
      - name: Deploy API failover route
        working-directory: WEB
        run: npx wrangler@4 deploy --config api-proxy/wrangler.jsonc --keep-vars

  deploy:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.diagnostics_only && !inputs.configure_direct_origin_only && !inputs.configure_api_proxy_only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      KOYEB_SERVICE_KEY: ${{ secrets.KOYEB_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: WEB/package-lock.json }
      - name: Require scoped Cloudflare deployment credentials
        run: test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$KOYEB_SERVICE_KEY"
      - working-directory: WEB
        run: npm ci
      - name: Validate and build Pages release
        working-directory: WEB
        run: |
          set -euo pipefail
          npm run typecheck
          npm run lint
          npm test
          npm run build
          test "$(python -c 'import json; print(json.load(open("dist/deployment.json"))["commit"])')" = "$GITHUB_SHA"
      - name: Validate Worker bundle
        working-directory: WEB
        run: |
          set -euo pipefail
          npx wrangler@4 deploy --dry-run --config edge-proxy/wrangler.jsonc
          npx wrangler@4 deploy --dry-run --config api-proxy/wrangler.jsonc
      - name: Verify staged home API before changing canonical edge
        env:
          E2E_USERNAME: ${{ vars.AUTH_BOOTSTRAP_USERNAME || 'reader' }}
          E2E_PASSWORD: ${{ secrets.AUTH_BOOTSTRAP_PASSWORD }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            STAGED_SHA="$(curl --fail --silent --show-error --max-time 20 \
              -H 'Cache-Control: no-cache' \
              https://194-226-126-233.sslip.io/deployment.json 2>/dev/null \
              | python -c 'import json,sys; print(json.load(sys.stdin).get("commit", ""))' 2>/dev/null || true)"
            if test "$STAGED_SHA" = "$GITHUB_SHA"; then
              break
            fi
            if test "$attempt" = 60; then
              echo "REG.RU staged release did not reach $GITHUB_SHA" >&2
              exit 1
            fi
            sleep 5
          done
          for stability_check in $(seq 1 20); do
            test "$(curl --silent --show-error --max-time 20 -o /dev/null -w '%{http_code}' \
              https://194-226-126-233.sslip.io/health/live || true)" = "200"
            test "$(curl --silent --show-error --max-time 30 -o /dev/null -w '%{http_code}' \
              https://194-226-126-233.sslip.io/health/ready || true)" = "200"
            if test "$stability_check" != 20; then
              sleep 2
            fi
          done
          LOGIN_PAYLOAD="$(python -c 'import json,os; print(json.dumps({"username": os.environ["E2E_USERNAME"], "password": os.environ["E2E_PASSWORD"]}))')"
          curl --fail --silent --show-error --max-time 30 \
            -H "X-API-Key: $KOYEB_SERVICE_KEY" \
            -H 'Content-Type: application/json' \
            -c "$RUNNER_TEMP/home-primary.cookies" \
            --data "$LOGIN_PAYLOAD" \
            https://194-226-126-233.sslip.io/api/auth/login >/dev/null
          DATASET_JSON="$(curl --fail --silent --show-error --max-time 30 \
            -H "X-API-Key: $KOYEB_SERVICE_KEY" \
            -b "$RUNNER_TEMP/home-primary.cookies" \
            https://194-226-126-233.sslip.io/api/map/datasets/current)"
          printf '%s' "$DATASET_JSON" | python -c \
            'import json,sys; d=json.load(sys.stdin); assert d["version"] and d["point_count"] > 0 and d["tile_count"] > 0 and d["published_at"]'
      - name: Deploy Pages release
        working-directory: WEB
        run: >-
          npx wrangler@4 pages deploy dist
          --project-name bankrotai
          --branch main
          --commit-hash "$GITHUB_SHA"
      - name: Deploy API failover proxy
        working-directory: WEB
        run: |
          set -euo pipefail
          printf '%s' "$KOYEB_SERVICE_KEY" \
            | npx wrangler@4 secret put KOYEB_SERVICE_KEY --config api-proxy/wrangler.jsonc
          npx wrangler@4 deploy --config api-proxy/wrangler.jsonc --keep-vars
      - name: Deploy edge proxy with current API service binding
        working-directory: WEB
        run: npx wrangler@4 deploy --config edge-proxy/wrangler.jsonc
      - name: Verify canonical edge behavior
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            PAGES_SHA="$(curl --ipv4 --fail --silent --show-error --max-time 20 \
              -H 'Cache-Control: no-cache' https://bankrotai.pages.dev/deployment.json 2>/dev/null \
              | python -c 'import json,sys; print(json.load(sys.stdin).get("commit", ""))' 2>/dev/null || true)"
            CANONICAL_SHA="$(curl --ipv4 --fail --silent --show-error --max-time 20 \
              -H 'Cache-Control: no-cache' https://dezster.ru/deployment.json 2>/dev/null \
              | python -c 'import json,sys; print(json.load(sys.stdin).get("commit", ""))' 2>/dev/null || true)"
            AUTH_STATUS="$(curl --ipv4 --silent --show-error --max-time 20 -o /dev/null -w '%{http_code}' \
              https://dezster.ru/api/auth/me || true)"
            if test "$PAGES_SHA" = "$GITHUB_SHA" \
              && test "$CANONICAL_SHA" = "$GITHUB_SHA" \
              && test "$AUTH_STATUS" = "401"; then
              break
            fi
            if test "$attempt" = 24; then
              echo "Cloudflare verification failed: pages_sha=${PAGES_SHA:-missing} canonical_sha=${CANONICAL_SHA:-missing} auth_status=${AUTH_STATUS:-missing}" >&2
              exit 1
            fi
            sleep 5
          done
          curl --ipv4 --fail --silent --show-error --max-time 20 -I https://dezster.ru/deployment.json \
            | grep -qi '^cache-control: no-store'
          curl --ipv4 --fail --silent --show-error --max-time 20 -I https://dezster.ru/ \
            | grep -qi '^strict-transport-security:'
