name: Deploy Cloudflare edge proxy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-edge-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: WEB/package-lock.json }
      - name: Require a scoped Cloudflare deploy token
        run: test -n "$CLOUDFLARE_API_TOKEN"
      - working-directory: WEB
        run: npm ci
      - name: Validate Worker bundle
        working-directory: WEB
        run: npx wrangler@4 deploy --dry-run --config edge-proxy/wrangler.jsonc
      - name: Deploy edge proxy
        working-directory: WEB
        run: npx wrangler@4 deploy --config edge-proxy/wrangler.jsonc
      - name: Verify canonical edge behavior
        run: |
          set -euo pipefail
          test "$(curl --silent --show-error --max-time 20 -o /dev/null -w '%{http_code}' \
            https://dezster.ru/api/auth/me)" = "401"
          curl --fail --silent --show-error --max-time 20 -I https://dezster.ru/ \
            | grep -qi '^strict-transport-security:'
