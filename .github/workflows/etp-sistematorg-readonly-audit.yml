name: ETP Sistematorg read-only audit

on:
  pull_request:
    paths:
      - "src/bankrotai/connectors/etp_sources/common.py"
      - "src/bankrotai/connectors/etp_sources/sistematorg_contract.py"
      - "src/bankrotai/services/etp_sistematorg_price_audit.py"
      - "tests/test_sistematorg_contract.py"
      - "docs/ETP_SISTEMATORG_AUDIT_2026-11-09.md"
      - ".github/workflows/etp-sistematorg-readonly-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: etp-sistematorg-readonly-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract-and-live-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install project test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Focused Sistematorg regression tests
        run: |
          python -m pytest -q tests/test_sistematorg_contract.py
          python -m pytest -q tests/test_etp_sources.py -k sistematorg

      - name: Static checks for changed Python
        run: |
          python -m ruff check             src/bankrotai/connectors/etp_sources/common.py             src/bankrotai/connectors/etp_sources/sistematorg_contract.py             src/bankrotai/services/etp_sistematorg_price_audit.py             tests/test_sistematorg_contract.py

      - name: Two-pass full public catalogue audit
        run: |
          python -m bankrotai.services.etp_sistematorg_price_audit             --passes 2             --max-pages 1000             --max-details 30             --delay-seconds 0.25 | tee sistematorg-audit.json

      - name: Enforce live acceptance evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("sistematorg-audit.json").read_text(encoding="utf-8"))
          passes = report["passes"]
          assert len(passes) == 2, report
          assert all(item["terminal_page"] is not None for item in passes), report
          assert report["two_pass_identity_stable"] is True, report
          assert passes[0]["unique_individual_ids"] == passes[1]["unique_individual_ids"], report
          assert passes[0]["identity_digest"] == passes[1]["identity_digest"], report
          assert report.get("unique_detail_ids_verified", 0) >= 30, report
          assert report.get("details_verified", 0) >= 30, report
          assert report.get("prices_verified", 0) >= 30, report
          assert report.get("status_verified", 0) >= 30, report
          assert report.get("production_database_writes") == 0, report
          assert report.get("archival_allowed") is False, report
          assert report.get("reconciliation_allowed") is False, report
          assert report.get("production_enabled") is False, report
          print(json.dumps({
              "terminal_page": passes[0]["terminal_page"],
              "procedures": passes[0].get("procedures"),
              "individual_lots": passes[0].get("individual_lots"),
              "property_lots": passes[0].get("property_lots"),
              "unique_individual_ids": passes[0]["unique_individual_ids"],
              "details_verified": report.get("details_verified"),
              "prices_verified": report.get("prices_verified"),
              "status_verified": report.get("status_verified"),
          }, ensure_ascii=False, sort_keys=True))
          PY
