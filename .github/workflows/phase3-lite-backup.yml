name: Phase 3 Lite backup and restore drill

on:
  workflow_dispatch:
    inputs:
      verify_restore:
        description: 'Restore the backup into an isolated PostgreSQL container'
        type: boolean
        default: true
  schedule:
    - cron: '17 2 * * 1-6'
    - cron: '47 2 * * 0'
  push:
    branches: [main]
    paths:
      - 'scripts/backup-home-postgres.ps1'
      - '.github/workflows/phase3-lite-backup.yml'

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: phase3-lite-backup-dr
  cancel-in-progress: false

jobs:
  wait-home-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Wait for the same main revision on the home origin
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 1120); do
            state="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&event=push&per_page=50" \
              | python -c 'import json,sys; runs=json.load(sys.stdin).get("workflow_runs", []); r=next((x for x in runs if x.get("name")=="Deploy home secondary origin"), None); print("missing" if r is None else "{}:{}".format(r.get("status"), r.get("conclusion")))')"
            if [ "$state" = "completed:success" ]; then exit 0; fi
            case "$state" in
              completed:*) echo "Home deploy failed: $state" >&2; exit 1 ;;
            esac
            sleep 15
          done
          echo "Timed out waiting for home deployment of $GITHUB_SHA" >&2
          exit 1

  backup:
    needs: wait-home-deploy
    runs-on: [self-hosted, Windows, X64, bankrotai-home]
    timeout-minutes: 240
    steps:
      - name: Clear stale runner Git lock
        shell: powershell
        run: |
          foreach ($lockName in @('AUTO_MERGE.lock', 'packed-refs.lock')) {
            $lock = Join-Path $env:GITHUB_WORKSPACE ('.git\' + $lockName)
            if (Test-Path -LiteralPath $lock) {
              Remove-Item -LiteralPath $lock -Force -ErrorAction SilentlyContinue
              Write-Output "Removed stale Git lock: $lockName"
            }
          }
      - uses: actions/checkout@v7
      - name: Reclaim safe backup space under critical disk pressure
        shell: powershell
        run: |
          $minimumFreeGb = 20
          $targetFreeGb = 25
          function Get-FreeGb {
            $drive = Get-PSDrive -Name C
            return [math]::Round($drive.Free / 1GB, 2)
          }

          $freeGb = Get-FreeGb
          if ($freeGb -ge $minimumFreeGb) {
            Write-Output "C: backup preflight OK: $freeGb GB free"
            exit 0
          }

          $drBackupRoot = 'C:\ProgramData\BankrotAI\dr-backups'
          if (Test-Path -LiteralPath $drBackupRoot) {
            $dumpFiles = @(Get-ChildItem -LiteralPath $drBackupRoot -File -Filter 'bankrotai-*.dump' | Sort-Object LastWriteTimeUtc -Descending)
            $protected = New-Object 'System.Collections.Generic.HashSet[string]'
            $verified = @(Get-ChildItem -LiteralPath $drBackupRoot -File -Filter 'bankrotai-*.json' | Sort-Object LastWriteTimeUtc -Descending | ForEach-Object {
              try {
                $meta = Get-Content -LiteralPath $_.FullName -Raw | ConvertFrom-Json
                if ($meta.restore_verification -eq 'passed' -and $meta.backup_file) { $meta }
              } catch {}
            } | Select-Object -First 1)
            if ($verified.Count -gt 0 -and (Test-Path -LiteralPath ([string]$verified[0].backup_file))) {
              [void]$protected.Add([string]$verified[0].backup_file)
            } elseif ($dumpFiles.Count -gt 0) {
              [void]$protected.Add($dumpFiles[0].FullName)
            }
            foreach ($dump in ($dumpFiles | Sort-Object LastWriteTimeUtc)) {
              if ($protected.Contains($dump.FullName)) { continue }
              $stem = [System.IO.Path]::GetFileNameWithoutExtension($dump.Name)
              Remove-Item -LiteralPath $dump.FullName -Force
              $metaPath = Join-Path $drBackupRoot "$stem.json"
              if (Test-Path -LiteralPath $metaPath) { Remove-Item -LiteralPath $metaPath -Force }
              if ((Get-FreeGb) -ge $targetFreeGb) { break }
            }
          }

          if ((Get-FreeGb) -lt $minimumFreeGb) {
            $migrationRoot = 'C:\ProgramData\BankrotAI\db-backups'
            if (Test-Path -LiteralPath $migrationRoot) {
              Get-ChildItem -LiteralPath $migrationRoot -File -Filter 'pre-migration-*.dump' | Sort-Object LastWriteTimeUtc -Descending | Select-Object -Skip 1 | Remove-Item -Force
            }
          }

          $freeGb = Get-FreeGb
          Write-Output "C: backup preflight after cleanup: $freeGb GB free"
          if ($freeGb -lt $minimumFreeGb) { throw "Backup refused: C: has only $freeGb GB free; minimum is $minimumFreeGb GB" }
      - name: Create backup and run scheduled restore drill
        shell: powershell
        run: |
          $verify = $false
          if ('${{ github.event_name }}' -eq 'push') { $verify = $true }
          if ('${{ github.event.schedule }}' -eq '47 2 * * 0') { $verify = $true }
          if ('${{ github.event_name }}' -eq 'workflow_dispatch' -and '${{ inputs.verify_restore }}' -eq 'true') { $verify = $true }
          .\scripts\backup-home-postgres.ps1 `
            -Destination 'C:\ProgramData\BankrotAI\dr-backups' `
            -RetainDays 14 `
            -VerifyRestore:$verify
          $latest = Get-ChildItem 'C:\ProgramData\BankrotAI\dr-backups' -Filter 'bankrotai-*.json' -File |
            Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          if ($latest) { Copy-Item $latest.FullName "$env:RUNNER_TEMP\phase3-backup-result.json" -Force }
      - name: Upload backup metadata
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase3-backup-${{ github.run_id }}
          path: ${{ runner.temp }}\phase3-backup-result.json
          if-no-files-found: ignore
          retention-days: 30

  alert:
    needs: backup
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const title = '[Phase 3] Backup/restore alert';
            const body = `Backup or isolated restore verification failed.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const {data: issues} = await github.rest.issues.listForRepo({...context.repo, state: 'open', per_page: 100});
            const existing = issues.find(issue => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({...context.repo, issue_number: existing.number, body});
            } else {
              await github.rest.issues.create({...context.repo, title, body});
            }

  recovery:
    needs: backup
    if: success()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const title = '[Phase 3] Backup/restore alert';
            const {data: issues} = await github.rest.issues.listForRepo({...context.repo, state: 'open', per_page: 100});
            const existing = issues.find(issue => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({...context.repo, issue_number: existing.number, body: `Recovered on run ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}.`});
              await github.rest.issues.update({...context.repo, issue_number: existing.number, state: 'closed'});
            }
