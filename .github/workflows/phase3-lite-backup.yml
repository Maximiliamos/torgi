name: Phase 3 Lite backup and restore drill

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/backup-home-postgres.ps1'
      - '.github/workflows/phase3-lite-backup.yml'

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: phase3-lite-backup-dr
  cancel-in-progress: false

jobs:
  wait-home-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Wait for the same main revision on the home origin
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 1120); do
            state="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&event=push&per_page=50" \
              | python -c 'import json,sys; runs=json.load(sys.stdin).get("workflow_runs", []); r=next((x for x in runs if x.get("name")=="Deploy home secondary origin"), None); print("missing" if r is None else "{}:{}".format(r.get("status"), r.get("conclusion")))')"
            if [ "$state" = "completed:success" ]; then exit 0; fi
            case "$state" in
              completed:*) echo "Home deploy failed: $state" >&2; exit 1 ;;
            esac
            sleep 15
          done
          echo "Timed out waiting for home deployment of $GITHUB_SHA" >&2
          exit 1

  backup:
    needs: wait-home-deploy
    runs-on: [self-hosted, Windows, X64, bankrotai-home]
    timeout-minutes: 240
    steps:
      - name: Clear stale runner Git lock
        shell: powershell
        run: |
          foreach ($lockName in @('AUTO_MERGE.lock', 'packed-refs.lock')) {
            $lock = Join-Path $env:GITHUB_WORKSPACE ('.git\' + $lockName)
            if (Test-Path -LiteralPath $lock) {
              Remove-Item -LiteralPath $lock -Force -ErrorAction SilentlyContinue
              Write-Output "Removed stale Git lock: $lockName"
            }
          }
      - uses: actions/checkout@v7
      - name: Decide whether the 48-hour backup is due
        id: cadence
        shell: powershell
        run: |
          $root = 'D:\BankrotAI\dr-backups'
          $due = $true
          if ('${{ github.event_name }}' -eq 'schedule' -and (Test-Path -LiteralPath $root)) {
            $latestVerified = Get-ChildItem -LiteralPath $root -File -Filter 'bankrotai-*.json' |
              Sort-Object LastWriteTimeUtc -Descending |
              ForEach-Object {
                try {
                  $meta = Get-Content -LiteralPath $_.FullName -Raw | ConvertFrom-Json
                  if ($meta.restore_verification -eq 'passed' -and $meta.backup_file -and (Test-Path -LiteralPath ([string]$meta.backup_file))) {
                    [pscustomobject]@{ File = $_; Metadata = $meta }
                  }
                } catch {}
              } |
              Select-Object -First 1
            if ($latestVerified) {
              $ageHours = ((Get-Date).ToUniversalTime() - $latestVerified.File.LastWriteTimeUtc).TotalHours
              Write-Output "Latest verified D: backup age: $([math]::Round($ageHours,2)) hours"
              if ($ageHours -lt 46) { $due = $false }
            }
          }
          "due=$($due.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          Write-Output "Backup due=$due"

      - name: Verify C temp headroom and D backup capacity
        if: steps.cadence.outputs.due == 'true'
        shell: powershell
        run: |
          if (-not (Get-PSDrive -Name D -ErrorAction SilentlyContinue)) {
            throw 'Backup refused: D: drive is not available'
          }
          $root = 'D:\BankrotAI\dr-backups'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $latestDump = Get-ChildItem -LiteralPath $root -File -Filter 'bankrotai-*.dump' |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          $estimatedGb = if ($latestDump) { [math]::Ceiling(($latestDump.Length / 1GB) * 1.25) } else { 30 }
          $requiredGb = [math]::Max(30, $estimatedGb)
          $cFree = [math]::Round((Get-PSDrive -Name C).Free / 1GB, 2)
          $dFree = [math]::Round((Get-PSDrive -Name D).Free / 1GB, 2)
          Write-Output "Backup preflight: C temp headroom=$cFree GB; D destination headroom=$dFree GB; required=$requiredGb GB"
          if ($cFree -lt $requiredGb) { throw "Backup refused: C: has only $cFree GB free; temporary pg_dump needs about $requiredGb GB" }
          if ($dFree -lt $requiredGb) { throw "Backup refused: D: has only $dFree GB free; destination needs about $requiredGb GB" }

      - name: Create verified backup and keep only the newest pair
        if: steps.cadence.outputs.due == 'true'
        shell: powershell
        run: |
          .\scripts\backup-home-postgres.ps1 -Destination 'D:\BankrotAI\dr-backups' -RetainCount 1 -VerifyRestore
          $latest = Get-ChildItem 'D:\BankrotAI\dr-backups' -Filter 'bankrotai-*.json' -File |
            Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          if (-not $latest) { throw 'Verified backup metadata was not created on D:' }
          $meta = Get-Content -LiteralPath $latest.FullName -Raw | ConvertFrom-Json
          if ($meta.restore_verification -ne 'passed') { throw "Latest D: backup is not restore-verified: $($meta.restore_verification)" }
          Copy-Item $latest.FullName "$env:RUNNER_TEMP\phase3-backup-result.json" -Force

      - name: Remove superseded C backup roots after verified D backup
        if: steps.cadence.outputs.due == 'true'
        shell: powershell
        run: |
          $root = 'D:\BankrotAI\dr-backups'
          $latest = Get-ChildItem -LiteralPath $root -File -Filter 'bankrotai-*.json' |
            Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          if (-not $latest) { throw 'Refusing C backup cleanup: verified D metadata is missing' }
          $meta = Get-Content -LiteralPath $latest.FullName -Raw | ConvertFrom-Json
          if ($meta.restore_verification -ne 'passed' -or -not $meta.backup_file -or -not (Test-Path -LiteralPath ([string]$meta.backup_file))) {
            throw 'Refusing C backup cleanup: latest D backup is not restore-verified'
          }
          $actual = (Get-FileHash -LiteralPath ([string]$meta.backup_file) -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne ([string]$meta.sha256).ToLowerInvariant()) {
            throw 'Refusing C backup cleanup: latest D backup checksum mismatch'
          }
          foreach ($legacy in @(
            'C:\BankrotAI\backups\postgres',
            'C:\ProgramData\BankrotAI\backups',
            'C:\ProgramData\BankrotAI\dr-backups',
            'C:\ProgramData\BankrotAI\db-backups'
          )) {
            if (Test-Path -LiteralPath $legacy) {
              Write-Output "Removing superseded backup root: $legacy"
              Remove-Item -LiteralPath $legacy -Recurse -Force
            }
          }

      - name: Upload backup metadata
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase3-backup-${{ github.run_id }}
          path: ${{ runner.temp }}\phase3-backup-result.json
          if-no-files-found: ignore
          retention-days: 30

  alert:
    needs: backup
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const title = '[Phase 3] Backup/restore alert';
            const body = `Backup or isolated restore verification failed.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const {data: issues} = await github.rest.issues.listForRepo({...context.repo, state: 'open', per_page: 100});
            const existing = issues.find(issue => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({...context.repo, issue_number: existing.number, body});
            } else {
              await github.rest.issues.create({...context.repo, title, body});
            }

  recovery:
    needs: backup
    if: success()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const title = '[Phase 3] Backup/restore alert';
            const {data: issues} = await github.rest.issues.listForRepo({...context.repo, state: 'open', per_page: 100});
            const existing = issues.find(issue => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({...context.repo, issue_number: existing.number, body: `Recovered on run ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}.`});
              await github.rest.issues.update({...context.repo, issue_number: existing.number, state: 'closed'});
            }
