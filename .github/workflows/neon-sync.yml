name: Neon migrations and read-model sync

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: neon-production-sync
  cancel-in-progress: false

jobs:
  migrate-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      APP_ENV: production
      API_READ_ONLY: "true"
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      DATABASE_MIGRATION_URL: ${{ secrets.NEON_DATABASE_MIGRATION_URL }}
      BANKROTAI_API_KEY: ${{ secrets.KOYEB_SERVICE_KEY }}
      AUTH_SESSION_SECRET: ${{ secrets.AUTH_SESSION_SECRET }}
      AUTH_BOOTSTRAP_PASSWORD: ${{ secrets.AUTH_BOOTSTRAP_PASSWORD }}
      BACKUP_ENCRYPTION_PASSWORD: ${{ secrets.BACKUP_ENCRYPTION_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - name: Install PostgreSQL 17 client
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl ca-certificates

          sudo install -d /usr/share/postgresql-common/pgdg

          sudo curl --fail --silent --show-error \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc

          . /etc/os-release

          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-17

          /usr/lib/postgresql/17/bin/pg_dump --version
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - name: Apply migrations using direct Neon URL
        run: alembic upgrade head
      - name: Ensure initial reader exists
        run: python -m bankrotai.cli create-user "${{ vars.AUTH_BOOTSTRAP_USERNAME || 'reader' }}"
      - name: Synchronize read model
        run: python -m bankrotai.cli sync-read-model --max-items-per-source 5000
      - name: Verify readiness schema and counts
        run: python scripts/verify_postgres.py
      - name: Create encrypted PostgreSQL recovery dump
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BACKUP_ENCRYPTION_PASSWORD"
          PG_DUMP_URL="${DATABASE_MIGRATION_URL/postgresql+psycopg/postgresql}"
          /usr/lib/postgresql/17/bin/pg_dump "$PG_DUMP_URL" --format=custom --no-owner --no-acl \
            | openssl enc -aes-256-cbc -salt -pbkdf2 -pass env:BACKUP_ENCRYPTION_PASSWORD \
            -out "bankrotai-${GITHUB_RUN_ID}.dump.enc"
      - uses: actions/upload-artifact@v4
        with:
          name: neon-backup-${{ github.run_id }}
          path: bankrotai-${{ github.run_id }}.dump.enc
          retention-days: 3
          if-no-files-found: error

  notify-failure:
    needs: migrate-and-sync
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = `Neon sync failed: ${context.runId}`;
            const body = `Scheduled collector failed. [Open workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`;
            await github.rest.issues.create({ ...context.repo, title, body });
