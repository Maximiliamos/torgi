name: Production functional reliability

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Deploy Cloudflare edge proxy]
    types: [completed]
  schedule:
    - cron: "23 2 * * *"

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: production-functional-reliability
  cancel-in-progress: true

jobs:
  production-functional:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      E2E_BASE_URL: https://dezster.ru
      E2E_PRODUCTION_AUDIT: "1"
      E2E_USERNAME: ${{ vars.AUTH_BOOTSTRAP_USERNAME || 'reader' }}
      E2E_PASSWORD: ${{ secrets.AUTH_BOOTSTRAP_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: WEB/package-lock.json }
      - name: Verify production provenance and public health
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          test -n "$EXPECTED_SHA"
          for attempt in $(seq 1 120); do
            RUN_STATE="$(curl --fail --silent --show-error --max-time 20 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$EXPECTED_SHA&event=push&per_page=50" \
              | python -c 'import json,sys; runs=json.load(sys.stdin).get("workflow_runs", []); run=next((r for r in runs if r.get("name") == "Deploy home secondary origin"), None); print("missing" if run is None else "{}:{}".format(run.get("status"), run.get("conclusion")))')"
            if [ "$RUN_STATE" = 'completed:success' ]; then break; fi
            if [[ "$RUN_STATE" == completed:* ]]; then
              echo "Home deployment failed for $EXPECTED_SHA: $RUN_STATE" >&2
              exit 1
            fi
            if [ "$attempt" -eq 120 ]; then
              echo "Timed out waiting for home deployment of $EXPECTED_SHA" >&2
              exit 1
            fi
            sleep 15
          done
          for attempt in $(seq 1 6); do
            curl --fail --silent --show-error --max-time 20 https://api.dezster.ru/health/live >/dev/null
            curl --fail --silent --show-error --max-time 20 https://api.dezster.ru/health/ready >/dev/null
            test "$(curl --silent --show-error --max-time 30 -o /dev/null -w '%{http_code}' \
              https://dezster.ru/api/auth/me)" = "401"
            if [ "$attempt" -lt 6 ]; then sleep 10; fi
          done
          DEPLOYED_SHA="$(curl --fail --silent --show-error --max-time 20 \
            -H 'Cache-Control: no-cache' https://dezster.ru/deployment.json \
            | python -c 'import json,sys; print(json.load(sys.stdin)["commit"])')"
          test "$DEPLOYED_SHA" = "$EXPECTED_SHA"
      - working-directory: WEB
        run: npm ci
      - working-directory: WEB
        run: npx playwright install --with-deps chromium
      - name: Run real read-only production journey
        working-directory: WEB
        run: npx playwright test e2e/production-readonly.spec.ts --repeat-each=5 --workers=1
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-functional-${{ github.run_id }}
          path: WEB/test-results
          if-no-files-found: ignore
          retention-days: 7

  notify-failure:
    needs: production-functional
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const title = `Production functional reliability failed: ${context.runId}`;
            const body = `The canonical production journey failed. [Open workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`;
            await github.rest.issues.create({ ...context.repo, title, body });
