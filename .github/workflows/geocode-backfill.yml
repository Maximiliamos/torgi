name: Production geocoding backfill

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Bounded number of lots to geocode (1-500)"
        required: true
        default: "10"
        type: number

permissions:
  contents: read

concurrency:
  # Serialize with home-secondary-deploy so the container cannot be replaced
  # while a bounded geocoding batch is running.
  group: home-secondary-production
  cancel-in-progress: false

jobs:
  geocode:
    runs-on: [self-hosted, Windows, X64, bankrotai-home]
    timeout-minutes: 45
    steps:
      - name: Require the canonical home ingestion worker
        shell: powershell
        run: |
          $container = docker ps --filter 'name=^/bankrotai-home-ingestion-worker$' --format '{{.Names}}'
          if ($container -ne 'bankrotai-home-ingestion-worker') {
            throw 'Canonical home ingestion worker is not running'
          }
      - name: Geocode the next bounded batch
        shell: powershell
        run: |
          $limit = [int]"${{ inputs.limit }}"
          if ($limit -lt 1 -or $limit -gt 500) { throw 'limit must be between 1 and 500' }
          docker exec bankrotai-home-ingestion-worker `
            python -m bankrotai.cli geocode-pending --limit $limit
          if ($LASTEXITCODE -ne 0) { throw 'Production geocoding batch failed' }
