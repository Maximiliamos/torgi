name: REG.RU S3 reference-aware immutable GC

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Exact confirmation token from the reviewed read-only plan'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: regru-s3-reference-gc
  cancel-in-progress: false

jobs:
  delete-reviewed-orphans:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ENDPOINT: ${{ vars.REGRU_S3_ENDPOINT }}
      BUCKET: ${{ vars.REGRU_S3_BUCKET }}
      REGION: ${{ vars.REGRU_S3_REGION || 'ru-1' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.REGRU_S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.REGRU_S3_SECRET_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.REGRU_S3_REGION || 'ru-1' }}
      AWS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      EXPECTED_INVENTORY_SHA256: 5e7067d3f861672d8f12996f919068a7bf898a3dcfd1b8c1eabd5fcc0df64e2c
      EXPECTED_PLAN_SHA256: 23df7687c74cbe304dc7b9ec031bb4a8f0080ce0c09fd90fd0b5dbe05f52637e
      EXPECTED_CANDIDATE_COUNT: '133189'
      EXPECTED_CANDIDATE_BYTES: '19891675681'
      EXPECTED_REFERENCED_COUNT: '11950'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate immutable reviewed scope
        shell: bash
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          test "$ENDPOINT" = "https://s3.regru.cloud"
          test "$BUCKET" = "sterdez-map"
          test "$REGION" = "ru-1"
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          test "$CONFIRM" = "DELETE-133189-UNREFERENCED-IMMUTABLE-OBJECTS"

      - name: Rebuild and match the exact reviewed plan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/s3-gc/manifests"
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "s3-gc"
          bucket = os.environ["BUCKET"]
          base = [
              "aws", "--endpoint-url", os.environ["ENDPOINT"],
              "--region", os.environ["REGION"], "s3api",
          ]
          listing = json.loads(subprocess.check_output(base + [
              "list-objects-v2", "--bucket", bucket, "--output", "json",
          ], text=True))
          contents = [{
              "Key": row["Key"],
              "Size": int(row["Size"]),
              "LastModified": row["LastModified"],
          } for row in listing.get("Contents", [])]
          inventory = {"Contents": contents, "IsTruncated": False}
          inventory_path = root / "inventory.json"
          inventory_path.write_text(
              json.dumps(inventory, ensure_ascii=False), encoding="utf-8",
          )
          actual = hashlib.sha256(inventory_path.read_bytes()).hexdigest()
          if actual != os.environ["EXPECTED_INVENTORY_SHA256"]:
              raise SystemExit(f"S3 inventory changed after review: {actual}")
          prefix, suffix = "datasets/", "/manifest.json"
          for row in contents:
              key = row["Key"]
              if not key.startswith(prefix) or not key.endswith(suffix):
                  continue
              version = key[len(prefix):-len(suffix)]
              if not version or "/" in version:
                  continue
              output = root / "manifests" / f"{version}.json"
              subprocess.check_call(base + [
                  "get-object", "--bucket", bucket, "--key", key, str(output),
              ], stdout=subprocess.DEVNULL)
          PY
          python scripts/plan_reg_s3_orphans.py \
            --inventory "$RUNNER_TEMP/s3-gc/inventory.json" \
            --manifests "$RUNNER_TEMP/s3-gc/manifests" \
            --output "$RUNNER_TEMP/s3-gc/plan.json" \
            --min-age-hours 1
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "s3-gc"
          plan_path = root / "plan.json"
          actual = hashlib.sha256(plan_path.read_bytes()).hexdigest()
          if actual != os.environ["EXPECTED_PLAN_SHA256"]:
              raise SystemExit(f"S3 deletion plan changed after review: {actual}")
          plan = json.loads(plan_path.read_text(encoding="utf-8"))
          expected_count = int(os.environ["EXPECTED_CANDIDATE_COUNT"])
          expected_bytes = int(os.environ["EXPECTED_CANDIDATE_BYTES"])
          expected_referenced = int(os.environ["EXPECTED_REFERENCED_COUNT"])
          if plan["candidate_count"] != expected_count:
              raise SystemExit("Candidate count differs from reviewed plan")
          if plan["candidate_bytes"] != expected_bytes:
              raise SystemExit("Candidate bytes differ from reviewed plan")
          if plan["referenced_immutable_count"] != expected_referenced:
              raise SystemExit("Referenced-object count differs from reviewed plan")
          candidates = [row["key"] for row in plan["candidates"]]
          if len(candidates) != len(set(candidates)):
              raise SystemExit("Duplicate candidate key")
          if any(not key.startswith(("bundles/v1/", "indexes/v1/")) for key in candidates):
              raise SystemExit("Candidate escaped immutable prefixes")
          print(json.dumps({
              "reviewed_candidate_count": len(candidates),
              "reviewed_candidate_bytes": plan["candidate_bytes"],
              "referenced_preserved": plan["referenced_immutable_count"],
          }))
          PY

      - name: Delete only the hash-locked unreferenced immutable objects
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          import tempfile
          from pathlib import Path

          plan = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "s3-gc/plan.json").read_text()
          )
          candidates = [row["key"] for row in plan["candidates"]]
          base = [
              "aws", "--endpoint-url", os.environ["ENDPOINT"],
              "--region", os.environ["REGION"], "s3api",
          ]
          deleted = 0
          for offset in range(0, len(candidates), 1000):
              batch = candidates[offset:offset + 1000]
              payload = {"Objects": [{"Key": key} for key in batch], "Quiet": True}
              with tempfile.NamedTemporaryFile(
                  mode="w", encoding="utf-8", suffix=".json", delete=False,
              ) as handle:
                  json.dump(payload, handle, separators=(",", ":"))
                  request_path = handle.name
              try:
                  raw = subprocess.check_output(base + [
                      "delete-objects", "--bucket", os.environ["BUCKET"],
                      "--delete", f"file://{request_path}", "--output", "json",
                  ], text=True)
                  response = json.loads(raw or "{}")
                  if response.get("Errors"):
                      raise RuntimeError(
                          f"S3 batch deletion reported {len(response['Errors'])} errors"
                      )
              finally:
                  os.unlink(request_path)
              deleted += len(batch)
              print(json.dumps({"deleted": deleted, "total": len(candidates)}))
          if deleted != int(os.environ["EXPECTED_CANDIDATE_COUNT"]):
              raise SystemExit("Deleted count differs from reviewed plan")
          PY

      - name: Verify protected manifests, remaining references and free quota
        shell: bash
        run: |
          set -euo pipefail
          for version in \
            20261107T043600093472Z-r6-bundle-s3 \
            20261107T042100085586Z-r6-bundle-s3 \
            20261107T040300145491Z-r6-bundle-s3
          do
            aws --endpoint-url "$ENDPOINT" --region "$REGION" s3api head-object \
              --bucket "$BUCKET" --key "datasets/$version/manifest.json" >/dev/null
          done
          remaining=0
          for prefix in bundles/v1/ indexes/v1/
          do
            count=$(aws --endpoint-url "$ENDPOINT" --region "$REGION" s3api list-objects-v2 \
              --bucket "$BUCKET" --prefix "$prefix" --query 'length(Contents)' --output text)
            echo "$prefix remaining=$count"
            remaining=$((remaining + count))
          done
          test "$remaining" -eq "$EXPECTED_REFERENCED_COUNT"
          probe="diagnostics/reference-gc-${GITHUB_RUN_ID}.txt"
          printf 'quota-ok\n' > "$RUNNER_TEMP/quota-probe.txt"
          aws --endpoint-url "$ENDPOINT" --region "$REGION" s3 cp \
            "$RUNNER_TEMP/quota-probe.txt" "s3://$BUCKET/$probe" --only-show-errors
          aws --endpoint-url "$ENDPOINT" --region "$REGION" s3api head-object \
            --bucket "$BUCKET" --key "$probe" >/dev/null
          aws --endpoint-url "$ENDPOINT" --region "$REGION" s3 rm \
            "s3://$BUCKET/$probe" --only-show-errors
