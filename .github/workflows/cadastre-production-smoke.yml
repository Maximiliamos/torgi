name: Cadastre production smoke

on:
  push:
    branches:
      - verify/cadastre-production-smoke
    paths:
      - '.github/workflows/cadastre-production-smoke.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      E2E_USERNAME: ${{ vars.AUTH_BOOTSTRAP_USERNAME || 'reader' }}
      E2E_PASSWORD: ${{ secrets.AUTH_BOOTSTRAP_PASSWORD }}
    steps:
      - name: Verify authenticated production cadastre search
        shell: bash
        run: |
          set -euo pipefail
          web='https://sterdez.online'
          test -n "$E2E_PASSWORD"

          curl --fail --silent --show-error --max-time 20 "$web/api/../health/live" >/dev/null || true

          python - <<'PY' > login.json
          import json, os
          print(json.dumps({
              "username": os.environ.get("E2E_USERNAME", "reader"),
              "password": os.environ["E2E_PASSWORD"],
          }))
          PY
          curl --fail --silent --show-error --max-time 30 \
            -c cookies.txt \
            -H 'Content-Type: application/json' \
            --data-binary @login.json \
            "$web/api/auth/login" > login-response.json
          python - <<'PY'
          import json
          d = json.load(open('login-response.json', encoding='utf-8'))
          assert d.get('username'), d
          print(json.dumps({'login': d.get('username'), 'role': d.get('role')}, ensure_ascii=False))
          PY

          curl --fail --silent --show-error --max-time 40 -b cookies.txt --get \
            --data-urlencode 'query=76:23:011401:8268' \
            "$web/api/cadastre/search" > exact.json
          python - <<'PY'
          import json
          d = json.load(open('exact.json', encoding='utf-8'))
          o = d.get('object') or {}
          print(json.dumps({'exact_observed': o}, ensure_ascii=False))
          PY

          curl --fail --silent --show-error --max-time 30 -b cookies.txt --get \
            --data-urlencode 'query=Ленинградский 105' \
            "$web/api/cadastre/search" > suggestions.json
          python - <<'PY'
          import json
          d = json.load(open('suggestions.json', encoding='utf-8'))
          assert d.get('kind') == 'address_suggestions', d
          items = d.get('items') or []
          assert items, d
          match = next((x for x in items if 'ярослав' in (x.get('label') or '').casefold()), None)
          assert match, items
          open('selected-address.txt', 'w', encoding='utf-8').write(match['label'])
          print(json.dumps({'suggestions': len(items), 'selected': match['label']}, ensure_ascii=False))
          PY

          selected="$(cat selected-address.txt)"
          curl --fail --silent --show-error --max-time 40 -b cookies.txt --get \
            --data-urlencode "query=$selected" \
            --data-urlencode 'resolve_address=true' \
            "$web/api/cadastre/search" > resolved.json
          python - <<'PY'
          import json
          import re
          d = json.load(open('resolved.json', encoding='utf-8'))
          assert d.get('kind') == 'object', d
          o = d.get('object') or {}
          number = o.get('cadastral_number') or ''
          assert re.fullmatch(r'\d{2}:\d{2}:\d{6,7}:\d+', number), o
          assert o.get('address'), o
          print(json.dumps({
              'resolved': {
                  'number': number,
                  'address': o.get('address'),
                  'has_boundary': o.get('has_boundary'),
                  'source': o.get('source'),
              }
          }, ensure_ascii=False))
          PY
