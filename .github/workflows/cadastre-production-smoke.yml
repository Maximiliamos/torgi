name: Cadastre production smoke

on:
  push:
    branches:
      - verify/cadastre-production-smoke
    paths:
      - '.github/workflows/cadastre-production-smoke.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      E2E_USERNAME: ${{ vars.AUTH_BOOTSTRAP_USERNAME || 'reader' }}
      E2E_PASSWORD: ${{ secrets.AUTH_BOOTSTRAP_PASSWORD }}
    steps:
      - name: Verify authenticated production cadastre search
        shell: bash
        run: |
          set -euo pipefail
          web='https://sterdez.online'
          test -n "$E2E_PASSWORD"

          python - <<'PY' > login.json
          import json, os
          print(json.dumps({
              "username": os.environ.get("E2E_USERNAME", "reader"),
              "password": os.environ["E2E_PASSWORD"],
          }))
          PY
          curl --fail --silent --show-error --max-time 30 \
            -c cookies.txt \
            -H 'Content-Type: application/json' \
            --data-binary @login.json \
            "$web/api/auth/login" > login-response.json

          # 1. Exact cadastral number -> full object + geometry.
          curl --fail --silent --show-error --max-time 45 -b cookies.txt --get \
            --data-urlencode 'query=76:23:011401:8268' \
            "$web/api/cadastre/search" > exact-8268.json
          python - <<'PY'
          import json
          d = json.load(open('exact-8268.json', encoding='utf-8'))
          assert d.get('kind') == 'object', d
          o = d.get('object') or {}
          assert o.get('cadastral_number') == '76:23:011401:8268', o
          assert o.get('lat') is not None and o.get('lon') is not None, o
          assert o.get('has_boundary') is True and o.get('geometry'), o
          assert o.get('address'), o
          assert o.get('confidence') != 'none', o
          print(json.dumps({
              'exact': {
                  'number': o.get('cadastral_number'),
                  'address': o.get('address'),
                  'source': o.get('source'),
                  'has_boundary': o.get('has_boundary'),
              }
          }, ensure_ascii=False))
          PY

          # Warm the known building from the document through the normal exact-number
          # path. This also verifies persistent cache writes before the address flow.
          curl --fail --silent --show-error --max-time 45 -b cookies.txt --get \
            --data-urlencode 'query=76:23:010101:15008' \
            "$web/api/cadastre/search" > exact-15008.json
          python - <<'PY'
          import json
          d = json.load(open('exact-15008.json', encoding='utf-8'))
          assert d.get('kind') == 'object', d
          o = d.get('object') or {}
          assert o.get('cadastral_number') == '76:23:010101:15008', o
          assert o.get('lat') is not None and o.get('lon') is not None, o
          assert o.get('confidence') != 'none', o
          print(json.dumps({
              'warm': {
                  'number': o.get('cadastral_number'),
                  'address': o.get('address'),
                  'source': o.get('source'),
                  'has_boundary': o.get('has_boundary'),
              }
          }, ensure_ascii=False))
          PY

          # 2. Address -> Photon suggestions.
          curl --fail --silent --show-error --max-time 30 -b cookies.txt --get \
            --data-urlencode 'query=Ленинградский 105' \
            "$web/api/cadastre/search" > suggestions.json
          python - <<'PY'
          import json
          d = json.load(open('suggestions.json', encoding='utf-8'))
          assert d.get('kind') == 'address_suggestions', d
          items = d.get('items') or []
          assert items, d
          match = next((x for x in items if 'ярослав' in (x.get('label') or '').casefold()), None)
          assert match, items
          with open('selected.json', 'w', encoding='utf-8') as fh:
              json.dump(match, fh, ensure_ascii=False)
          print(json.dumps({'suggestions': len(items), 'selected': match}, ensure_ascii=False))
          PY

          selected="$(python -c "import json; print(json.load(open('selected.json', encoding='utf-8'))['label'])")"
          lat="$(python -c "import json; print(json.load(open('selected.json', encoding='utf-8'))['lat'])")"
          lon="$(python -c "import json; print(json.load(open('selected.json', encoding='utf-8'))['lon'])")"

          # 3. Selected Photon coordinates -> NSPD WMS/cache -> cadastral candidates.
          curl --fail --silent --show-error --max-time 45 -b cookies.txt --get \
            --data-urlencode "query=$selected" \
            --data-urlencode 'resolve_address=true' \
            --data-urlencode "lat=$lat" \
            --data-urlencode "lon=$lon" \
            "$web/api/cadastre/search" > candidates.json
          python - <<'PY'
          import json
          d = json.load(open('candidates.json', encoding='utf-8'))
          assert d.get('kind') == 'cadastral_objects', d
          items = d.get('items') or []
          assert items, d
          match = next((x for x in items if x.get('cadastral_number') == '76:23:010101:15008'), None)
          assert match, items
          assert match.get('address'), match
          assert match.get('source'), match
          print(json.dumps({
              'candidates': len(items),
              'selected_object': {
                  'number': match.get('cadastral_number'),
                  'type': match.get('object_type'),
                  'address': match.get('address'),
                  'source': match.get('source'),
              },
          }, ensure_ascii=False))
          PY

          # 4. Candidate click -> exact full card again (normally cache-first now).
          curl --fail --silent --show-error --max-time 45 -b cookies.txt --get \
            --data-urlencode 'query=76:23:010101:15008' \
            "$web/api/cadastre/search" > final-card.json
          python - <<'PY'
          import json
          d = json.load(open('final-card.json', encoding='utf-8'))
          assert d.get('kind') == 'object', d
          o = d.get('object') or {}
          assert o.get('cadastral_number') == '76:23:010101:15008', o
          assert o.get('address'), o
          assert o.get('confidence') != 'none', o
          print(json.dumps({
              'final_card': {
                  'number': o.get('cadastral_number'),
                  'address': o.get('address'),
                  'source': o.get('source'),
                  'has_boundary': o.get('has_boundary'),
              }
          }, ensure_ascii=False))
          PY
