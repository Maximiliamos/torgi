name: P1 production data quality

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '37 4 * * *'
  workflow_run:
    workflows: ['Phase 3 Lite full source reconciliation']
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: p1-production-data-quality
  cancel-in-progress: true

jobs:
  wait-home-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Wait for exact Home production revision
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 1120); do
            state="$(curl --fail --silent --show-error               -H "Authorization: Bearer $GH_TOKEN"               -H 'Accept: application/vnd.github+json'               "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=50"               | python -c 'import json,sys; runs=[x for x in json.load(sys.stdin).get("workflow_runs", []) if x.get("name")=="Deploy home secondary origin"]; active={"queued","in_progress","pending","waiting","requested"}; print("completed:success" if any(x.get("status")=="completed" and x.get("conclusion")=="success" for x in runs) else "active" if any(x.get("status") in active for x in runs) else "completed:failure" if runs else "missing")')"
            if [ "$state" = "completed:success" ]; then exit 0; fi
            case "$state" in
              completed:*) echo "All exact-SHA Home deploy attempts failed: $state" >&2; exit 1 ;;
            esac
            sleep 15
          done
          echo "Timed out waiting for Home deploy of $GITHUB_SHA" >&2
          exit 1

  audit:
    needs: wait-home-deploy
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, Windows, X64, bankrotai-home]
    timeout-minutes: 30
    outputs:
      warning_count: ${{ steps.audit.outputs.warning_count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Audit DB to MapDataset to S3 and GEO quality
        id: audit
        shell: powershell
        run: |
          .\scripts\p1-production-audit.ps1 -OutputPath "$env:RUNNER_TEMP\p1-data-quality.json"
          $report = Get-Content -LiteralPath "$env:RUNNER_TEMP\p1-data-quality.json" -Raw | ConvertFrom-Json
          "warning_count=$([int]$report.warning_count)" >> $env:GITHUB_OUTPUT
      - name: Upload P1 quality report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: p1-data-quality-${{ github.run_id }}
          path: ${{ runner.temp }}\p1-data-quality.json
          if-no-files-found: ignore
          retention-days: 30

  alert:
    needs: audit
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const title = '[P1] Data quality / map delivery alert';
            const body = `DB → MapDataset → REG.RU S3 reconciliation failed.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const {data: issues} = await github.rest.issues.listForRepo({...context.repo, state: 'open', per_page: 100});
            const existing = issues.find(issue => !issue.pull_request && issue.title === title);
            if (existing) await github.rest.issues.createComment({...context.repo, issue_number: existing.number, body});
            else await github.rest.issues.create({...context.repo, title, body});

  recovery:
    needs: audit
    if: success()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const title = '[P1] Data quality / map delivery alert';
            const {data: issues} = await github.rest.issues.listForRepo({...context.repo, state: 'open', per_page: 100});
            const existing = issues.find(issue => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({...context.repo, issue_number: existing.number, body: `Recovered on run ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}.`});
              await github.rest.issues.update({...context.repo, issue_number: existing.number, state: 'closed'});
            }
