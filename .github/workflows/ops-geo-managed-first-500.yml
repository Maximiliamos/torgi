name: One-shot managed GEO recovery first 500

on:
  push:
    branches:
      - ops/geo-managed-first-500-20261111

permissions:
  contents: read

concurrency:
  group: home-secondary-production
  cancel-in-progress: false

jobs:
  recover:
    runs-on: [self-hosted, Windows, X64, bankrotai-home]
    timeout-minutes: 90
    env:
      EXPECTED_MAIN_SHA: 1b6ecce21719aea3ecbd824d5482dcdc2d5b5489
    steps:
      - name: Require exact deployed Home revision
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $image = docker inspect bankrotai-home-geocoding-worker --format '{{.Config.Image}}'
          if ($image -notmatch $env:EXPECTED_MAIN_SHA) { throw "Unexpected GEO worker image: $image" }
          $freeGb = (Get-PSDrive C).Free / 1GB
          if ($freeGb -lt 10) { throw "Insufficient disk: $freeGb GB" }
          Write-Output "Managed recovery preflight PASS image=$image disk_free_gb=$freeGb"

      - name: Apply at most five resumable batches
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = "$env:RUNNER_TEMP\managed-first-500.jsonl"
          New-Item -ItemType File -Force -Path $evidence | Out-Null

          foreach ($batch in 1..5) {
            $previous = $ErrorActionPreference
            $ErrorActionPreference = 'Continue'
            $output = docker exec bankrotai-home-geocoding-worker python -m bankrotai.services.managed_stale_cadastral_recovery --batch-size 100 --apply 2>&1
            $exitCode = $LASTEXITCODE
            $ErrorActionPreference = $previous

            $output | ForEach-Object { Write-Output $_ }
            $jsonLine = @($output | ForEach-Object { "$_" } | Where-Object { $_.TrimStart().StartsWith('{') }) | Select-Object -Last 1
            if (-not $jsonLine) { throw "Batch $batch produced no JSON result" }
            Add-Content -LiteralPath $evidence -Value $jsonLine -Encoding utf8
            $state = $jsonLine | ConvertFrom-Json
            Write-Output ("MANAGED_BATCH batch={0} status={1} source={2} cursor={3}->{4} selected={5} accepted={6} updated={7} operational={8}" -f
              $batch, $state.status, $state.source, $state.cursor_before, $state.cursor_after,
              $state.selected, $state.accepted, $state.updated, $state.operational_failures)

            if ($exitCode -eq 75 -or $state.status -eq 'retry_required') {
              throw "Safe stop: operational retry required at source=$($state.source) cursor=$($state.cursor_after)"
            }
            if ($exitCode -ne 0) { throw "Batch $batch failed with exit code $exitCode" }
            if ($state.status -eq 'completed') { break }
          }

      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: managed-first-500-${{ github.run_id }}
          path: ${{ runner.temp }}\managed-first-500.jsonl
          if-no-files-found: warn
          retention-days: 30
