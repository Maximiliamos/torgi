name: ETP Fabrikant source-contract read-only

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/etp-fabrikant-readonly.yml"
      - "scripts/audit_fabrikant_readonly.py"
      - "src/bankrotai/connectors/etp_sources/**"
      - "tests/test_fabrikant_source.py"
      - "docs/ETP_FABRIKANT_AUDIT_2026-11-09.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: etp-fabrikant-readonly-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify probe has no persistence integration
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $text = Get-Content scripts/audit_fabrikant_readonly.py -Raw
          foreach ($forbidden in @('sqlalchemy', 'SessionLocal', 'celery', 'boto3', 's3', 'delete(', 'post(')) {
            if ($text -match [regex]::Escape($forbidden)) {
              throw "Forbidden write/persistence token in Fabrikant probe: $forbidden"
            }
          }

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: { python-version: "3.11", cache: pip }

      - name: Install probe dependencies
        run: pip install requests beautifulsoup4

      - name: Run public Fabrikant source-contract audit
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/fabrikant-readonly.json"
          python scripts/audit_fabrikant_readonly.py --max-pages 200 --detail-limit 30 --passes 2 --pause 0.4 | tee "$report"
          python - "$report" <<'PY'
          import json, sys
          path = sys.argv[1]
          rows = [line for line in open(path, encoding="utf-8") if line.strip()]
          parsed = json.loads(rows[-1])
          assert parsed["source"] == "fabrikant.ru"
          assert parsed["database_writes"] == 0
          assert parsed["map_writes"] == 0
          assert parsed["production_enabled"] is False
          first = parsed["passes"][0]
          print(
              "FABRIKANT_AUDIT "
              f"pages={first['pages_checked']}; unique={first['unique_procedure_count']}; "
              f"terminal={first['terminal_page']}; reason={first['terminal_reason']}; "
              f"stable_two_passes={parsed['stable_two_passes']}; details={parsed['details_checked']}"
          )
          for page in first["pages"]:
              print(
                  "FABRIKANT_PAGE "
                  f"page={page['page']}; status={page['http_status']}; "
                  f"candidates={page['procedure_count']}; next={page['has_next_link']}; "
                  f"visible_pages={','.join(map(str, page['visible_page_numbers']))}"
              )
          for detail in parsed["details"]:
              print(
                  "FABRIKANT_DETAIL "
                  f"id={detail['procedure_id']}; status={detail['http_status']}; "
                  f"lot_markers={detail['lot_marker_count']}; "
                  f"money_labels={len(detail['money_labels'])}; "
                  f"status_labels={len(detail['status_labels'])}; "
                  f"lot_routes={len(detail['lot_route_shapes'])}"
              )
          PY

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: etp-fabrikant-readonly-${{ github.run_id }}
          path: ${{ runner.temp }}\\fabrikant-readonly.json
          if-no-files-found: warn
          retention-days: 30
