name: ETP manual verified one-source import
on:
  workflow_dispatch:
    inputs:
      source_id:
        type: choice
        description: Exactly one proven property source
        required: true
        options:
          - m-ets.ru
          - cdtrf.ru
      confirmation:
        type: string
        required: true
        description: Type SAFE_SINGLE_SOURCE to allow no more than 2 verified details
permissions:
  contents: read
  actions: read
jobs:
  canary:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirmation == 'SAFE_SINGLE_SOURCE' }}
    runs-on: [self-hosted, Windows, X64, bankrotai-home]
    timeout-minutes: 15
    concurrency:
      group: etp-manual-verified-import
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Require current accepted exact SHA before backup and import
        shell: powershell
        run: |
          .\scripts\verify-etp-canary-acceptance.ps1 -ExpectedSha $env:GITHUB_SHA
      - name: Require recent locally restore-verified backup
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'D:\BankrotAI\dr-backups'
          $files = @(Get-ChildItem -LiteralPath $root -File -Filter 'bankrotai-*.json' |
            Sort-Object LastWriteTimeUtc -Descending)
          $verified = $false
          foreach ($file in $files) {
            try {
              $data = Get-Content -LiteralPath $file.FullName -Raw | ConvertFrom-Json
              if ($data.restore_verification -ne 'passed' -or
                  $data.source_schema_revision -ne $data.restored_schema_revision) { continue }
              if (-not $data.backup_file -or -not (Test-Path -LiteralPath ([string]$data.backup_file))) { continue }
              $age = ((Get-Date).ToUniversalTime() - $file.LastWriteTimeUtc).TotalHours
              if ($age -gt 60 -or $age -lt 0) { continue }
              $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath ([string]$data.backup_file)).Hash.ToLowerInvariant()
              if ($digest -ne ([string]$data.sha256).ToLowerInvariant()) { continue }
              $verified = $true
              Write-Output ("Recent restore-verified DB backup found; age hours: " + [math]::Round($age, 1))
              break
            } catch {
              Write-Warning ('Skipping unverifiable backup manifest: ' + $file.Name)
            }
          }
          if (-not $verified) { throw 'ETP import refused: no recent verified PostgreSQL backup' }
      - name: Confirm trusted worker is running
        shell: powershell
        run: |
          $state = (docker inspect --format '{{.State.Status}}' bankrotai-home-ingestion-worker).Trim()
          if ($LASTEXITCODE -ne 0 -or $state -ne 'running') {
            throw 'ETP import refused: trusted home worker is not running'
          }
      - name: Refuse collision-prone or already-imported source details before any write
        shell: powershell
        env:
          ETP_SOURCE: ${{ inputs.source_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          # This is another read-only SELECT-only gate; the importer still
          # checks collisions atomically in the eventual write transaction.
          $output = @(& docker.exe exec bankrotai-home-ingestion-worker python -m bankrotai.services.etp_manual_import --source $env:ETP_SOURCE --limit 2 --audit-collisions)
          if ($LASTEXITCODE -ne 0 -or $output.Count -lt 1) {
            throw 'ETP source candidate collision preflight failed'
          }
          $report = ($output | Select-Object -Last 1 | ConvertFrom-Json)
          $review = $report.preimport_collision_review
          if ($report.source -ne $env:ETP_SOURCE -or
              $report.write_authorized -ne $false -or
              $report.persisted_count -ne 0 -or
              $report.complete_source_inventory -ne $false -or
              $null -eq $review -or
              $review.source -ne $env:ETP_SOURCE -or
              $review.read_only -ne $true -or
              $review.database_writes -ne 0 -or
              $review.details_reviewed -lt 1 -or $review.details_reviewed -gt 2 -or
              $review.new_unconflicted_candidate_count -ne $review.details_reviewed -or
              $review.blocked_candidate_count -ne 0 -or
              $review.ready_for_separate_operator_canary -ne $true -or
              $review.revalidate_in_atomic_import -ne $true) {
            throw 'ETP canary would overwrite/duplicate existing evidence: manual review required'
          }
          Write-Output ("ETP collision preflight passed for {0} details; writing is a separate guarded step" -f $review.details_reviewed)
      - name: Import at most two verified lots, no source reconciliation
        shell: powershell
        env:
          ETP_SOURCE: ${{ inputs.source_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Recheck immediately before mutation: main, P11 or worker may have changed
          # while a backup was being verified.
          .\scripts\verify-etp-canary-acceptance.ps1 -ExpectedSha $env:GITHUB_SHA
          $lines = @(& docker.exe exec -e ETP_OPERATOR_CANARY_IMPORT_ENABLED=1 -e ETP_CANARY_BACKUP_VERIFIED=1 bankrotai-home-ingestion-worker python -m bankrotai.services.etp_manual_import --source $env:ETP_SOURCE --limit 2 --apply)
          if ($LASTEXITCODE -ne 0) {
            throw "Canary source import failed for $env:ETP_SOURCE"
          }
          $canary = ($lines | Select-Object -Last 1 | ConvertFrom-Json)
          $ids = @($canary.persisted_external_ids)
          if ($canary.source -ne $env:ETP_SOURCE -or $ids.Count -lt 1 -or
              $ids.Count -gt 2 -or $canary.persisted_count -ne $ids.Count) {
            throw 'ETP canary result is missing exact committed public source identities'
          }
          $canary | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (
            Join-Path $env:RUNNER_TEMP 'etp-canary-result.json'
          ) -Encoding utf8
      - name: Confirm exact imported source identities and GEO state after import
        shell: powershell
        env:
          ETP_SOURCE: ${{ inputs.source_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path $env:RUNNER_TEMP 'etp-canary-result.json'
          $canary = Get-Content -LiteralPath $path -Raw | ConvertFrom-Json
          if ($canary.source -ne $env:ETP_SOURCE) {
            throw 'ETP canary result is from a different source'
          }
          $ids = @($canary.persisted_external_ids)
          if ($ids.Count -lt 1 -or $ids.Count -gt 2) {
            throw 'ETP canary audit cannot confirm one or two new source IDs'
          }
          $arguments = @('exec','bankrotai-home-ingestion-worker','python',
            '-m','bankrotai.services.etp_postimport_audit',
            '--source',$env:ETP_SOURCE,'--min-source-lots','1')
          foreach ($id in $ids) {
            $arguments += @('--expected-external-id',[string]$id)
          }
          & docker.exe @arguments
          if ($LASTEXITCODE -ne 0) {
            throw 'ETP exact-source post-import audit failed; publication is not accepted'
          }
