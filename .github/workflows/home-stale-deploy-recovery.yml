name: Recover stale production deploys

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/home-stale-deploy-recovery.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/home-stale-deploy-recovery.yml"

permissions:
  actions: write
  contents: read

jobs:
  recover:
    # Hosted recovery remains available even when the self-hosted Home runner is wedged.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Force-cancel stale production deploy runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_SHA="$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          echo "Canonical main HEAD: $CURRENT_SHA"
          for workflow in home-secondary-deploy.yml regru-deploy.yml cloudflare-edge-deploy.yml phase3-lite-health.yml; do
            payload="$(gh api -X GET "repos/$REPOSITORY/actions/workflows/$workflow/runs?per_page=50")"
            mapfile -t stale_ids < <(
              jq -r --arg current "$CURRENT_SHA" --arg workflow "$workflow" '
                .workflow_runs[]
                | select(
                    (.status == "queued"
                     or .status == "in_progress"
                     or .status == "pending"
                     or .status == "waiting"
                     or .status == "requested")
                    and (
                      .head_sha != $current
                      or (
                        $workflow == "home-secondary-deploy.yml"
                        and .status == "in_progress"
                        and (now - (.created_at | fromdateiso8601)) > 600
                      )
                    )
                  )
                | .id
              ' <<<"$payload"
            )
            for run_id in "${stale_ids[@]}"; do
              echo "Force-cancelling stale $workflow run $run_id"
              if ! gh api -X POST "repos/$REPOSITORY/actions/runs/$run_id/force-cancel" >/dev/null 2>&1; then
                gh api -X POST "repos/$REPOSITORY/actions/runs/$run_id/cancel" >/dev/null 2>&1 || true
              fi
            done
          done

          # Temporary/verification workflows can also occupy the only Home
          # runner while waiting for a production deploy. Clear stale P12
          # acceptance runs by workflow name so they cannot deadlock deploy.
          acceptance_payload="$(gh api -X GET "repos/$REPOSITORY/actions/runs?per_page=100")"
          mapfile -t stale_acceptance_ids < <(
            jq -r --arg current "$CURRENT_SHA" '
              .workflow_runs[]
              | select(
                  .name == "P12 production acceptance"
                  and (.status == "queued"
                       or .status == "in_progress"
                       or .status == "pending"
                       or .status == "waiting"
                       or .status == "requested")
                  and .head_sha != $current
                )
              | .id
            ' <<<"$acceptance_payload"
          )
          for run_id in "${stale_acceptance_ids[@]}"; do
            echo "Force-cancelling stale P12 acceptance run $run_id"
            if ! gh api -X POST "repos/$REPOSITORY/actions/runs/$run_id/force-cancel" >/dev/null 2>&1; then
              gh api -X POST "repos/$REPOSITORY/actions/runs/$run_id/cancel" >/dev/null 2>&1 || true
            fi
          done

          sleep 35
          for workflow in home-secondary-deploy.yml regru-deploy.yml cloudflare-edge-deploy.yml phase3-lite-health.yml; do
            remaining="$(gh api -X GET "repos/$REPOSITORY/actions/workflows/$workflow/runs?per_page=50")"
            stale_remaining="$(
              jq -r --arg current "$CURRENT_SHA" --arg workflow "$workflow" '
                [
                  .workflow_runs[]
                  | select(
                      (.status == "queued"
                       or .status == "in_progress"
                       or .status == "pending"
                       or .status == "waiting"
                       or .status == "requested")
                      and (
                        .head_sha != $current
                        or (
                          $workflow == "home-secondary-deploy.yml"
                          and .status == "in_progress"
                          and (now - (.created_at | fromdateiso8601)) > 600
                        )
                      )
                    )
                ] | length
              ' <<<"$remaining"
            )"
            if [[ "$stale_remaining" != "0" ]]; then
              echo "Stale $workflow runs still active: $stale_remaining" >&2
              exit 1
            fi
          done
          echo "All stale production deploy runs are cleared."

      - name: Ensure production deploys exist for current main
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_SHA="$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          echo "Canonical main HEAD: $CURRENT_SHA"

          ensure_deploy() {
            local workflow="$1"
            local label="$2"
            local payload matching
            payload="$(gh api -X GET "repos/$REPOSITORY/actions/workflows/$workflow/runs?per_page=50")"
            matching="$(
              jq -r --arg current "$CURRENT_SHA" '
                [
                  .workflow_runs[]
                  | select(
                      .head_sha == $current
                      and (
                        .status != "completed"
                        or .conclusion == "success"
                      )
                    )
                ] | length
              ' <<<"$payload"
            )"
            if [[ "$matching" != "0" ]]; then
              echo "$label deploy already exists for $CURRENT_SHA"
              return 0
            fi
            echo "Dispatching $label deploy for main at $CURRENT_SHA"
            gh workflow run "$workflow" --repo "$REPOSITORY" --ref main
          }

          ensure_deploy home-secondary-deploy.yml "Home"
          ensure_deploy regru-deploy.yml "REG.RU"
