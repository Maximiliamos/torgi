name: Recover stale Home deploy

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/home-stale-deploy-recovery.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/home-stale-deploy-recovery.yml"

permissions:
  actions: write
  contents: read

jobs:
  cancel-stale-home-deploys:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Force-cancel stale Home deploy workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(gh api -X GET "repos/$REPOSITORY/actions/workflows/home-secondary-deploy.yml/runs?per_page=50")"
          mapfile -t stale_ids < <(
            jq -r --arg current "$CURRENT_SHA" '
              .workflow_runs[]
              | select(
                  (.status == "queued"
                   or .status == "in_progress"
                   or .status == "pending"
                   or .status == "waiting"
                   or .status == "requested")
                  and .head_sha != $current
                )
              | .id
            ' <<<"$payload"
          )

          if (( ${#stale_ids[@]} == 0 )); then
            echo "No stale Home deploy runs found."
            exit 0
          fi

          for run_id in "${stale_ids[@]}"; do
            echo "Force-cancelling stale Home deploy run $run_id"
            if ! gh api -X POST "repos/$REPOSITORY/actions/runs/$run_id/force-cancel" >/dev/null 2>&1; then
              gh api -X POST "repos/$REPOSITORY/actions/runs/$run_id/cancel" >/dev/null 2>&1 || true
            fi
          done

          sleep 5
          remaining="$(gh api -X GET "repos/$REPOSITORY/actions/workflows/home-secondary-deploy.yml/runs?per_page=50")"
          stale_remaining="$(
            jq -r --arg current "$CURRENT_SHA" '
              [
                .workflow_runs[]
                | select(
                    (.status == "queued"
                     or .status == "in_progress"
                     or .status == "pending"
                     or .status == "waiting"
                     or .status == "requested")
                    and .head_sha != $current
                  )
              ] | length
            ' <<<"$remaining"
          )"
          if [[ "$stale_remaining" != "0" ]]; then
            echo "Stale Home deploy runs still active: $stale_remaining" >&2
            exit 1
          fi
          echo "All stale Home deploy runs are cleared."
