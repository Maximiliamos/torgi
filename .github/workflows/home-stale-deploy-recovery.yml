name: Recover stale production deploys

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/home-stale-deploy-recovery.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/home-stale-deploy-recovery.yml"

permissions:
  actions: write
  contents: read

jobs:
  recover:
    # Hosted recovery remains available even when the self-hosted Home runner is wedged.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Force-cancel stale production deploy runs
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for workflow in home-secondary-deploy.yml regru-deploy.yml cloudflare-edge-deploy.yml; do
            payload="$(gh api -X GET "repos/$REPOSITORY/actions/workflows/$workflow/runs?per_page=50")"
            mapfile -t stale_ids < <(
              jq -r --arg current "$CURRENT_SHA" --arg workflow "$workflow" '
                .workflow_runs[]
                | select(
                    (.status == "queued"
                     or .status == "in_progress"
                     or .status == "pending"
                     or .status == "waiting"
                     or .status == "requested")
                    and (
                      .head_sha != $current
                      or (
                        $workflow == "home-secondary-deploy.yml"
                        and .status == "in_progress"
                        and (now - (.created_at | fromdateiso8601)) > 600
                      )
                    )
                  )
                | .id
              ' <<<"$payload"
            )
            for run_id in "${stale_ids[@]}"; do
              echo "Force-cancelling stale $workflow run $run_id"
              if ! gh api -X POST "repos/$REPOSITORY/actions/runs/$run_id/force-cancel" >/dev/null 2>&1; then
                gh api -X POST "repos/$REPOSITORY/actions/runs/$run_id/cancel" >/dev/null 2>&1 || true
              fi
            done
          done

          sleep 35
          for workflow in home-secondary-deploy.yml regru-deploy.yml cloudflare-edge-deploy.yml; do
            remaining="$(gh api -X GET "repos/$REPOSITORY/actions/workflows/$workflow/runs?per_page=50")"
            stale_remaining="$(
              jq -r --arg current "$CURRENT_SHA" --arg workflow "$workflow" '
                [
                  .workflow_runs[]
                  | select(
                      (.status == "queued"
                       or .status == "in_progress"
                       or .status == "pending"
                       or .status == "waiting"
                       or .status == "requested")
                      and (
                        .head_sha != $current
                        or (
                          $workflow == "home-secondary-deploy.yml"
                          and .status == "in_progress"
                          and (now - (.created_at | fromdateiso8601)) > 600
                        )
                      )
                    )
                ] | length
              ' <<<"$remaining"
            )"
            if [[ "$stale_remaining" != "0" ]]; then
              echo "Stale $workflow runs still active: $stale_remaining" >&2
              exit 1
            fi
          done
          echo "All stale production deploy runs are cleared."

      - name: Ensure REG.RU deploy exists for current main
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(gh api -X GET "repos/$REPOSITORY/actions/workflows/regru-deploy.yml/runs?per_page=50")"
          matching="$(
            jq -r --arg current "$CURRENT_SHA" '
              [
                .workflow_runs[]
                | select(
                    .head_sha == $current
                    and (
                      .status != "completed"
                      or .conclusion == "success"
                    )
                  )
              ] | length
            ' <<<"$payload"
          )"
          if [[ "$matching" != "0" ]]; then
            echo "REG.RU deploy already exists for $CURRENT_SHA"
            exit 0
          fi
          echo "Dispatching REG.RU deploy for main at $CURRENT_SHA"
          gh workflow run regru-deploy.yml --repo "$REPOSITORY" --ref main
