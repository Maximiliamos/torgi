name: P11 production acceptance

on:
  workflow_dispatch:
    inputs:
      soak_minutes:
        description: 'Read-only production soak duration (0-60 minutes)'
        type: number
        default: 30
      restart_drill:
        description: 'Restart application/worker containers sequentially before soak'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: p11-production-acceptance
  cancel-in-progress: false

jobs:
  accept:
    runs-on: [self-hosted, Windows, X64, bankrotai-home]
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7

      - name: Require main and bounded inputs
        shell: powershell
        run: |
          if ('\${{ github.ref }}' -ne 'refs/heads/main') {
            throw 'P11 acceptance may run only from main'
          }
          $minutes = [int]'\${{ inputs.soak_minutes }}'
          if ($minutes -lt 0 -or $minutes -gt 60) {
            throw "soak_minutes must be between 0 and 60; got $minutes"
          }

      - name: Verify canonical containers and public API
        shell: powershell
        run: |
          $required = @(
            'bankrotai-home-postgres',
            'bankrotai-home-redis',
            'bankrotai-home-photon',
            'bankrotai-home-secondary',
            'bankrotai-home-ingestion-worker',
            'bankrotai-home-geocoding-worker',
            'bankrotai-home-map-worker'
          )
          $running = @(docker ps --format '{{.Names}}')
          $missing = @($required | Where-Object { $_ -notin $running })
          if ($missing.Count -gt 0) { throw "Missing production containers: $($missing -join ', ')" }

          $live = Invoke-WebRequest -Uri 'https://api.sterdez.online/health/live' -UseBasicParsing -TimeoutSec 20
          $ready = Invoke-WebRequest -Uri 'https://api.sterdez.online/health/ready' -UseBasicParsing -TimeoutSec 20
          if ($live.StatusCode -ne 200 -or $ready.StatusCode -ne 200) {
            throw "Public API health failed: live=$($live.StatusCode) ready=$($ready.StatusCode)"
          }

      - name: Run production health evidence
        shell: powershell
        run: |
          .\scripts\phase3-production-health.ps1 -OutputPath "$env:RUNNER_TEMP\p11-health.json"

      - name: Verify fresh backup and isolated restore evidence
        shell: powershell
        run: |
          $root = 'C:\ProgramData\BankrotAI\dr-backups'
          $latest = Get-ChildItem -LiteralPath $root -Filter 'bankrotai-*.json' -File -ErrorAction Stop |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          if (-not $latest) { throw 'No backup metadata found' }
          $meta = Get-Content -LiteralPath $latest.FullName -Raw | ConvertFrom-Json
          $created = [datetimeoffset]::Parse([string]$meta.created_at).UtcDateTime
          $age = ((Get-Date).ToUniversalTime() - $created).TotalHours
          if ($age -gt 30) { throw "Latest backup is stale: $([math]::Round($age,2))h" }
          if ($meta.restore_verification -ne 'passed') { throw "Latest restore verification is not passed: $($meta.restore_verification)" }
          if (-not $meta.sha256 -or -not $meta.source_schema_revision) { throw 'Backup metadata lacks checksum/schema evidence' }
          $meta | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath "$env:RUNNER_TEMP\p11-backup.json" -Encoding utf8

      - name: Verify DB MapDataset and public REG.RU S3 manifest
        shell: powershell
        run: |
          $script = @'
          import json
          from sqlalchemy import select
          from bankrotai.core import get_settings
          from bankrotai.db import SessionLocal, MapDataset, ProcessedLot, LotGeoSnapshot
          from bankrotai.services.map_dataset_version import MAP_DATASET_REVISION
          from bankrotai.services.map_object_store import _verify_public_manifest

          session = SessionLocal()
          try:
              current = session.scalar(
                  select(MapDataset)
                  .where(MapDataset.is_current.is_(True), MapDataset.status == "ready")
                  .order_by(MapDataset.id.desc())
                  .limit(1)
              )
              assert current is not None, "no current ready MapDataset"
              manifest = _verify_public_manifest(get_settings(), current.version)
              assert manifest.get("version") == current.version
              assert manifest.get("pipeline_revision") == MAP_DATASET_REVISION
              assert int(manifest.get("point_count", -1)) == int(current.point_count)
              assert int(manifest.get("tile_count", -1)) == int(current.tile_count)
              active = session.scalar(
                  select(__import__("sqlalchemy").func.count(ProcessedLot.id))
                  .where(
                      ProcessedLot.duplicate_of_id.is_(None),
                      ProcessedLot.is_archived.is_(False),
                      ProcessedLot.auction_status.in_(("active", "scheduled")),
                  )
              ) or 0
              snapshots = session.scalar(select(__import__("sqlalchemy").func.count(LotGeoSnapshot.id))) or 0
              print(json.dumps({
                  "version": current.version,
                  "point_count": int(current.point_count or 0),
                  "tile_count": int(current.tile_count or 0),
                  "pipeline_revision": MAP_DATASET_REVISION,
                  "active_lots": int(active),
                  "geo_snapshots": int(snapshots),
                  "public_manifest_verified": True,
              }, default=str))
          finally:
              session.close()
          '@
          $json = $script | docker exec -i bankrotai-home-map-worker python -
          if ($LASTEXITCODE -ne 0 -or -not $json) { throw 'DB ↔ MapDataset ↔ S3 verification failed' }
          ($json | Select-Object -Last 1) | Set-Content -LiteralPath "$env:RUNNER_TEMP\p11-map.json" -Encoding utf8

      - name: Verify source and GEO resilience state
        shell: powershell
        run: |
          $script = @'
          import json
          from bankrotai.db import SessionLocal
          from bankrotai.services.geo_backfill import geocoding_progress
          from bankrotai.services.quality import list_source_health
          from bankrotai.services.source_resilience import source_global_network_state

          session = SessionLocal()
          try:
              sources = list_source_health(session)
              network = source_global_network_state(session)
              geo = geocoding_progress(session)
              configured = [s for s in sources if s.source_system != "tbankrot.ru"]
              assert configured, "no public source health records"
              assert not network.get("circuit_open"), network
              assert int(geo.get("network_wait") or 0) == 0, geo
              print(json.dumps({
                  "sources": [{
                      "source": s.source_system,
                      "status": s.status,
                      "freshness": s.freshness_status,
                      "coverage": s.coverage_status,
                      "circuit": s.circuit_state,
                  } for s in configured],
                  "network": network,
                  "geo": {
                      "percent": geo.get("percent"),
                      "actionable_remaining": geo.get("actionable_remaining"),
                      "network_wait": geo.get("network_wait"),
                      "deferred_no_match": geo.get("deferred_no_match"),
                      "deferred_validation": geo.get("deferred_validation"),
                  },
              }, default=str))
          finally:
              session.close()
          '@
          $json = $script | docker exec -i bankrotai-home-map-worker python -
          if ($LASTEXITCODE -ne 0 -or -not $json) { throw 'Source/GEO resilience acceptance failed' }
          ($json | Select-Object -Last 1) | Set-Content -LiteralPath "$env:RUNNER_TEMP\p11-resilience.json" -Encoding utf8

      - name: Run Home runner route diagnostics
        shell: powershell
        run: |
          .\scripts\home-runner-network-diagnostics.ps1 -OutputPath "$env:RUNNER_TEMP\p11-runner.json"

      - name: Optional controlled container restart drill
        if: \${{ inputs.restart_drill }}
        shell: powershell
        run: |
          $targets = @(
            'bankrotai-home-secondary',
            'bankrotai-home-ingestion-worker',
            'bankrotai-home-geocoding-worker',
            'bankrotai-home-map-worker',
            'bankrotai-home-redis',
            'bankrotai-home-postgres'
          )
          foreach ($container in $targets) {
            Write-Output "Restarting $container"
            docker restart $container | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Could not restart $container" }
            Start-Sleep -Seconds 5
          }
          for ($attempt = 1; $attempt -le 30; $attempt++) {
            try {
              $live = Invoke-WebRequest -Uri 'https://api.sterdez.online/health/live' -UseBasicParsing -TimeoutSec 10
              $ready = Invoke-WebRequest -Uri 'https://api.sterdez.online/health/ready' -UseBasicParsing -TimeoutSec 10
              if ($live.StatusCode -eq 200 -and $ready.StatusCode -eq 200) { break }
            } catch {}
            if ($attempt -eq 30) { throw 'Production API did not recover after controlled restart drill' }
            Start-Sleep -Seconds 5
          }

      - name: Read-only production soak
        shell: powershell
        run: |
          $minutes = [int]'\${{ inputs.soak_minutes }}'
          $deadline = (Get-Date).ToUniversalTime().AddMinutes($minutes)
          $samples = @()
          do {
            $freeGb = [math]::Round((Get-PSDrive -Name C).Free / 1GB, 2)
            $liveOk = $false
            $readyOk = $false
            try {
              $liveOk = (Invoke-WebRequest -Uri 'https://api.sterdez.online/health/live' -UseBasicParsing -TimeoutSec 15).StatusCode -eq 200
              $readyOk = (Invoke-WebRequest -Uri 'https://api.sterdez.online/health/ready' -UseBasicParsing -TimeoutSec 15).StatusCode -eq 200
            } catch {}
            $sample = [ordered]@{
              at = (Get-Date).ToUniversalTime().ToString('o')
              live = $liveOk
              ready = $readyOk
              disk_free_gb = $freeGb
            }
            $samples += $sample
            if (-not $liveOk -or -not $readyOk) { throw "Production health failed during soak: $($sample | ConvertTo-Json -Compress)" }
            if ($freeGb -lt 10) { throw "Disk dropped below P11 hard floor during soak: $freeGb GB" }
            if ((Get-Date).ToUniversalTime() -ge $deadline) { break }
            Start-Sleep -Seconds 60
          } while ($true)
          $samples | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath "$env:RUNNER_TEMP\p11-soak.json" -Encoding utf8

      - name: Upload P11 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p11-production-acceptance-\${{ github.run_id }}
          path: |
            \${{ runner.temp }}\p11-health.json
            \${{ runner.temp }}\p11-backup.json
            \${{ runner.temp }}\p11-map.json
            \${{ runner.temp }}\p11-resilience.json
            \${{ runner.temp }}\p11-runner.json
            \${{ runner.temp }}\p11-soak.json
          if-no-files-found: warn
          retention-days: 30
