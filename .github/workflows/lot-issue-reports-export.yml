name: Lot issue reports read-only export

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/lot-issue-reports-export.yml"
      - "src/bankrotai/services/lot_issue_report_export.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/lot-issue-reports-export.yml"
      - "src/bankrotai/services/lot_issue_report_export.py"
  schedule:
    - cron: "*/5 * * * *"

permissions:
  actions: read
  contents: read

concurrency:
  group: lot-issue-reports-readonly-export
  cancel-in-progress: true

jobs:
  export:
    runs-on: [self-hosted, Windows, X64, bankrotai-home]
    timeout-minutes: 5
    steps:
      - name: Checkout exact exporter source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - name: Export reports from deployed worker without writes
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $outside = Join-Path $env:RUNNER_TEMP 'lot-issue-reports.json'
          $source = Join-Path $env:GITHUB_WORKSPACE 'src\bankrotai\services\lot_issue_report_export.py'
          if (-not (Test-Path -LiteralPath $source)) { throw 'Exporter source is missing from checkout' }

          # Pass the exact checked-out exporter as data, not as a file or stdin.
          # The production container remains read-only and only supplies the
          # installed models plus its production database connection.
          $encoded = [Convert]::ToBase64String([IO.File]::ReadAllBytes($source))
          $bootstrap = "import base64,sys; code=base64.b64decode(sys.argv[1]); sys.argv=['lot_issue_report_export.py']+sys.argv[2:]; exec(compile(code,'lot_issue_report_export.py','exec'))"
          $output = @(& docker.exe exec bankrotai-home-ingestion-worker python -c $bootstrap $encoded --limit 200 --stdout 2>&1)
          $exit = $LASTEXITCODE
          if ($exit -ne 0) {
            Write-Host ('Read-only report export failed with exit code ' + $exit)
            throw 'Read-only report export failed'
          }
          $json = $output -join [Environment]::NewLine
          try {
            $parsed = $json | ConvertFrom-Json
          } catch {
            throw 'Read-only report export did not return valid JSON'
          }
          if ($null -eq $parsed.count -or $null -eq $parsed.items) {
            throw 'Read-only report export JSON has an invalid schema'
          }
          [IO.File]::WriteAllText(
            $outside,
            $json,
            [Text.UTF8Encoding]::new($false)
          )
      - name: Upload triage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lot-issue-reports-${{ github.run_id }}
          path: ${{ runner.temp }}\\lot-issue-reports.json
          if-no-files-found: error
          retention-days: 3
