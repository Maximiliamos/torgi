name: Lot issue reports read-only export

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  actions: read
  contents: read

concurrency:
  group: lot-issue-reports-readonly-export
  cancel-in-progress: true

jobs:
  export:
    runs-on: [self-hosted, Windows, X64, bankrotai-home]
    timeout-minutes: 5
    steps:
      - name: Export reports from deployed worker without writes
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $inside = 'C:\\tmp\\lot-issue-reports.json'
          $outside = Join-Path $env:RUNNER_TEMP 'lot-issue-reports.json'
          docker exec bankrotai-home-ingestion-worker python -m bankrotai.services.lot_issue_report_export --limit 200 --output $inside
          if ($LASTEXITCODE -ne 0) { throw 'Read-only report export failed' }
          docker cp "bankrotai-home-ingestion-worker:$inside" $outside
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $outside)) {
            throw 'Could not copy report export from worker'
          }
          docker exec bankrotai-home-ingestion-worker python -c "import os; os.remove(r'C:\\tmp\\lot-issue-reports.json')"
      - name: Upload triage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lot-issue-reports-${{ github.run_id }}
          path: ${{ runner.temp }}\\lot-issue-reports.json
          if-no-files-found: error
          retention-days: 3
