name: Configure home API WSS relay

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/home-reverse-relay.yml"]

permissions:
  contents: read

concurrency:
  group: home-reverse-relay-production
  cancel-in-progress: false

env:
  SSH_HOST: 194.226.126.233
  SSH_PORT: "2222"
  WSTUNNEL_VERSION: "10.7.0"
  WSS_HOSTNAME: relay.194-226-126-233.sslip.io
  PUBLIC_RELAY_HOSTNAME: home-relay.194-226-126-233.sslip.io

jobs:
  configure-server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v7
      - name: Prepare SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.REGRU_SSH_PRIVATE_KEY }}
          SERVICE_KEY: ${{ secrets.KOYEB_SERVICE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY" && test -n "$SERVICE_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/regru_deploy"
          chmod 600 "$HOME/.ssh/regru_deploy"
          ssh-keyscan -T 15 -p "$SSH_PORT" "$SSH_HOST" > "$HOME/.ssh/known_hosts.relay"
      - name: Install restricted WSS relay server
        env:
          SERVICE_KEY: ${{ secrets.KOYEB_SERVICE_KEY }}
        run: |
          set -euo pipefail
          relay_token="$(printf '%s' 'bankrotai-home-wss-relay-v1' | openssl dgst -sha256 -hmac "$SERVICE_KEY" -binary | base64 -w 0 | tr '+/' '-_' | tr -d '=')"
          restriction="$(cat <<EOF
          restrictions:
          - name: bankrotai-home-api-only
            match:
            - !Authorization "^Bearer ${relay_token}$"
            allow:
            - !ReverseTunnel
              protocol: [Tcp]
              port: [18080]
              cidr: [0.0.0.0/0]
          EOF
          )"
          restriction_b64="$(printf '%s\n' "$restriction" | base64 -w 0)"
          ssh -i "$HOME/.ssh/regru_deploy" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts.relay" -p "$SSH_PORT" "root@$SSH_HOST" \
            "RESTRICTION_B64='$restriction_b64' WSS_HOSTNAME='$WSS_HOSTNAME' WSTUNNEL_VERSION='$WSTUNNEL_VERSION' bash -s" <<'REMOTE'
          set -euo pipefail
          install -d -m 700 /opt/bankrotai/wstunnel
          printf '%s' "$RESTRICTION_B64" | base64 -d > /opt/bankrotai/wstunnel/restrictions.yaml.next
          chmod 600 /opt/bankrotai/wstunnel/restrictions.yaml.next
          mv -f /opt/bankrotai/wstunnel/restrictions.yaml.next /opt/bankrotai/wstunnel/restrictions.yaml
          archive="/tmp/wstunnel_${WSTUNNEL_VERSION}_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
            "https://github.com/erebe/wstunnel/releases/download/v${WSTUNNEL_VERSION}/wstunnel_${WSTUNNEL_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          tar -xzf "$archive" -C /opt/bankrotai/wstunnel
          install -m 755 /opt/bankrotai/wstunnel/wstunnel /usr/local/bin/bankrotai-wstunnel
          rm -f "$archive"
          docker network inspect bankrotai >/dev/null 2>&1 || docker network create bankrotai
          cat > /opt/bankrotai/wstunnel/Dockerfile <<'DOCKERFILE'
          FROM debian:trixie-slim
          COPY wstunnel /usr/local/bin/bankrotai-wstunnel
          RUN chmod 755 /usr/local/bin/bankrotai-wstunnel
          ENTRYPOINT ["/usr/local/bin/bankrotai-wstunnel"]
          DOCKERFILE
          docker build --pull -t bankrotai-wstunnel:10.7.0 /opt/bankrotai/wstunnel
          systemctl disable --now bankrotai-wstunnel.service >/dev/null 2>&1 || true
          docker rm -f bankrotai-wstunnel >/dev/null 2>&1 || true
          docker run -d --name bankrotai-wstunnel --restart unless-stopped --network bankrotai \
            -v /opt/bankrotai/wstunnel/restrictions.yaml:/restrictions.yaml:ro \
            bankrotai-wstunnel:10.7.0 server --restrict-config /restrictions.yaml ws://0.0.0.0:18081
          if ! grep -q "^${WSS_HOSTNAME} {" /opt/bankrotai/Caddyfile; then
            cat >> /opt/bankrotai/Caddyfile <<CADDY

          ${WSS_HOSTNAME} {
            reverse_proxy host.docker.internal:18081
            header Cache-Control "no-store"
            log {
              output stdout
              format json
            }
          }
          CADDY
          fi
          sed -i -E "s#reverse_proxy [^ ]+:18081#reverse_proxy bankrotai-wstunnel:18081#g" /opt/bankrotai/Caddyfile
          sed -i -E "s#reverse_proxy [^ ]+:18080#reverse_proxy bankrotai-wstunnel:18080#g" /opt/bankrotai/Caddyfile
          docker run --rm --env-file /opt/bankrotai/caddy.env \
            -v /opt/bankrotai/Caddyfile:/etc/caddy/Caddyfile:ro caddy:2-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker rm -f bankrotai-caddy >/dev/null 2>&1 || true
          docker run -d --name bankrotai-caddy --restart unless-stopped --network bankrotai \
            --add-host host.docker.internal:host-gateway --env-file /opt/bankrotai/caddy.env \
            -p 80:80 -p 443:443 \
            -v /opt/bankrotai/Caddyfile:/etc/caddy/Caddyfile:ro -v /opt/bankrotai/web:/srv:ro \
            -v bankrotai_caddy_data:/data -v bankrotai_caddy_config:/config caddy:2-alpine
          sleep 3
          if ! docker exec bankrotai-caddy sh -c "wget -S -O /dev/null http://bankrotai-wstunnel:18081/ 2>&1 | grep -F 'HTTP/'"; then
            docker inspect bankrotai-caddy --format '{{json .NetworkSettings.Networks}}'
            docker exec bankrotai-caddy cat /etc/hosts
            docker logs --tail 40 bankrotai-wstunnel || true
            exit 1
          fi
          REMOTE

  configure-client:
    needs: configure-server
    runs-on: [self-hosted, Windows, X64, bankrotai-home]
    timeout-minutes: 20
    environment: production
    env:
      CONFIG_ROOT: C:\ProgramData\BankrotAI\relay
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned wstunnel client
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path $env:CONFIG_ROOT -Force | Out-Null
          $binary = Join-Path $env:CONFIG_ROOT 'wstunnel.exe'
          if (-not (Test-Path $binary)) {
            $archive = Join-Path $env:RUNNER_TEMP 'wstunnel.tar.gz'
            $url = "https://github.com/erebe/wstunnel/releases/download/v$env:WSTUNNEL_VERSION/wstunnel_$($env:WSTUNNEL_VERSION)_windows_amd64.tar.gz"
            Invoke-WebRequest -Uri $url -OutFile $archive
            tar.exe -xzf $archive -C $env:CONFIG_ROOT
          }
          if (-not (Test-Path $binary)) { throw 'wstunnel.exe was not installed' }
      - name: Install persistent authenticated WSS relay
        env:
          SERVICE_KEY: ${{ secrets.KOYEB_SERVICE_KEY }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:SERVICE_KEY) { throw 'KOYEB_SERVICE_KEY is unavailable' }
          $hmac = [Security.Cryptography.HMACSHA256]::new([Text.Encoding]::UTF8.GetBytes($env:SERVICE_KEY))
          try { $digest = $hmac.ComputeHash([Text.Encoding]::UTF8.GetBytes('bankrotai-home-wss-relay-v1')) } finally { $hmac.Dispose() }
          $token = [Convert]::ToBase64String($digest).TrimEnd('=').Replace('+','-').Replace('/','_')
          $headers = Join-Path $env:CONFIG_ROOT 'relay-headers.txt'
          [IO.File]::WriteAllText($headers, "Authorization: Bearer $token`r`n", [Text.Encoding]::ASCII)
          $runnerSid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          & icacls.exe $headers /inheritance:r /grant:r '*S-1-5-18:F' '*S-1-5-32-544:F' "*$runnerSid`:F" | Out-Null
          $watchdog = Join-Path $env:CONFIG_ROOT 'ensure-home-relay.ps1'
          $script = @'
          $ErrorActionPreference = 'Stop'
          $root = 'C:\ProgramData\BankrotAI\relay'
          $binary = Join-Path $root 'wstunnel.exe'
          $headers = Join-Path $root 'relay-headers.txt'
          $log = Join-Path $root 'relay-wss.log'
          $relayProbe = 'https://home-relay.194-226-126-233.sslip.io/health/live'
          $reverseMapping = 'tcp://0.0.0.0:18080:127.0.0.1:18000'
          $relayUrl = 'wss://relay.194-226-126-233.sslip.io'
          $env:NO_COLOR = 'true'
          function ConvertTo-CommandLineArguments {
            param([string] $commandLine)
            if ([string]::IsNullOrEmpty($commandLine) -or $commandLine.Length -gt 8192) { return @() }
            $tokens = New-Object 'System.Collections.Generic.List[string]'
            $current = New-Object System.Text.StringBuilder
            $inQuotes = $false
            $tokenStarted = $false
            for ($index = 0; $index -lt $commandLine.Length; $index++) {
              $character = $commandLine[$index]
              if ($character -eq '"') {
                $inQuotes = -not $inQuotes
                $tokenStarted = $true
                continue
              }
              if ([char]::IsWhiteSpace($character) -and -not $inQuotes) {
                if ($tokenStarted) {
                  if ($tokens.Count -ge 64) { return @() }
                  $tokens.Add($current.ToString()) | Out-Null
                  $current.Clear() | Out-Null
                  $tokenStarted = $false
                }
                continue
              }
              $current.Append($character) | Out-Null
              $tokenStarted = $true
            }
            if ($inQuotes) { return @() }
            if ($tokenStarted) {
              if ($tokens.Count -ge 64) { return @() }
              $tokens.Add($current.ToString()) | Out-Null
            }
            return $tokens.ToArray()
          }
          function Test-ConnectorCommandLine {
            param([string] $commandLine)
            $commandArgs = @(ConvertTo-CommandLineArguments $commandLine)
            return ($commandArgs -ccontains $reverseMapping -and $commandArgs -ccontains $relayUrl)
          }
          function Get-ConnectorProcesses {
            @(Get-CimInstance Win32_Process -Filter "Name = 'wstunnel.exe'" | Where-Object {
              $_.CommandLine -and (Test-ConnectorCommandLine $_.CommandLine)
            })
          }
          function Get-RelayHealth {
            $status = & curl.exe -sS --connect-timeout 2 --max-time 5 -o NUL -w '%{http_code}' $relayProbe 2>$null
            [pscustomobject]@{ Status = $status; ExitCode = $LASTEXITCODE }
          }
          $existing = @(Get-ConnectorProcesses)
          $healthySamples = 0
          $lastProbe = $null
          if ($existing.Count -gt 0) {
            $healthySamples = 0
            for ($sample = 1; $sample -le 2; $sample++) {
              $lastProbe = Get-RelayHealth
              if ($lastProbe.ExitCode -eq 0 -and $lastProbe.Status -eq '200') { $healthySamples++ }
              if ($sample -lt 2) { Start-Sleep -Seconds 2 }
            }
          }
          if ($existing.Count -eq 1 -and $healthySamples -eq 2) { exit 0 }

          $stopDeadline = (Get-Date).AddSeconds(8)
          do {
            $matching = @(Get-ConnectorProcesses)
            $matching | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
            if ($matching.Count -gt 0) {
              Start-Sleep -Seconds 1
            }
          } while ((Get-ConnectorProcesses).Count -gt 0 -and (Get-Date) -lt $stopDeadline)
          $remaining = @(Get-ConnectorProcesses)
          if ($remaining.Count -gt 0) {
            throw "Matching wstunnel connector(s) did not exit within the bounded restart window: $($remaining.ProcessId -join ',')"
          }
          $args = @('client','--log-lvl','INFO','--http-headers-file',$headers,'--websocket-ping-frequency','15s','-R','tcp://0.0.0.0:18080:127.0.0.1:18000','wss://relay.194-226-126-233.sslip.io')
          Start-Process -FilePath $binary -ArgumentList $args -RedirectStandardOutput $log -RedirectStandardError "$log.err" -WindowStyle Hidden
          $lastDiagnostic = 'new connector did not report a health sample'
          for ($attempt = 1; $attempt -le 4; $attempt++) {
            $matching = @(Get-ConnectorProcesses)
            $probe = Get-RelayHealth
            $lastDiagnostic = "attempt $attempt/4: matchingConnectorCount=$($matching.Count) pids=$($matching.ProcessId -join ','); publicStatus=$($probe.Status); curlExit=$($probe.ExitCode)"
            if ($matching.Count -eq 1 -and $probe.ExitCode -eq 0 -and $probe.Status -eq '200') { exit 0 }
            if ($attempt -lt 4) { Start-Sleep -Seconds 2 }
          }
          throw "New matching wstunnel connector did not converge: $lastDiagnostic"
          '@
          [IO.File]::WriteAllText($watchdog, $script, [Text.Encoding]::ASCII)
          & icacls.exe $watchdog /inheritance:r /grant:r '*S-1-5-18:F' '*S-1-5-32-544:F' "*$runnerSid`:F" | Out-Null
          $runnerOwnedConnectors = @(Get-CimInstance Win32_Process -Filter "Name = 'wstunnel.exe'" | Where-Object {
            $commandLine = [string] $_.CommandLine
            $commandLine.Contains('tcp://0.0.0.0:18080:127.0.0.1:18000') -and
              $commandLine.Contains('wss://relay.194-226-126-233.sslip.io')
          })
          $runnerOwnedConnectors | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction Stop }
          $retirementDeadline = (Get-Date).AddSeconds(10)
          do {
            $remainingRunnerConnectors = @($runnerOwnedConnectors | Where-Object { Get-Process -Id $_.ProcessId -ErrorAction SilentlyContinue })
            if ($remainingRunnerConnectors.Count -gt 0) { Start-Sleep -Seconds 1 }
          } while ($remainingRunnerConnectors.Count -gt 0 -and (Get-Date) -lt $retirementDeadline)
          if ($remainingRunnerConnectors.Count -gt 0) {
            throw "Runner-owned relay connector(s) did not stop before watchdog activation: $($remainingRunnerConnectors.ProcessId -join ',')"
          }
          Get-ScheduledTask -TaskName 'BankrotAI Home Reverse Relay' -ErrorAction SilentlyContinue | Unregister-ScheduledTask -Confirm:$false
          Get-CimInstance Win32_Process | Where-Object { $_.Name -eq 'ssh.exe' -and $_.CommandLine -like '*bankrotai_home_relay_ed25519*' } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          $action = New-ScheduledTaskAction -Execute 'powershell.exe' -Argument '-NoProfile -ExecutionPolicy Bypass -File "C:\ProgramData\BankrotAI\relay\ensure-home-relay.ps1"'
          $startup = New-ScheduledTaskTrigger -AtStartup
          $repeat = New-ScheduledTaskTrigger -Once -At (Get-Date).AddMinutes(1) -RepetitionInterval (New-TimeSpan -Minutes 1)
          $principal = New-ScheduledTaskPrincipal -UserId 'SYSTEM' -LogonType ServiceAccount -RunLevel Highest
          $settings = New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries -ExecutionTimeLimit (New-TimeSpan -Minutes 1) -MultipleInstances IgnoreNew
          $taskName = 'BankrotAI Home WSS Relay'
          $expectedArguments = '-NoProfile -ExecutionPolicy Bypass -File "C:\ProgramData\BankrotAI\relay\ensure-home-relay.ps1"'
          function Get-TaskProperty {
            param([object] $object, [string] $name)
            if ($null -eq $object) { return $null }
            $property = $object.PSObject.Properties[$name]
            if ($null -eq $property -or $null -eq $property.Value) { return $null }
            return $property.Value
          }
          function Test-TaskHasProperty {
            param([object] $object, [string] $name)
            return ($null -ne $object -and $null -ne $object.PSObject.Properties[$name])
          }
          function Resolve-TaskPrincipalSid {
            param([object] $userId)
            if ($null -eq $userId -or [string]::IsNullOrWhiteSpace([string] $userId)) { return $null }
            $principalText = [string] $userId
            try {
              return (New-Object Security.Principal.SecurityIdentifier($principalText)).Value
            } catch {}
            $candidates = New-Object 'System.Collections.Generic.List[string]'
            $candidates.Add($principalText) | Out-Null
            try {
              $systemAccount = (New-Object Security.Principal.SecurityIdentifier('S-1-5-18')).Translate([Security.Principal.NTAccount]).Value
              $systemLeaf = $systemAccount.Split('\')[-1]
              if ($principalText -ceq 'SYSTEM' -or $principalText -ceq $systemLeaf) {
                $candidates.Add($systemAccount) | Out-Null
              }
            } catch {}
            foreach ($candidate in $candidates) {
              try {
                return (New-Object Security.Principal.NTAccount($candidate)).Translate([Security.Principal.SecurityIdentifier]).Value
              } catch {}
            }
            return $null
          }
          function ConvertTo-TaskBoundary {
            param([object] $value)
            if ($value -is [datetime]) { return $value }
            if ($null -eq $value -or [string]::IsNullOrWhiteSpace([string] $value)) { return $null }
            $boundary = [datetime]::MinValue
            if (-not [datetime]::TryParse([string] $value, [ref] $boundary)) { return $null }
            return $boundary
          }
          function Test-IndefiniteRepetitionDuration {
            param([object] $duration)
            if ($null -eq $duration -or [string]::IsNullOrWhiteSpace([string] $duration)) { return $true }
            return ([string] $duration -ceq 'PT0S')
          }
          function Get-NextTimeTriggerOccurrence {
            param([datetime] $startBoundary, [datetime] $observationStart)
            if ($startBoundary -ge $observationStart) { return $startBoundary }
            $intervalsElapsed = [math]::Ceiling(($observationStart - $startBoundary).TotalMinutes)
            return $startBoundary.AddMinutes($intervalsElapsed)
          }
          function Test-HomeRelayTask {
            param([object] $task, [ValidateSet('SYSTEM','runner')] [string] $mode, [string] $expectedPrincipalSid, [datetime] $observationStart = (Get-Date))
            $observationDeadline = $observationStart.AddSeconds(130)
            $actions = @(Get-TaskProperty $task 'Actions')
            if ($actions.Count -ne 1) { return $false }
            if ((Get-TaskProperty $actions[0] 'Execute') -cne 'powershell.exe') { return $false }
            if ((Get-TaskProperty $actions[0] 'Arguments') -cne $expectedArguments) { return $false }
            $principalReadBack = Get-TaskProperty $task 'Principal'
            $principalSid = Resolve-TaskPrincipalSid (Get-TaskProperty $principalReadBack 'UserId')
            if ($principalSid -cne $expectedPrincipalSid) { return $false }
            if ($mode -ceq 'SYSTEM' -and ((Get-TaskProperty $principalReadBack 'LogonType') -cne 'ServiceAccount' -or (Get-TaskProperty $principalReadBack 'RunLevel') -cne 'Highest')) { return $false }
            if ($mode -ceq 'runner' -and ((Get-TaskProperty $principalReadBack 'LogonType') -cne 'ServiceAccount' -or (Get-TaskProperty $principalReadBack 'RunLevel') -cne 'Limited')) { return $false }
            $settingsReadBack = Get-TaskProperty $task 'Settings'
            if ((Get-TaskProperty $settingsReadBack 'Enabled') -ne $true) { return $false }
            if ($mode -ceq 'runner' -and (Get-TaskProperty $settingsReadBack 'StartWhenAvailable') -ne $false) { return $false }
            if ((Get-TaskProperty $settingsReadBack 'ExecutionTimeLimit') -cne 'PT1M') { return $false }
            if ((Get-TaskProperty $settingsReadBack 'MultipleInstances') -cne 'IgnoreNew') { return $false }
            $triggers = @(Get-TaskProperty $task 'Triggers')
            if (($mode -ceq 'SYSTEM' -and $triggers.Count -ne 2) -or ($mode -ceq 'runner' -and $triggers.Count -ne 1)) { return $false }
            $startupCount = 0
            $repeatCount = 0
            foreach ($trigger in $triggers) {
              $cimClass = Get-TaskProperty $trigger 'CimClass'
              $className = Get-TaskProperty $cimClass 'CimClassName'
              if ($className -ceq 'MSFT_TaskBootTrigger') {
                if ($mode -cne 'SYSTEM') { return $false }
                if ((Get-TaskProperty $trigger 'Enabled') -ne $true) { return $false }
                $startupCount++
                continue
              }
              if ($className -ceq 'MSFT_TaskTimeTrigger') {
                if ((Get-TaskProperty $trigger 'Enabled') -ne $true) { return $false }
                $repetition = Get-TaskProperty $trigger 'Repetition'
                if ((Get-TaskProperty $repetition 'Interval') -cne 'PT1M') { return $false }
                if (-not (Test-TaskHasProperty $repetition 'Duration')) { return $false }
                if (-not (Test-IndefiniteRepetitionDuration (Get-TaskProperty $repetition 'Duration'))) { return $false }
                if (-not (Test-TaskHasProperty $trigger 'StartBoundary')) { return $false }
                $startBoundary = ConvertTo-TaskBoundary (Get-TaskProperty $trigger 'StartBoundary')
                if ($null -eq $startBoundary) { return $false }
                $nextOccurrence = Get-NextTimeTriggerOccurrence $startBoundary $observationStart
                if ($nextOccurrence -gt $observationDeadline) { return $false }
                if (Test-TaskHasProperty $trigger 'RandomDelay') {
                  $randomDelay = Get-TaskProperty $trigger 'RandomDelay'
                  if ($null -ne $randomDelay -and -not [string]::IsNullOrWhiteSpace([string] $randomDelay) -and [string] $randomDelay -cne 'PT0S') { return $false }
                }
                if (-not (Test-TaskHasProperty $trigger 'EndBoundary')) { return $false }
                $endBoundaryValue = Get-TaskProperty $trigger 'EndBoundary'
                if ($null -ne $endBoundaryValue -and -not [string]::IsNullOrWhiteSpace([string] $endBoundaryValue)) { return $false }
                $repeatCount++
                continue
              }
              return $false
            }
            if ($mode -ceq 'SYSTEM') { return ($startupCount -eq 1 -and $repeatCount -eq 1) }
            return ($startupCount -eq 0 -and $repeatCount -eq 1)
          }
          function Write-RunnerTaskValidationDiagnostic {
            param([object] $task)
            $now = Get-Date
            $actions = @(Get-TaskProperty $task 'Actions' | Where-Object { $null -ne $_ })
            $triggers = @(Get-TaskProperty $task 'Triggers' | Where-Object { $null -ne $_ })
            $principalReadBack = Get-TaskProperty $task 'Principal'
            $settingsReadBack = Get-TaskProperty $task 'Settings'
            $triggerDetails = @()
            foreach ($trigger in $triggers) {
              $repetition = Get-TaskProperty $trigger 'Repetition'
              $interval = Get-TaskProperty $repetition 'Interval'
              $startBoundary = ConvertTo-TaskBoundary (Get-TaskProperty $trigger 'StartBoundary')
              $startClass = if ($interval -cne 'PT1M') { 'invalid-interval' } elseif ($null -eq $startBoundary) { 'missing-or-invalid' } elseif ((Get-NextTimeTriggerOccurrence $startBoundary $now) -le $now.AddSeconds(130)) { 'eligible-within-130s' } else { 'after-130s-window' }
              $randomDelay = Get-TaskProperty $trigger 'RandomDelay'
              $triggerDetails += [pscustomobject]@{
                className = Get-TaskProperty (Get-TaskProperty $trigger 'CimClass') 'CimClassName'; enabled = Get-TaskProperty $trigger 'Enabled'; repetitionInterval = $interval; repetitionDuration = Get-TaskProperty $repetition 'Duration'; startBoundary = $startClass; endBoundaryEmpty = [string]::IsNullOrWhiteSpace([string] (Get-TaskProperty $trigger 'EndBoundary')); randomDelay = if ($null -eq $randomDelay -or [string]::IsNullOrWhiteSpace([string] $randomDelay)) { 'empty' } else { [string] $randomDelay }
              }
            }
            $diagnostic = [pscustomobject]@{
              code = 'runner-task-validation-failed'; principalSid = Resolve-TaskPrincipalSid (Get-TaskProperty $principalReadBack 'UserId'); logonType = Get-TaskProperty $principalReadBack 'LogonType'; runLevel = Get-TaskProperty $principalReadBack 'RunLevel'; enabled = Get-TaskProperty $settingsReadBack 'Enabled'; startWhenAvailable = Get-TaskProperty $settingsReadBack 'StartWhenAvailable'; executionTimeLimit = Get-TaskProperty $settingsReadBack 'ExecutionTimeLimit'; multipleInstances = Get-TaskProperty $settingsReadBack 'MultipleInstances'; actionCount = $actions.Count; executable = if ($actions.Count -eq 1) { Get-TaskProperty $actions[0] 'Execute' } else { $null }; argumentsMatch = ($actions.Count -eq 1 -and (Get-TaskProperty $actions[0] 'Arguments') -ceq $expectedArguments); triggerCount = $triggers.Count; triggers = $triggerDetails
            }
            Write-Warning (ConvertTo-Json $diagnostic -Compress -Depth 4)
          }
          $systemTaskName = 'BankrotAI Home WSS Relay'
          $runnerTaskName = 'BankrotAI Home WSS Relay Runner'
          $systemPrincipalSid = 'S-1-5-18'
          $runnerPrincipalSid = $runnerSid
          $selectedTaskName = $null
          $selectedPrincipalSid = $null
          $selectedMode = $null
          function Get-TaskOrNull {
            param([string] $name)
            try { return Get-ScheduledTask -TaskName $name -ErrorAction Stop } catch {
              if (@('NoMatchingMSFT_ScheduledTaskFound,Get-ScheduledTask','CmdletizationQuery_NotFound_TaskName,Get-ScheduledTask') -contains $_.FullyQualifiedErrorId) { return $null }
              throw
            }
          }
          function Retire-RunnerWatchdog {
            $runnerTask = Get-TaskOrNull $runnerTaskName
            if ($null -eq $runnerTask) { return }
            if (-not (Test-HomeRelayTask $runnerTask 'runner' $runnerPrincipalSid)) {
              throw "Runner-owned watchdog '$runnerTaskName' exists but does not satisfy the required retirement invariants"
            }
            Disable-ScheduledTask -TaskName $runnerTaskName -ErrorAction Stop | Out-Null
            $runnerTask = Get-TaskOrNull $runnerTaskName
            if ($null -eq $runnerTask -or (Get-TaskProperty (Get-TaskProperty $runnerTask 'Settings') 'Enabled') -ne $false) { throw "Runner-owned watchdog '$runnerTaskName' did not become disabled during retirement" }
            $stopDeadline = (Get-Date).AddSeconds(15)
            do {
              $runnerState = Get-TaskProperty $runnerTask 'State'
              if ($null -eq $runnerState) { throw "Runner-owned watchdog '$runnerTaskName' has unreadable state during retirement" }
              if ($runnerState -eq 'Running') { Stop-ScheduledTask -TaskName $runnerTaskName -ErrorAction Stop }
              Start-Sleep -Seconds 1
              $runnerTask = Get-TaskOrNull $runnerTaskName
            } while ($runnerTask -and (Get-TaskProperty $runnerTask 'State') -eq 'Running' -and (Get-Date) -lt $stopDeadline)
            $finalRunnerState = if ($runnerTask) { Get-TaskProperty $runnerTask 'State' } else { $null }
            if ($null -eq $finalRunnerState -or $finalRunnerState -eq 'Running') { throw "Runner-owned watchdog '$runnerTaskName' did not quiesce before SYSTEM mode activation" }
            Unregister-ScheduledTask -TaskName $runnerTaskName -Confirm:$false -ErrorAction Stop
            if (Get-TaskOrNull $runnerTaskName) { throw "Runner-owned watchdog '$runnerTaskName' remains registered after retirement" }
          }
          try {
            Register-ScheduledTask -TaskName $systemTaskName -Action $action -Trigger @($startup,$repeat) -Principal $principal -Settings $settings -Force | Out-Null
          } catch {
            Write-Warning "Unable to update SYSTEM watchdog '$systemTaskName'; checking the exact existing task: $($_.Exception.Message)"
          }
          $systemTask = Get-TaskOrNull $systemTaskName
          if ($systemTask -and (Test-HomeRelayTask $systemTask 'SYSTEM' $systemPrincipalSid)) {
            Retire-RunnerWatchdog
            $selectedTaskName = $systemTaskName
            $selectedPrincipalSid = $systemPrincipalSid
            $selectedMode = 'SYSTEM'
          } else {
            if ($systemTask) {
              throw "Existing SYSTEM watchdog '$systemTaskName' does not satisfy the required action, identity, settings, and trigger invariants"
            }
            $runnerPrincipal = New-ScheduledTaskPrincipal -UserId $runnerPrincipalSid -LogonType ServiceAccount -RunLevel Limited
            $runnerSettings = New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries -ExecutionTimeLimit (New-TimeSpan -Minutes 1) -MultipleInstances IgnoreNew -StartWhenAvailable:$false
            try {
              Register-ScheduledTask -TaskName $runnerTaskName -Action $action -Trigger $repeat -Principal $runnerPrincipal -Settings $runnerSettings -Force | Out-Null
            } catch {
              throw "Unable to register runner-owned watchdog '$runnerTaskName' for current SID $runnerPrincipalSid after SYSTEM watchdog was unavailable: $($_.Exception.Message)"
            }
            $runnerTask = Get-TaskOrNull $runnerTaskName
            if (-not (Test-HomeRelayTask $runnerTask 'runner' $runnerPrincipalSid)) {
              Write-RunnerTaskValidationDiagnostic $runnerTask
              throw "Runner-owned watchdog '$runnerTaskName' does not match the required action, current SID, settings, and trigger invariants"
            }
            $selectedTaskName = $runnerTaskName
            $selectedPrincipalSid = $runnerPrincipalSid
            $selectedMode = 'runner'
          }
          $task = Get-ScheduledTask -TaskName $selectedTaskName -ErrorAction Stop
          $beforeDispatch = Get-ScheduledTaskInfo -TaskName $selectedTaskName -ErrorAction Stop
          if ($null -eq $beforeDispatch.LastRunTime) {
            throw "Scheduled $selectedMode watchdog '$selectedTaskName' has no readable LastRunTime"
          }
          $previousLastRun = $beforeDispatch.LastRunTime
          $waitStarted = Get-Date
          try {
            Start-ScheduledTask -TaskName $selectedTaskName -ErrorAction Stop
          } catch {
            Write-Warning "Unable to start scheduled $selectedMode watchdog '$selectedTaskName'; waiting for its validated minute trigger: $($_.Exception.Message)"
          }
          $completionDeadline = $waitStarted.AddSeconds(130)
          $completed = $false
          do {
            Start-Sleep -Seconds 2
            $task = Get-ScheduledTask -TaskName $selectedTaskName -ErrorAction Stop
            if (-not (Test-HomeRelayTask $task $selectedMode $selectedPrincipalSid)) {
              throw "Scheduled $selectedMode watchdog '$selectedTaskName' changed while waiting for execution"
            }
            $taskInfo = Get-ScheduledTaskInfo -TaskName $selectedTaskName -ErrorAction Stop
            $lastRunTime = $taskInfo.LastRunTime
            $lastTaskResult = Get-TaskProperty $taskInfo 'LastTaskResult'
            $state = Get-TaskProperty $task 'State'
            if ($null -eq $lastRunTime -or $null -eq $lastTaskResult -or $null -eq $state) {
              throw "Scheduled $selectedMode watchdog '$selectedTaskName' has unreadable execution state"
            }
            $isCorrelatedRun = $lastRunTime -gt $previousLastRun -and $lastRunTime -ge $waitStarted.AddSeconds(-1) -and $lastRunTime -le $completionDeadline
            if ($isCorrelatedRun -and $state -ne 'Running') {
              if ($lastTaskResult -ne 0) {
                throw "Scheduled $selectedMode watchdog '$selectedTaskName' failed after dispatch: result=$($taskInfo.LastTaskResult); lastRun=$($taskInfo.LastRunTime.ToString('o'))"
              }
              Write-Host "Scheduled $selectedMode watchdog '$selectedTaskName' completed successfully after the validated dispatch window at $($taskInfo.LastRunTime.ToString('o'))"
              $completed = $true
              break
            }
          } while ((Get-Date) -lt $completionDeadline)
          if (-not $completed) {
            throw "Scheduled $selectedMode watchdog '$selectedTaskName' did not complete successfully after dispatch before $($completionDeadline.ToString('o'))"
          }
      - name: Verify end-to-end relay health
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          function Get-HttpProbe([string] $uri) {
            $status = & curl.exe -sS --connect-timeout 3 --max-time 8 -o NUL -w '%{http_code}' $uri 2>$null
            [pscustomobject]@{ Status = $status; ExitCode = $LASTEXITCODE }
          }
          $lastDiagnostic = 'Health gate did not run'
          for ($attempt = 1; $attempt -le 10; $attempt++) {
            $process = @(Get-Process -Name 'wstunnel' -ErrorAction SilentlyContinue)
            $local = Get-HttpProbe 'http://127.0.0.1:18000/health/live'
            $public = Get-HttpProbe 'https://home-relay.194-226-126-233.sslip.io/health/live'
            $pids = $process.Id -join ','
            $lastDiagnostic = "attempt $attempt/10: wstunnel count=$($process.Count) pids=$pids; local status=$($local.Status) curlExit=$($local.ExitCode); public status=$($public.Status) curlExit=$($public.ExitCode)"
            Write-Host $lastDiagnostic
            if ($process.Count -eq 1 -and $local.Status -eq '200' -and $local.ExitCode -eq 0 -and $public.Status -eq '200' -and $public.ExitCode -eq 0) {
              Write-Host 'End-to-end relay health gate passed.'
              exit 0
            }
            if ($attempt -lt 10) { Start-Sleep -Seconds 3 }
          }
          throw "End-to-end relay health gate failed: $lastDiagnostic"

  verify-public-relay:
    needs: configure-client
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require 20 consecutive public successes
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            test "$(curl -sS --connect-timeout 5 --max-time 10 -o /dev/null -w '%{http_code}' "https://${PUBLIC_RELAY_HOSTNAME}/health/live")" = 200
            sleep 1
          done
