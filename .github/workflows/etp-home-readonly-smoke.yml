name: ETP home live read-only pilot smoke

on:
  workflow_run:
    workflows: ["Deploy home secondary origin"]
    types: [completed]
    branches: [main]
permissions:
  actions: read
  contents: read

concurrency:
  group: etp-readonly-smoke
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, Windows, X64, bankrotai-home]
    timeout-minutes: 12
    steps:
      - name: Probe official ETP catalogues from the deployed trusted worker
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:RUNNER_TEMP 'etp-readonly-smoke.json'
          docker exec bankrotai-home-ingestion-worker python -m bankrotai.services.etp_incremental_probe 2>&1 |
            Tee-Object -FilePath $output
          if ($LASTEXITCODE -ne 0) {
            throw 'M-ETS or CDTRF has no confirmed verified item in the limited live probe'
          }
      - name: Preserve PII-free evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: etp-live-readonly-${{ github.run_id }}
          path: ${{ runner.temp }}\\etp-readonly-smoke.json
          if-no-files-found: ignore
          retention-days: 14
