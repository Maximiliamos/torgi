name: CDTRF complete catalogue read-only acceptance

on:
  push:
    branches: [feat/cdtrf-catalog-timeline-20261030]
    paths:
      - '.github/workflows/etp-cdtrf-full-catalogue-readonly.yml'
      - 'src/bankrotai/services/etp_cdtrf_full_catalogue.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cdtrf-full-catalogue-readonly
  cancel-in-progress: true

jobs:
  full-catalogue:
    runs-on: [self-hosted, Windows, X64, bankrotai-home]
    timeout-minutes: 120
    if: github.ref == 'refs/heads/feat/cdtrf-catalog-timeline-20261030'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify canonical Home worker
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path 'src/bankrotai/services/etp_cdtrf_full_catalogue.py')) {
            throw 'Exact checked out CDTRF scanner missing'
          }
          $worker = @(docker ps --filter 'name=^/bankrotai-home-ingestion-worker$' --format '{{.Names}}')
          if ($LASTEXITCODE -ne 0 -or $worker -ne 'bankrotai-home-ingestion-worker') {
            throw 'Canonical Home ingestion worker is unavailable'
          }

      - name: Run full CDTRF catalogue without DB writes (100 then 50 then 20)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $src = (Resolve-Path 'src/bankrotai/services/etp_cdtrf_full_catalogue.py').Path
          $resultPath = Join-Path $env:GITHUB_WORKSPACE 'cdtrf-complete-readonly.json'
          $ok = $false
          foreach ($pageSize in @(100,50,20)) {
            Write-Output ("CDTRF full read-only attempt; page_size={0}" -f $pageSize)
            $ErrorActionPreference = 'Continue'
            $output = @(Get-Content -LiteralPath $src -Raw | docker exec -i bankrotai-home-ingestion-worker python -c "import sys; code=sys.stdin.read().lstrip(chr(65279)); exec(compile(code,'cdtrf_full_readonly','exec'), {'__name__':'__main__'})" --page-size $pageSize --max-pages 10000 --delay-seconds 1 2>&1)
            $exitCode = $LASTEXITCODE
            $ErrorActionPreference = 'Stop'
            if ($exitCode -ne 0) {
              Write-Output ("CDTRF full scan failed with code {0}; log tail: {1}" -f $exitCode, ((@($output) | Select-Object -Last 5) -join ' '))
              Write-Warning ("CDTRF PageSize={0} failed; fall back to next official size" -f $pageSize)
              continue
            }
            $jsonLine = @($output | Where-Object { $_ -is [string] -and $_.Trim().StartsWith('{') } | Select-Object -Last 1)
            if ($jsonLine.Count -ne 1) { throw 'Read-only scan returned no machine-readable evidence' }
            $report = $jsonLine[0] | ConvertFrom-Json
            if ($report.selected_catalogue_pages_observed -ne $true -or
                $report.pages_scanned -ne $report.pages_expected -or
                $report.unique_catalogue_lot_ids -ne $report.reported_total -or
                $report.production_database_writes -ne 0 -or
                $report.complete_source_inventory -ne $false -or
                $report.archival_allowed -ne $false -or
                $report.map_publication -ne $false) {
              throw 'CDTRF evidence inconsistent or overstates completeness'
            }
            $report | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $resultPath -Encoding UTF8
            Write-Output ("CDTRF verified read-only: pages={0}, IDs={1}, hints={2}, page_size={3}" -f $report.pages_scanned, $report.unique_catalogue_lot_ids, $report.property_hint_candidates, $pageSize)
            $ok = $true
            break
          }
          if (-not $ok) { throw 'Full read-only CDTRF scan failed at 100, 50 and 20' }

      - name: Verify sample CDTRF details, without database writes
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $output = @(docker exec bankrotai-home-ingestion-worker python -m bankrotai.services.etp_fivepage_readonly --source cdtrf.ru)
          if ($LASTEXITCODE -ne 0 -or $output.Count -lt 1) { throw 'CDTRF exact-lot five-page detail verification failed' }
          $detail = $output[-1] | ConvertFrom-Json
          if ($detail.source -ne 'cdtrf.ru' -or $detail.pages_verified -ne 5 -or
              $detail.verified_unique_property_details -lt 1 -or
              $detail.no_database_writes -ne $true -or
              $detail.safe_for_archival -ne $false) {
            throw 'CDTRF detail sample fails the existing source identity/real-estate contract'
          }
          $detail | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath 'cdtrf-detail-readonly.json' -Encoding UTF8
          Write-Output ("CDTRF detail sample: candidates={0}, verified property cards={1}, rejected={2}" -f $detail.catalogue_candidates_seen,$detail.verified_unique_property_details,$detail.details_rejected)

      - name: Save sanitized read-only evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cdtrf-full-readonly
          path: |
            cdtrf-complete-readonly.json
            cdtrf-detail-readonly.json
          if-no-files-found: warn
          retention-days: 30
