name: Home read-only sync and map chain audit
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/home-readonly-sync-map-audit.yml'

permissions:
  contents: read

concurrency:
  group: home-readonly-sync-map-audit
  cancel-in-progress: false

jobs:
  inspect:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.head_ref == 'integration/pr1080-pr1085-etp-home-gates-20261104')
    runs-on: [self-hosted, Windows, X64, bankrotai-home]
    timeout-minutes: 15
    steps:
      - name: Inspect containers and worker pings (never start/stop)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $names = @(
            'bankrotai-home-postgres', 'bankrotai-home-redis',
            'bankrotai-home-secondary', 'bankrotai-home-ingestion-worker',
            'bankrotai-home-geocoding-worker', 'bankrotai-home-map-worker'
          )
          foreach ($name in $names) {
            $result = docker inspect --format '{{.State.Status}}' $name
            if ($LASTEXITCODE -ne 0) { throw "Cannot inspect $name" }
            if ($result.Trim() -ne 'running') { throw "$name is not running" }
            Write-Output "$name=running"
          }
          foreach ($item in @(
            @{Container='bankrotai-home-ingestion-worker'; Node='ingestion@bankrotai-home'},
            @{Container='bankrotai-home-geocoding-worker'; Node='geocoding@bankrotai-home'},
            @{Container='bankrotai-home-map-worker'; Node='map@bankrotai-home'}
          )) {
            $ping = docker exec $item.Container celery -A bankrotai.tasks:celery_app inspect ping -d $item.Node --timeout 5
            if ($LASTEXITCODE -ne 0 -or -not (($ping | Out-String) -match 'pong')) {
              throw "No Celery pong for $($item.Node)"
            }
            Write-Output "$($item.Node)=pong"
          }
      - name: Read-only PostgreSQL leases, 09/21 runs, and current MapDataset
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $probe = @'
          import json
          from sqlalchemy import select
          from bankrotai.db import SessionLocal, LotSyncRun, LotSyncSourceRun, MapDataset
          from bankrotai.services.ingestion import default_source_specs
          from bankrotai.tasks import _unpaused_source_specs, celery_app
          from bankrotai.core import get_settings
          from bankrotai.services.map_object_store import _verify_public_manifest

          def stamp(x):
              return x.isoformat() if x is not None else None

          all_ids = [s.source_id for s in default_source_specs()]
          enabled_ids = [s.source_id for s in _unpaused_source_specs(default_source_specs())]
          beat = celery_app.conf.beat_schedule
          scheduled = {}
          for name in ('refresh-nationwide-sources-full', 'probe-source-network-health',
                       'geocode-pending-lots', 'publish-dirty-map-dataset',
                       'audit-all-direct-etp-profiles'):
              if name in beat:
                  rule = beat[name]
                  scheduled[name] = {'task': rule['task'], 'cron': str(rule['schedule'])}

          with SessionLocal() as session:
              runs = session.scalars(
                  select(LotSyncRun).order_by(LotSyncRun.started_at.desc()).limit(12)
              ).all()
              items = []
              for run in runs:
                  sources = session.scalars(
                      select(LotSyncSourceRun).where(LotSyncSourceRun.sync_run_id == run.id)
                  ).all()
                  items.append({
                      'started_at_utc': stamp(run.started_at), 'finished_at_utc': stamp(run.finished_at),
                      'status': run.status, 'trigger_type': run.trigger_type,
                      'source_count': len(sources),
                      'sources': [{'id': s.source_system, 'status': s.status,
                                   'complete': s.complete_source_run,
                                   'pages': s.pages_scanned,
                                   'seen': s.items_seen,
                                   'inserted': s.items_inserted,
                                   'updated': s.items_updated,
                                   'failed': s.items_failed}
                                  for s in sources]
                  })
              dataset = session.scalar(select(MapDataset)
                  .where(MapDataset.is_current.is_(True), MapDataset.status == 'ready'))
              map_info = None if dataset is None else {
                  'version': dataset.version,
                  'published_at_utc': stamp(dataset.published_at),
                  'point_count': dataset.point_count,
                  'tile_count': dataset.tile_count,
              }

          manifest = {'status': 'no_current_map'}
          if map_info:
              try:
                  m = _verify_public_manifest(get_settings(), map_info['version'])
                  manifest = {
                      'status': 'verified' if (
                          m.get('version') == map_info['version']
                          and int(m.get('point_count', -1)) == int(map_info['point_count'])
                          and int(m.get('tile_count', -1)) == int(map_info['tile_count'])
                      ) else 'mismatch',
                      'version': m.get('version'),
                      'point_count': m.get('point_count'),
                      'tile_count': m.get('tile_count'),
                  }
              except Exception as exc:
                  manifest = {'status': 'unavailable', 'error_type': type(exc).__name__}
          print(json.dumps({
              'audit_read_only': True, 'database_writes': 0,
              'all_configured_source_ids': all_ids,
              'enabled_source_ids': enabled_ids,
              'celery_beat': scheduled,
              'recent_sync_runs': items,
              'current_map': map_info,
              'public_s3_manifest': manifest,
          }, ensure_ascii=False, default=str))
          '@
          $output = $probe | docker exec -i bankrotai-home-ingestion-worker python -
          if ($LASTEXITCODE -ne 0 -or -not $output) { throw 'Read-only Home DB inspection failed' }
          $report = $output | Select-Object -Last 1 | ConvertFrom-Json
          if ($report.audit_read_only -ne $true -or $report.database_writes -ne 0) {
            throw 'Read-only probe contract missing'
          }
          $file = Join-Path $env:RUNNER_TEMP 'home-sync-map-audit.json'
          $report | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $file -Encoding utf8
          Write-Output ('Configured sources: {0}; active: {1}; recent syncs: {2}; map: {3}; S3: {4}' -f
            @($report.all_configured_source_ids).Count,
            @($report.enabled_source_ids).Count,
            @($report.recent_sync_runs).Count,
            $report.current_map.version, $report.public_s3_manifest.status)
          $summary = @(
            '## Home source and map chain — read only',
            '',
            "- Configured: $(@($report.all_configured_source_ids) -join ', ')",
            "- Enabled: $(@($report.enabled_source_ids) -join ', ')",
            "- Current MapDataset: $($report.current_map.version)",
            "- REG.RU S3 manifest: $($report.public_s3_manifest.status)",
            '',
            '| Start UTC | Finish UTC | Status | Trigger | Sources |',
            '|---|---|---|---|---:|'
          )
          foreach ($item in @($report.recent_sync_runs)) {
            $summary += "| $($item.started_at_utc) | $($item.finished_at_utc) | $($item.status) | $($item.trigger_type) | $($item.source_count) |"
          }
          $summary | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          if ($report.public_s3_manifest.status -ne 'verified') {
            throw 'Current map and public S3 manifest could not be reconciled'
          }
      - name: Upload sanitized read-only evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: home-sync-map-readonly-${{ github.run_id }}
          path: ${{ runner.temp }}\\home-sync-map-audit.json
          if-no-files-found: warn
          retention-days: 14
