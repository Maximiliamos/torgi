            if ($exitCode -ne 0) { throw "Managed recovery exited $exitCode" }
            $retryStreak = 0
          }
          $global:LASTEXITCODE = 0
          exit 0
      - name: Upload window 2 evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: overnight-managed-geo-window-2-${{ github.run_id }}
          path: ${{ runner.temp }}\overnight-managed-geo-window-2.jsonl
          if-no-files-found: warn
          retention-days: 30
