name: Deploy home secondary origin

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  actions: read
  contents: read

concurrency:
  group: home-secondary-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Windows, X64, bankrotai-home]
    timeout-minutes: 30
    env:
      IMAGE_NAME: bankrotai-home-api
      CONTAINER_NAME: bankrotai-home-secondary
      WORKER_CONTAINER: bankrotai-home-ingestion-worker
      REDIS_CONTAINER: bankrotai-home-redis
      POSTGRES_CONTAINER: bankrotai-home-postgres
      DOCKER_NETWORK: bankrotai-home
      CONFIG_ROOT: C:\ProgramData\BankrotAI
      API_KEY: ${{ secrets.KOYEB_SERVICE_KEY }}
      SESSION_SECRET: ${{ secrets.AUTH_SESSION_SECRET }}
      BACKUP_ENCRYPTION_PASSWORD: ${{ secrets.BACKUP_ENCRYPTION_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Require production secrets
        shell: powershell
        run: |
          if (-not $env:API_KEY -or -not $env:SESSION_SECRET -or -not $env:BACKUP_ENCRYPTION_PASSWORD) {
            throw "Required production secrets are unavailable"
          }

      - name: Build current-main API image
        shell: powershell
        run: docker build --pull --tag "${env:IMAGE_NAME}:${env:GITHUB_SHA}" .

      - name: Restore latest encrypted Neon backup to local PostgreSQL
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path $env:CONFIG_ROOT -Force | Out-Null
          $passwordPath = Join-Path $env:CONFIG_ROOT 'postgres-password.txt'
          if (-not (Test-Path -LiteralPath $passwordPath)) {
            $bytes = New-Object byte[] 32
            [Security.Cryptography.RandomNumberGenerator]::Create().GetBytes($bytes)
            $password = ([BitConverter]::ToString($bytes)).Replace('-', '').ToLowerInvariant()
            [IO.File]::WriteAllText($passwordPath, $password)
          }
          $password = [IO.File]::ReadAllText($passwordPath).Trim()
          Write-Output "::add-mask::$password"
          $redisPasswordPath = Join-Path $env:CONFIG_ROOT 'redis-password.txt'
          if (-not (Test-Path -LiteralPath $redisPasswordPath)) {
            $bytes = New-Object byte[] 32
            [Security.Cryptography.RandomNumberGenerator]::Create().GetBytes($bytes)
            $redisPassword = ([BitConverter]::ToString($bytes)).Replace('-', '').ToLowerInvariant()
            [IO.File]::WriteAllText($redisPasswordPath, $redisPassword)
          }
          $redisPassword = [IO.File]::ReadAllText($redisPasswordPath).Trim()
          Write-Output "::add-mask::$redisPassword"
          & icacls.exe $passwordPath /inheritance:r /grant:r `
            'SYSTEM:F' '*S-1-5-32-544:F' '*S-1-5-20:R' | Out-Null
          & icacls.exe $redisPasswordPath /inheritance:r /grant:r `
            'SYSTEM:F' '*S-1-5-32-544:F' '*S-1-5-20:R' | Out-Null

          $network = docker network ls --filter "name=^${env:DOCKER_NETWORK}$" --format '{{.Name}}'
          if ($network -ne $env:DOCKER_NETWORK) { docker network create $env:DOCKER_NETWORK | Out-Null }
          $postgres = docker ps -a --filter "name=^/${env:POSTGRES_CONTAINER}$" --format '{{.Names}}'
          if ($postgres -ne $env:POSTGRES_CONTAINER) {
            docker run --detach --restart unless-stopped `
              --name $env:POSTGRES_CONTAINER --network $env:DOCKER_NETWORK `
              --env POSTGRES_USER=bankrotai --env POSTGRES_DB=bankrotai `
              --env "POSTGRES_PASSWORD=$password" `
              --volume bankrotai-home-postgres:/var/lib/postgresql/data `
              postgres:17 | Out-Null
          } else {
            docker start $env:POSTGRES_CONTAINER | Out-Null
          }
          foreach ($attempt in 1..30) {
            docker exec $env:POSTGRES_CONTAINER pg_isready -U bankrotai -d bankrotai *> $null
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 2
          }
          if ($LASTEXITCODE -ne 0) { throw "Local PostgreSQL did not become ready" }

          $restoreMarker = Join-Path $env:CONFIG_ROOT 'restored-backup.txt'
          if (-not (Test-Path -LiteralPath $restoreMarker)) {
            $runs = gh run list --repo $env:GITHUB_REPOSITORY --workflow neon-sync.yml `
              --limit 20 --json databaseId,conclusion,createdAt | ConvertFrom-Json
            $run = $runs | Where-Object { $_.conclusion -eq 'success' } | Select-Object -First 1
            if (-not $run) { throw "No successful Neon backup run is available" }
            $artifactName = "neon-backup-$($run.databaseId)"
            $restoreRoot = Join-Path $env:RUNNER_TEMP 'home-postgres-restore'
            New-Item -ItemType Directory -Path $restoreRoot -Force | Out-Null
            gh run download $run.databaseId --repo $env:GITHUB_REPOSITORY `
              --name $artifactName --dir $restoreRoot
            $encrypted = Get-ChildItem -LiteralPath $restoreRoot -Filter '*.dump.enc' | Select-Object -First 1
            if (-not $encrypted) { throw "Encrypted recovery dump is missing" }
            $dump = Join-Path $restoreRoot 'bankrotai.dump'
            $gitRoot = Split-Path (Split-Path (Get-Command git.exe).Source -Parent) -Parent
            $openssl = Join-Path $gitRoot 'usr\bin\openssl.exe'
            & $openssl enc -d -aes-256-cbc -pbkdf2 `
              -pass env:BACKUP_ENCRYPTION_PASSWORD -in $encrypted.FullName -out $dump
            if ($LASTEXITCODE -ne 0) { throw "Backup decryption failed" }
            docker cp $dump "${env:POSTGRES_CONTAINER}:/tmp/bankrotai.dump"
            docker exec $env:POSTGRES_CONTAINER pg_restore --clean --if-exists `
              --no-owner --no-acl -U bankrotai -d bankrotai /tmp/bankrotai.dump
            if ($LASTEXITCODE -ne 0) { throw "PostgreSQL restore failed" }
            docker exec $env:POSTGRES_CONTAINER rm -f /tmp/bankrotai.dump
            [IO.File]::WriteAllText($restoreMarker, "$($run.databaseId) $($run.createdAt)")
          }

      - name: Install protected runtime configuration
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path $env:CONFIG_ROOT -Force | Out-Null
          $password = [IO.File]::ReadAllText((Join-Path $env:CONFIG_ROOT 'postgres-password.txt')).Trim()
          $redisPassword = [IO.File]::ReadAllText((Join-Path $env:CONFIG_ROOT 'redis-password.txt')).Trim()
          Write-Output "::add-mask::$password"
          Write-Output "::add-mask::$redisPassword"
          $redisConfigPath = Join-Path $env:CONFIG_ROOT 'redis.conf'
          [System.IO.File]::WriteAllLines($redisConfigPath, @(
            'bind 0.0.0.0'
            'protected-mode yes'
            'appendonly yes'
            "requirepass $redisPassword"
          ))
          $configPath = Join-Path $env:CONFIG_ROOT 'home-secondary.env'
          [System.IO.File]::WriteAllLines($configPath, @(
            'APP_ENV=production'
            'API_READ_ONLY=true'
            'DATABASE_TRUSTED_LOCAL=true'
            'TORGI_GOV_BASE_URL=https://api.dezster.ru/__public-source/torgi'
            'ONLINE_SOURCE_CACHE_FIRST=true'
            'PHOTON_BASE_URL=http://bankrotai-photon:2322'
            'API_RATE_LIMIT_PER_MINUTE=60'
            'DATABASE_POOL_SIZE=3'
            'DATABASE_MAX_OVERFLOW=2'
            'DATABASE_POOL_TIMEOUT=10'
            "DATABASE_URL=postgresql+psycopg://bankrotai:${password}@${env:POSTGRES_CONTAINER}:5432/bankrotai"
            "REDIS_URL=redis://:${redisPassword}@${env:REDIS_CONTAINER}:6379/0"
            "BANKROTAI_API_KEY=$env:API_KEY"
            "AUTH_SESSION_SECRET=$env:SESSION_SECRET"
            'CORS_ORIGINS=https://dezster.ru,https://bankrotai.pages.dev'
          ))
          $workerConfigPath = Join-Path $env:CONFIG_ROOT 'home-ingestion-worker.env'
          [System.IO.File]::WriteAllLines($workerConfigPath, @(
            'APP_ENV=production'
            'API_READ_ONLY=false'
            'DATABASE_TRUSTED_LOCAL=true'
            'TORGI_GOV_BASE_URL=https://api.dezster.ru/__public-source/torgi'
            'PHOTON_BASE_URL=http://bankrotai-photon:2322'
            "DATABASE_URL=postgresql+psycopg://bankrotai:${password}@${env:POSTGRES_CONTAINER}:5432/bankrotai"
            "REDIS_URL=redis://:${redisPassword}@${env:REDIS_CONTAINER}:6379/0"
            "BANKROTAI_API_KEY=$env:API_KEY"
          ))
          foreach ($protectedPath in @($redisConfigPath, $configPath, $workerConfigPath)) {
            & icacls.exe $protectedPath /inheritance:r /grant:r `
              'SYSTEM:F' '*S-1-5-32-544:F' '*S-1-5-20:M' | Out-Null
          }

      - name: Apply database migrations before replacing production containers
        shell: powershell
        run: |
          $photon = docker ps --filter 'name=^/bankrotai-photon$' --format '{{.Names}}'
          if ($photon -ne 'bankrotai-photon') {
            throw 'Local Photon container is not running'
          }
          $photonNetworks = docker inspect bankrotai-photon --format '{{json .NetworkSettings.Networks}}'
          if ($photonNetworks -notmatch '"bankrotai-home"') {
            docker network connect $env:DOCKER_NETWORK bankrotai-photon
            if ($LASTEXITCODE -ne 0) { throw 'Could not attach Photon to the production network' }
          }
          docker run --rm `
            --network $env:DOCKER_NETWORK `
            --env-file (Join-Path $env:CONFIG_ROOT 'home-ingestion-worker.env') `
            "${env:IMAGE_NAME}:${env:GITHUB_SHA}" `
            python -m bankrotai.cli init-db
          if ($LASTEXITCODE -ne 0) {
            throw "Database migration failed; existing production containers were left running"
          }

      - name: Start private queue and replace API and trusted ingestion worker
        shell: powershell
        run: |
          $redis = docker ps -a --filter "name=^/${env:REDIS_CONTAINER}$" --format '{{.Names}}'
          if ($redis -ne $env:REDIS_CONTAINER) {
            docker run --detach --restart unless-stopped `
              --name $env:REDIS_CONTAINER `
              --network $env:DOCKER_NETWORK `
              --mount "type=bind,source=$env:CONFIG_ROOT\redis.conf,target=/usr/local/etc/redis/redis.conf,readonly" `
              --volume bankrotai-home-redis:/data `
              redis:7-alpine redis-server /usr/local/etc/redis/redis.conf | Out-Null
          } else {
            docker start $env:REDIS_CONTAINER | Out-Null
          }
          $redisPassword = [IO.File]::ReadAllText((Join-Path $env:CONFIG_ROOT 'redis-password.txt')).Trim()
          Write-Output "::add-mask::$redisPassword"
          foreach ($attempt in 1..30) {
            docker exec --env "REDISCLI_AUTH=$redisPassword" `
              $env:REDIS_CONTAINER redis-cli ping *> $null
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 2
          }
          if ($LASTEXITCODE -ne 0) { throw "Private Redis did not become ready" }

          $existing = docker ps -a --filter "name=^/${env:CONTAINER_NAME}$" --format '{{.Names}}'
          if ($existing -eq $env:CONTAINER_NAME) {
            docker rm --force $env:CONTAINER_NAME | Out-Null
          }
          docker run --detach --restart unless-stopped `
            --name $env:CONTAINER_NAME `
            --network $env:DOCKER_NETWORK `
            --env-file (Join-Path $env:CONFIG_ROOT 'home-secondary.env') `
            --publish 127.0.0.1:18000:8000 `
            --read-only `
            --tmpfs /tmp:rw,noexec,nosuid,size=64m `
            "${env:IMAGE_NAME}:${env:GITHUB_SHA}" | Out-Null

          $existingWorker = docker ps -a --filter "name=^/${env:WORKER_CONTAINER}$" --format '{{.Names}}'
          if ($existingWorker -eq $env:WORKER_CONTAINER) {
            docker rm --force $env:WORKER_CONTAINER | Out-Null
          }
          docker run --detach --restart unless-stopped `
            --name $env:WORKER_CONTAINER `
            --network $env:DOCKER_NETWORK `
            --env-file (Join-Path $env:CONFIG_ROOT 'home-ingestion-worker.env') `
            --no-healthcheck `
            --read-only `
            --tmpfs /tmp:rw,noexec,nosuid,size=128m `
            "${env:IMAGE_NAME}:${env:GITHUB_SHA}" `
            celery -A bankrotai.tasks:celery_app worker --beat --schedule /tmp/celerybeat-schedule --loglevel=INFO --concurrency=2 | Out-Null

      - name: Verify local API stability
        shell: powershell
        run: |
          foreach ($warmup in 1..30) {
            try {
              $ready = Invoke-WebRequest http://127.0.0.1:18000/health/ready -TimeoutSec 10 -UseBasicParsing
              if ($ready.StatusCode -eq 200) { break }
            } catch {}
            Start-Sleep -Seconds 2
          }
          if (-not $ready -or $ready.StatusCode -ne 200) {
            docker logs --tail 100 $env:CONTAINER_NAME
            throw "Local secondary did not become ready"
          }
          $statuses = @()
          foreach ($attempt in 1..30) {
            try {
              $live = Invoke-WebRequest http://127.0.0.1:18000/health/live -TimeoutSec 5 -UseBasicParsing
              $ready = Invoke-WebRequest http://127.0.0.1:18000/health/ready -TimeoutSec 10 -UseBasicParsing
              $statuses += "live=$($live.StatusCode),ready=$($ready.StatusCode)"
            } catch {
              docker logs --tail 100 $env:CONTAINER_NAME
              throw
            }
            Start-Sleep -Seconds 1
          }
          if ($statuses.Count -ne 30 -or $statuses.Where({ $_ -ne 'live=200,ready=200' }).Count -ne 0) {
            throw "Local secondary stability gate failed"
          }
          docker exec $env:WORKER_CONTAINER `
            celery -A bankrotai.tasks:celery_app inspect ping --timeout 10 *> $null
          if ($LASTEXITCODE -ne 0) {
            docker logs --tail 100 $env:WORKER_CONTAINER
            throw "Trusted ingestion worker did not answer Celery ping"
          }
          docker exec $env:WORKER_CONTAINER python -c `
            "import urllib.request; response = urllib.request.urlopen('http://bankrotai-photon:2322/api?q=Yaroslavl&limit=1', timeout=15); assert response.status == 200"
          if ($LASTEXITCODE -ne 0) {
            throw "Trusted ingestion worker cannot reach local Photon"
          }
          "Local secondary stability gate: 30/30 PASS"
          "Trusted ingestion worker gate: PASS"
          "Local Photon connectivity gate: PASS"
