name: Deploy home secondary origin

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  actions: read
  contents: read

concurrency:
  group: home-secondary-production
  # A newer main release supersedes a long first-publication attempt. Dataset
  # promotion is fail-closed, so cancelling an obsolete uploader cannot expose
  # a partial S3 dataset.
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, Windows, X64, bankrotai-home]
    timeout-minutes: 120
    env:
      IMAGE_NAME: bankrotai-home-api
      CONTAINER_NAME: bankrotai-home-secondary
      WORKER_CONTAINER: bankrotai-home-ingestion-worker
      GEO_WORKER_CONTAINER: bankrotai-home-geocoding-worker
      MAP_WORKER_CONTAINER: bankrotai-home-map-worker
      REDIS_CONTAINER: bankrotai-home-redis
      POSTGRES_CONTAINER: bankrotai-home-postgres
      DOCKER_NETWORK: bankrotai-home
      CONFIG_ROOT: C:\ProgramData\BankrotAI
      API_KEY: ${{ secrets.KOYEB_SERVICE_KEY }}
      SESSION_SECRET: ${{ secrets.AUTH_SESSION_SECRET }}
      MAP_S3_ENABLED: ${{ vars.MAP_OBJECT_STORE_ENABLED || 'false' }}
      MAP_S3_ENDPOINT: ${{ vars.REGRU_S3_ENDPOINT || 'https://s3.regru.cloud' }}
      MAP_S3_BUCKET: ${{ vars.REGRU_S3_BUCKET || 'sterdez-map' }}
      MAP_S3_PUBLIC_BASE_URL: ${{ vars.REGRU_S3_PUBLIC_BASE_URL }}
      MAP_S3_REGION: ${{ vars.REGRU_S3_REGION || 'ru-1' }}
      MAP_S3_LAYOUT: ${{ vars.MAP_OBJECT_STORE_LAYOUT || 'regional-bundles-v1' }}
      MAP_S3_ACCESS_KEY: ${{ secrets.REGRU_S3_ACCESS_KEY }}
      MAP_S3_SECRET_KEY: ${{ secrets.REGRU_S3_SECRET_KEY }}
    steps:
      - name: Emergency runner recovery before checkout
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $workRoot = Split-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) -Parent
          $repoGit = Join-Path $env:GITHUB_WORKSPACE '.git'
          foreach ($lockName in @('AUTO_MERGE.lock', 'packed-refs.lock')) {
            $staleLock = Join-Path $repoGit $lockName
            if (Test-Path -LiteralPath $staleLock) {
              Remove-Item -LiteralPath $staleLock -Force -ErrorAction SilentlyContinue
              Write-Output "Removed stale Git lock: $lockName"
            }
          }

          $runnerTemp = Join-Path $workRoot '_temp'
          if (Test-Path -LiteralPath $runnerTemp) {
            $cutoff = (Get-Date).AddHours(-6)
            Get-ChildItem -LiteralPath $runnerTemp -Force -ErrorAction SilentlyContinue |
              Where-Object LastWriteTime -lt $cutoff |
              ForEach-Object {
                try { Remove-Item -LiteralPath $_.FullName -Recurse -Force -ErrorAction Stop } catch {}
              }
          }

          $drBackupRoot = Join-Path $env:CONFIG_ROOT 'dr-backups'
          if (Test-Path -LiteralPath $drBackupRoot) {
            $drive = Get-PSDrive -Name C
            $freeGb = [math]::Round($drive.Free / 1GB, 2)
            if ($freeGb -lt 15) {
              Write-Warning "Emergency disk pressure detected before checkout: $freeGb GB free"
              $dumpFiles = @(Get-ChildItem -LiteralPath $drBackupRoot -File -Filter 'bankrotai-*.dump' |
                Sort-Object LastWriteTimeUtc -Descending)
              $protected = New-Object 'System.Collections.Generic.HashSet[string]'
              $verified = @(Get-ChildItem -LiteralPath $drBackupRoot -File -Filter 'bankrotai-*.json' |
                Sort-Object LastWriteTimeUtc -Descending |
                ForEach-Object {
                  try {
                    $meta = Get-Content -LiteralPath $_.FullName -Raw | ConvertFrom-Json
                    if ($meta.restore_verification -eq 'passed' -and $meta.backup_file -and
                        (Test-Path -LiteralPath ([string]$meta.backup_file))) {
                      [pscustomobject]@{ metadata_file = $_.FullName; backup_file = [string]$meta.backup_file }
                    }
                  } catch {}
                } | Select-Object -First 1)
              if ($verified.Count -gt 0) {
                [void]$protected.Add($verified[0].backup_file)
              } elseif ($dumpFiles.Count -gt 0) {
                [void]$protected.Add($dumpFiles[0].FullName)
              }
              foreach ($dump in $dumpFiles) {
                if ($protected.Contains($dump.FullName)) { continue }
                $stem = [System.IO.Path]::GetFileNameWithoutExtension($dump.Name)
                Remove-Item -LiteralPath $dump.FullName -Force -ErrorAction SilentlyContinue
                $metaPath = Join-Path $drBackupRoot "$stem.json"
                if (Test-Path -LiteralPath $metaPath) {
                  Remove-Item -LiteralPath $metaPath -Force -ErrorAction SilentlyContinue
                }
              }
              Get-ChildItem -LiteralPath $drBackupRoot -File -Filter 'bankrotai-*.json' -ErrorAction SilentlyContinue |
                Where-Object {
                  $keep = $false
                  if ($verified.Count -gt 0) { $keep = $_.FullName -eq $verified[0].metadata_file }
                  -not $keep
                } |
                Remove-Item -Force -ErrorAction SilentlyContinue
            }
          }

          $migrationBackupRoot = Join-Path $env:CONFIG_ROOT 'db-backups'
          if (Test-Path -LiteralPath $migrationBackupRoot) {
            Get-ChildItem -LiteralPath $migrationBackupRoot -File -Filter 'pre-migration-*.dump' |
              Sort-Object LastWriteTimeUtc -Descending |
              Select-Object -Skip 1 |
              Remove-Item -Force -ErrorAction SilentlyContinue
          }

          $drive = Get-PSDrive -Name C
          Write-Output ("C: free after emergency file cleanup: {0:N2} GB ({1:N1}%)" -f
            ($drive.Free / 1GB), (($drive.Free / ($drive.Used + $drive.Free)) * 100))

          function Invoke-DockerEmergency {
            param([string[]]$Arguments, [int]$TimeoutSeconds = 20)
            $argLine = ($Arguments | ForEach-Object {
              if ($_ -match '\s') { '"' + ($_ -replace '"','\"') + '"' } else { $_ }
            }) -join ' '
            $process = Start-Process -FilePath 'docker.exe' -ArgumentList $argLine -PassThru -WindowStyle Hidden
            if (-not $process.WaitForExit($TimeoutSeconds * 1000)) {
              Write-Warning "Docker command timed out: docker $argLine"
              & taskkill.exe /PID $process.Id /T /F *> $null
              return $false
            }
            return $process.ExitCode -eq 0
          }

          $dockerResponsive = Invoke-DockerEmergency -Arguments @('version','--format','{{.Server.Version}}') -TimeoutSeconds 20
          if (-not $dockerResponsive) {
            $dockerService = Get-Service -Name 'com.docker.service' -ErrorAction SilentlyContinue
            if ($null -ne $dockerService) {
              Write-Warning "Docker daemon is unresponsive; restarting com.docker.service"
              try {
                Restart-Service -Name 'com.docker.service' -Force -ErrorAction Stop
              } catch {
                Write-Warning "Docker service restart failed: $($_.Exception.Message)"
              }
              Start-Sleep -Seconds 10
              $dockerResponsive = Invoke-DockerEmergency -Arguments @('version','--format','{{.Server.Version}}') -TimeoutSeconds 30
            }
          }

          if ($dockerResponsive) {
            foreach ($name in @(
              $env:POSTGRES_CONTAINER,
              $env:REDIS_CONTAINER,
              $env:CONTAINER_NAME,
              $env:WORKER_CONTAINER,
              $env:GEO_WORKER_CONTAINER,
              $env:MAP_WORKER_CONTAINER
            )) {
              [void](Invoke-DockerEmergency -Arguments @('start',$name) -TimeoutSeconds 30)
            }
            try {
              $ready = (Invoke-WebRequest -UseBasicParsing -TimeoutSec 10 -Uri 'http://127.0.0.1:18000/health/live').StatusCode
            } catch { $ready = 0 }
            if ($ready -ne 200) {
              [void](Invoke-DockerEmergency -Arguments @('restart',$env:CONTAINER_NAME) -TimeoutSeconds 45)
            }
          } else {
            Write-Warning "Docker daemon remains unavailable after service restart; performing one safe Docker Desktop / WSL recovery"
            foreach ($name in @('Docker Desktop','com.docker.backend','Docker Desktop Backend')) {
              Get-Process -Name $name -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            }
            try {
              & wsl.exe --shutdown
              Start-Sleep -Seconds 8
            } catch {
              Write-Warning "WSL shutdown failed: $($_.Exception.Message)"
            }
            $dockerService = Get-Service -Name 'com.docker.service' -ErrorAction SilentlyContinue
            if ($null -ne $dockerService) {
              try {
                Stop-Service -Name 'com.docker.service' -Force -ErrorAction SilentlyContinue
                Start-Sleep -Seconds 3
                Start-Service -Name 'com.docker.service' -ErrorAction Stop
              } catch {
                Write-Warning "Docker service cold restart failed: $($_.Exception.Message)"
              }
            }
            $desktopExe = Join-Path $env:ProgramFiles 'Docker\Docker\Docker Desktop.exe'
            if (Test-Path -LiteralPath $desktopExe) {
              try { Start-Process -FilePath $desktopExe -WindowStyle Hidden | Out-Null } catch {
                Write-Warning "Docker Desktop launch failed: $($_.Exception.Message)"
              }
            }
            $deadline = (Get-Date).AddSeconds(120)
            do {
              Start-Sleep -Seconds 5
              $dockerResponsive = Invoke-DockerEmergency -Arguments @('version','--format','{{.Server.Version}}') -TimeoutSeconds 15
              if ($dockerResponsive) { break }
            } while ((Get-Date) -lt $deadline)
            if (-not $dockerResponsive) {
              throw "Docker Desktop/WSL backend did not recover after cold restart"
            }
            Write-Output "Docker Desktop/WSL backend recovered successfully"
          }

      - uses: actions/checkout@v7

      - name: Require production secrets
        shell: powershell
        run: |
          if (-not $env:API_KEY -or -not $env:SESSION_SECRET) {
            throw "Required production secrets are unavailable"
          }
          $mapS3Enabled = @('true', '1', 'yes') -contains $env:MAP_S3_ENABLED.ToLowerInvariant()
          if ($mapS3Enabled) {
            if (-not $env:MAP_S3_PUBLIC_BASE_URL -or -not $env:MAP_S3_ACCESS_KEY -or -not $env:MAP_S3_SECRET_KEY) {
              throw "REG.RU S3 is enabled but public base URL or write credentials are unavailable"
            }
            Write-Output "::add-mask::$env:MAP_S3_ACCESS_KEY"
            Write-Output "::add-mask::$env:MAP_S3_SECRET_KEY"
          }

      - name: Reclaim bounded Docker disk space before build
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          function Invoke-DockerCleanup {
            param([string[]]$Arguments, [int]$TimeoutSeconds = 300)
            $argLine = ($Arguments | ForEach-Object {
              if ($_ -match '\s') { '"' + ($_ -replace '"','\"') + '"' } else { $_ }
            }) -join ' '
            $process = Start-Process -FilePath 'docker.exe' -ArgumentList $argLine -PassThru -WindowStyle Hidden
            if (-not $process.WaitForExit($TimeoutSeconds * 1000)) {
              Write-Warning "Docker cleanup timed out after $TimeoutSeconds seconds: docker $argLine"
              & taskkill.exe /PID $process.Id /T /F *> $null
              return $false
            }
            if ($process.ExitCode -ne 0) {
              Write-Warning "Docker cleanup exited $($process.ExitCode): docker $argLine"
              return $false
            }
            return $true
          }

          $before = Get-PSDrive -Name C
          $beforeFreeGb = [math]::Round($before.Free / 1GB, 2)
          Write-Output "C: free before Docker cleanup: $beforeFreeGb GB"

          if ($beforeFreeGb -lt 20) {
            [void](Invoke-DockerCleanup -Arguments @('container','prune','--force') -TimeoutSeconds 120)
            [void](Invoke-DockerCleanup -Arguments @('image','prune','--all','--force','--filter','until=24h') -TimeoutSeconds 300)
            [void](Invoke-DockerCleanup -Arguments @('builder','prune','--all','--force','--filter','until=24h') -TimeoutSeconds 300)
          }

          $after = Get-PSDrive -Name C
          $afterFreeGb = [math]::Round($after.Free / 1GB, 2)
          $afterFreePercent = [math]::Round(($after.Free / ($after.Used + $after.Free)) * 100, 1)
          Write-Output "C: free after bounded Docker cleanup: $afterFreeGb GB ($afterFreePercent%)"
          if ($after.Free -lt 4GB) {
            throw "C: still has less than 4 GB free; refusing Chromium/API image build without safe headroom"
          }

      - name: Build current-main API image
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          function Invoke-BoundedDockerBuild {
            param(
              [string[]]$Arguments,
              [int]$TimeoutSeconds,
              [string]$Label
            )
            Write-Host "Starting $Label with a $TimeoutSeconds second timeout"
            $process = Start-Process -FilePath 'docker.exe' -ArgumentList $Arguments -PassThru -NoNewWindow
            if (-not $process.WaitForExit($TimeoutSeconds * 1000)) {
              Write-Warning "$Label timed out after $TimeoutSeconds seconds; terminating the process tree"
              & taskkill.exe /PID $process.Id /T /F *> $null
              try { $process.WaitForExit(10000) | Out-Null } catch {}
              return -1
            }
            try {
              $process.WaitForExit()
              $process.Refresh()
              if ($null -ne $process.ExitCode) {
                return [int]$process.ExitCode
              }
            } catch {}
            return $null
          }

          $built = $false
          $attempts = @(
            [pscustomobject]@{ Pull = $true;  Timeout = 180; Mode = 'refresh-base' },
            [pscustomobject]@{ Pull = $false; Timeout = 240; Mode = 'cached-base' }
          )
          $attemptNumber = 0
          foreach ($attempt in $attempts) {
            $attemptNumber += 1
            $arguments = @('build')
            if ($attempt.Pull) { $arguments += '--pull' }
            $arguments += @(
              '--tag',
              "${env:IMAGE_NAME}:${env:GITHUB_SHA}",
              '.'
            )
            $exitCode = Invoke-BoundedDockerBuild -Arguments $arguments -TimeoutSeconds $attempt.Timeout -Label "Docker build attempt $attemptNumber/$($attempts.Count) mode=$($attempt.Mode)"
            docker image inspect "${env:IMAGE_NAME}:${env:GITHUB_SHA}" *> $null
            $imageReady = $LASTEXITCODE -eq 0
            if ($exitCode -eq 0 -or $imageReady) {
              $built = $true
              if ($imageReady -and $exitCode -ne 0) {
                Write-Warning "Docker process exit code was unavailable, but exact image ${env:IMAGE_NAME}:${env:GITHUB_SHA} exists; accepting the completed build"
              }
              break
            }
            Write-Warning "Docker build mode=$($attempt.Mode) failed with exit code $exitCode and produced no exact image"
          }

          if (-not $built) {
            Write-Warning 'Full Home image build did not complete; evaluating offline source-overlay fallback'

            $baseImageRef = (docker inspect $env:CONTAINER_NAME --format '{{.Config.Image}}' 2>$null | Select-Object -Last 1)
            $baseImageId = (docker inspect $env:CONTAINER_NAME --format '{{.Image}}' 2>$null | Select-Object -Last 1)
            if ($LASTEXITCODE -ne 0 -or -not $baseImageRef -or -not $baseImageId) {
              throw 'Offline source-overlay fallback refused: current production API image could not be identified'
            }
            $baseImageRef = ([string]$baseImageRef).Trim()
            $baseImageId = ([string]$baseImageId).Trim()
            if ($baseImageRef -notmatch ':([0-9a-f]{40})$') {
              throw "Offline source-overlay fallback refused: production image tag does not expose a deploy SHA: $baseImageRef"
            }
            $baseSha = $Matches[1]
            Write-Output "Offline source-overlay candidate base SHA: $baseSha"

            git cat-file -e "$baseSha^{commit}" 2>$null
            if ($LASTEXITCODE -ne 0) {
              git fetch --no-tags --depth=1 origin $baseSha
              if ($LASTEXITCODE -ne 0) {
                throw "Offline source-overlay fallback refused: could not fetch deployed base commit $baseSha"
              }
            }

            git diff --quiet $baseSha $env:GITHUB_SHA -- requirements.lock pyproject.toml certs
            $foundationDiff = $LASTEXITCODE
            if ($foundationDiff -eq 1) {
              throw 'Offline source-overlay fallback refused: Python dependencies or trusted CA inputs changed since the deployed image'
            }
            if ($foundationDiff -ne 0) {
              throw "Offline source-overlay fallback refused: could not compare dependency inputs (git diff exit $foundationDiff)"
            }

            $pythonLine = (Select-String -LiteralPath 'Dockerfile' -Pattern '^FROM python:([0-9]+\.[0-9]+)-slim$' | Select-Object -First 1)
            if (-not $pythonLine -or $pythonLine.Matches.Count -eq 0) {
              throw 'Offline source-overlay fallback refused: current Dockerfile Python runtime could not be determined'
            }
            $expectedPython = $pythonLine.Matches[0].Groups[1].Value
            $actualPython = (docker run --rm $baseImageId python -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')" | Select-Object -Last 1)
            if ($LASTEXITCODE -ne 0 -or -not $actualPython) {
              throw 'Offline source-overlay fallback refused: deployed Python runtime could not be inspected'
            }
            $actualPython = ([string]$actualPython).Trim()
            if ($actualPython -ne $expectedPython) {
              throw "Offline source-overlay fallback refused: deployed Python $actualPython != required $expectedPython"
            }

            $overlayBaseTag = "${env:IMAGE_NAME}:overlay-base-${env:GITHUB_RUN_ID}"
            docker tag $baseImageId $overlayBaseTag
            if ($LASTEXITCODE -ne 0) {
              throw 'Offline source-overlay fallback refused: could not tag the deployed runtime image'
            }
            try {
              $overlayArguments = @(
                'build',
                '--file', 'Dockerfile.home-overlay',
                '--build-arg', "BASE_IMAGE=$overlayBaseTag",
                '--tag', "${env:IMAGE_NAME}:${env:GITHUB_SHA}",
                '.'
              )
              $overlayExit = Invoke-BoundedDockerBuild -Arguments $overlayArguments -TimeoutSeconds 240 -Label 'offline source-overlay Docker build'
              docker image inspect "${env:IMAGE_NAME}:${env:GITHUB_SHA}" *> $null
              $overlayImageReady = $LASTEXITCODE -eq 0
              if ($overlayExit -ne 0 -and -not $overlayImageReady) {
                throw "Offline source-overlay Docker build failed with exit code $overlayExit and produced no exact image"
              }
              $built = $true
              if ($overlayImageReady -and $overlayExit -ne 0) {
                Write-Warning 'Offline source-overlay process exit code was unavailable; exact image verification passed'
              }
              Write-Output 'Offline source-overlay Docker build: PASS'
            } finally {
              docker image rm $overlayBaseTag *> $null
            }
          }

          if (!$built) { throw 'Could not build the current-main API image' }

      - name: Preserve and start local PostgreSQL
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path $env:CONFIG_ROOT -Force | Out-Null
          $passwordPath = Join-Path $env:CONFIG_ROOT 'postgres-password.txt'
          if (-not (Test-Path -LiteralPath $passwordPath)) {
            $bytes = New-Object byte[] 32
            [Security.Cryptography.RandomNumberGenerator]::Create().GetBytes($bytes)
            $password = ([BitConverter]::ToString($bytes)).Replace('-', '').ToLowerInvariant()
            [IO.File]::WriteAllText($passwordPath, $password)
          }
          $password = [IO.File]::ReadAllText($passwordPath).Trim()
          Write-Output "::add-mask::$password"
          $redisPasswordPath = Join-Path $env:CONFIG_ROOT 'redis-password.txt'
          if (-not (Test-Path -LiteralPath $redisPasswordPath)) {
            $bytes = New-Object byte[] 32
            [Security.Cryptography.RandomNumberGenerator]::Create().GetBytes($bytes)
            $redisPassword = ([BitConverter]::ToString($bytes)).Replace('-', '').ToLowerInvariant()
            [IO.File]::WriteAllText($redisPasswordPath, $redisPassword)
          }
          $redisPassword = [IO.File]::ReadAllText($redisPasswordPath).Trim()
          Write-Output "::add-mask::$redisPassword"
          & icacls.exe $passwordPath /inheritance:r /grant:r `
            'SYSTEM:F' '*S-1-5-32-544:F' '*S-1-5-20:R' | Out-Null
          & icacls.exe $redisPasswordPath /inheritance:r /grant:r `
            'SYSTEM:F' '*S-1-5-32-544:F' '*S-1-5-20:R' | Out-Null

          $network = docker network ls --filter "name=^${env:DOCKER_NETWORK}$" --format '{{.Name}}'
          if ($network -ne $env:DOCKER_NETWORK) { docker network create $env:DOCKER_NETWORK | Out-Null }
          $postgres = docker ps -a --filter "name=^/${env:POSTGRES_CONTAINER}$" --format '{{.Names}}'
          if ($postgres -ne $env:POSTGRES_CONTAINER) {
            docker run --detach --restart unless-stopped `
              --log-opt max-size=20m --log-opt max-file=5 `
              --name $env:POSTGRES_CONTAINER --network $env:DOCKER_NETWORK `
              --env POSTGRES_USER=bankrotai --env POSTGRES_DB=bankrotai `
              --env "POSTGRES_PASSWORD=$password" `
              --volume bankrotai-home-postgres:/var/lib/postgresql/data `
              postgres:17 | Out-Null
          } else {
            docker start $env:POSTGRES_CONTAINER | Out-Null
          }
          foreach ($attempt in 1..30) {
            docker exec $env:POSTGRES_CONTAINER pg_isready -U bankrotai -d bankrotai *> $null
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 2
          }
          if ($LASTEXITCODE -ne 0) { throw "Local PostgreSQL did not become ready" }


      - name: Install protected runtime configuration
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path $env:CONFIG_ROOT -Force | Out-Null
          $password = [IO.File]::ReadAllText((Join-Path $env:CONFIG_ROOT 'postgres-password.txt')).Trim()
          $redisPassword = [IO.File]::ReadAllText((Join-Path $env:CONFIG_ROOT 'redis-password.txt')).Trim()
          Write-Output "::add-mask::$password"
          Write-Output "::add-mask::$redisPassword"
          $redisConfigPath = Join-Path $env:CONFIG_ROOT 'redis.conf'
          [System.IO.File]::WriteAllLines($redisConfigPath, @(
            'bind 0.0.0.0'
            'protected-mode yes'
            'appendonly yes'
            "requirepass $redisPassword"
          ))
          $configPath = Join-Path $env:CONFIG_ROOT 'home-secondary.env'
          [System.IO.File]::WriteAllLines($configPath, @(
            'APP_ENV=production'
            'API_READ_ONLY=true'
            'DATABASE_TRUSTED_LOCAL=true'
            'TORGI_GOV_BASE_URL=https://api.sterdez.online/__public-source/torgi'
            'ONLINE_SOURCE_CACHE_FIRST=true'
            'PHOTON_BASE_URL=http://bankrotai-photon:2322'
            'TBANKROT_COOKIE_FILE=/run/tbankrot-auth/cookies.json'
            'API_RATE_LIMIT_PER_MINUTE=60'
            'DATABASE_POOL_SIZE=3'
            'DATABASE_MAX_OVERFLOW=2'
            'DATABASE_POOL_TIMEOUT=10'
            "DATABASE_URL=postgresql+psycopg://bankrotai:${password}@${env:POSTGRES_CONTAINER}:5432/bankrotai"
            "REDIS_URL=redis://:${redisPassword}@${env:REDIS_CONTAINER}:6379/0"
            "BANKROTAI_API_KEY=$env:API_KEY"
            "AUTH_SESSION_SECRET=$env:SESSION_SECRET"
            "MAP_OBJECT_STORE_ENABLED=$env:MAP_S3_ENABLED"
            "MAP_OBJECT_STORE_PUBLIC_BASE_URL=$env:MAP_S3_PUBLIC_BASE_URL"
            "MAP_OBJECT_STORE_LAYOUT=$env:MAP_S3_LAYOUT"
            'CORS_ORIGINS=https://sterdez.online,https://bankrotai.pages.dev'
          ))
          $workerConfigPath = Join-Path $env:CONFIG_ROOT 'home-ingestion-worker.env'
          [System.IO.File]::WriteAllLines($workerConfigPath, @(
            'APP_ENV=production'
            'API_READ_ONLY=false'
            'DATABASE_TRUSTED_LOCAL=true'
            'TORGI_GOV_BASE_URL=https://api.sterdez.online/__public-source/torgi'
            'PHOTON_BASE_URL=http://bankrotai-photon:2322'
            'TBANKROT_COOKIE_FILE=/run/tbankrot-auth/cookies.json'
            "DATABASE_URL=postgresql+psycopg://bankrotai:${password}@${env:POSTGRES_CONTAINER}:5432/bankrotai"
            "REDIS_URL=redis://:${redisPassword}@${env:REDIS_CONTAINER}:6379/0"
            "BANKROTAI_API_KEY=$env:API_KEY"
            'CELERY_NATIONWIDE_SOFT_TIME_LIMIT=14400'
            'CELERY_NATIONWIDE_HARD_TIME_LIMIT=18000'
            'GEO_BATCH_LIMIT=500'
            'GEO_MAX_WORKERS=6'
            'GEO_NSPD_CONCURRENCY=2'
            'GEO_BULK_IK12_FALLBACK=false'
            'GEO_BULK_NOMINATIM_FALLBACK=false'
            "MAP_OBJECT_STORE_ENABLED=$env:MAP_S3_ENABLED"
            "MAP_OBJECT_STORE_ENDPOINT=$env:MAP_S3_ENDPOINT"
            "MAP_OBJECT_STORE_BUCKET=$env:MAP_S3_BUCKET"
            "MAP_OBJECT_STORE_PUBLIC_BASE_URL=$env:MAP_S3_PUBLIC_BASE_URL"
            "MAP_OBJECT_STORE_ACCESS_KEY=$env:MAP_S3_ACCESS_KEY"
            "MAP_OBJECT_STORE_SECRET_KEY=$env:MAP_S3_SECRET_KEY"
            "MAP_OBJECT_STORE_REGION=$env:MAP_S3_REGION"
            "MAP_OBJECT_STORE_LAYOUT=$env:MAP_S3_LAYOUT"
            'MAP_OBJECT_STORE_WORKERS=4'
            'MAP_OBJECT_STORE_TIMEOUT_SECONDS=60'
          ))
          foreach ($protectedPath in @($redisConfigPath, $configPath, $workerConfigPath)) {
            & icacls.exe $protectedPath /inheritance:r /grant:r `
              'SYSTEM:F' '*S-1-5-32-544:F' '*S-1-5-20:M' | Out-Null
          }
          $tbankrotAuthRoot = Join-Path $env:CONFIG_ROOT 'tbankrot-auth'
          New-Item -ItemType Directory -Path $tbankrotAuthRoot -Force | Out-Null
          $legacyTbankrotCookiePath = Join-Path $env:CONFIG_ROOT 'tbankrot-cookies.json'
          $tbankrotCookiePath = Join-Path $tbankrotAuthRoot 'cookies.json'
          if ((Test-Path -LiteralPath $legacyTbankrotCookiePath) -and -not (Test-Path -LiteralPath $tbankrotCookiePath)) {
            try {
              Copy-Item -LiteralPath $legacyTbankrotCookiePath -Destination $tbankrotCookiePath -Force -ErrorAction Stop
              Write-Output "Migrated legacy TBankrot session into Auth Center storage"
            } catch {
              Write-Warning "Legacy TBankrot session could not be migrated; Auth Center will request a fresh login"
            }
          }
          & icacls.exe $tbankrotAuthRoot /inheritance:r /grant:r `
            'SYSTEM:(OI)(CI)F' '*S-1-5-32-544:(OI)(CI)F' '*S-1-5-20:(OI)(CI)M' | Out-Null
          if (Test-Path -LiteralPath $tbankrotCookiePath) {
            & icacls.exe $tbankrotCookiePath /inheritance:r /grant:r `
              'SYSTEM:F' '*S-1-5-32-544:F' '*S-1-5-20:M' | Out-Null
          } else {
            Write-Output 'TBankrot session is not configured yet; Auth Center will request interactive login'
          }

      - name: Backup and migrate database schema before replacing production containers
        shell: powershell
        run: |
          $photon = docker ps --filter 'name=^/bankrotai-photon$' --format '{{.Names}}'
          if ($photon -ne 'bankrotai-photon') {
            throw 'Local Photon container is not running'
          }
          $photonNetworks = docker inspect bankrotai-photon --format '{{json .NetworkSettings.Networks}}'
          if ($photonNetworks -notmatch '"bankrotai-home"') {
            docker network connect $env:DOCKER_NETWORK bankrotai-photon
            if ($LASTEXITCODE -ne 0) { throw 'Could not attach Photon to the production network' }
          }

          $schemaAtHead = $false
          docker run --rm `
            --network $env:DOCKER_NETWORK `
            --env-file (Join-Path $env:CONFIG_ROOT 'home-ingestion-worker.env') `
            "${env:IMAGE_NAME}:${env:GITHUB_SHA}" `
            python -m alembic current --check-heads
          if ($LASTEXITCODE -eq 0) {
            $schemaAtHead = $true
            Write-Output "Database schema is already at application head; skipping pre-migration backup and migration"
          } else {
            Write-Output "Database schema is not proven current; preserving pre-migration backup and migration path"
          }

          if (-not $schemaAtHead) {
          $backupRoot = 'D:\BankrotAI\db-backups'
          if (-not (Get-PSDrive -Name D -ErrorAction SilentlyContinue)) {
            throw 'Pre-migration backup refused: D: drive is not available'
          }
          New-Item -ItemType Directory -Path $backupRoot -Force | Out-Null
          $containerBackup = "/tmp/pre-migration-${env:GITHUB_SHA}.dump"
          docker exec $env:POSTGRES_CONTAINER pg_dump `
            --username bankrotai --dbname bankrotai --format=custom `
            --file $containerBackup
          if ($LASTEXITCODE -ne 0) {
            throw "Could not create pre-migration PostgreSQL backup; existing production containers were left running"
          }

          $hostBackup = Join-Path $backupRoot "pre-migration-${env:GITHUB_SHA}.dump"
          docker cp "${env:POSTGRES_CONTAINER}:${containerBackup}" $hostBackup
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $hostBackup)) {
            throw "Could not preserve pre-migration PostgreSQL backup; existing production containers were left running"
          }
          docker exec $env:POSTGRES_CONTAINER rm -f $containerBackup | Out-Null

          Get-ChildItem -LiteralPath $backupRoot -Filter 'pre-migration-*.dump' -File |
            Sort-Object LastWriteTime -Descending |
            Select-Object -Skip 1 |
            Remove-Item -Force

          docker run --rm `
            --network $env:DOCKER_NETWORK `
            --env-file (Join-Path $env:CONFIG_ROOT 'home-ingestion-worker.env') `
            "${env:IMAGE_NAME}:${env:GITHUB_SHA}" `
            python -m alembic upgrade head
          if ($LASTEXITCODE -ne 0) {
            throw "Database migration failed; backup preserved at $hostBackup and existing production containers were left running"
          }

          docker run --rm `
            --network $env:DOCKER_NETWORK `
            --env-file (Join-Path $env:CONFIG_ROOT 'home-ingestion-worker.env') `
            "${env:IMAGE_NAME}:${env:GITHUB_SHA}" `
            python -m alembic current --check-heads
          if ($LASTEXITCODE -ne 0) {
            throw "Database schema did not reach the tested application head; backup preserved at $hostBackup and existing production containers were left running"
          }
          }

      - name: Start private queue and replace API and trusted ingestion worker
        shell: powershell
        run: |
          $redis = docker ps -a --filter "name=^/${env:REDIS_CONTAINER}$" --format '{{.Names}}'
          if ($redis -ne $env:REDIS_CONTAINER) {
            docker run --detach --restart unless-stopped `
              --log-opt max-size=20m --log-opt max-file=5 `
              --name $env:REDIS_CONTAINER `
              --network $env:DOCKER_NETWORK `
              --mount "type=bind,source=$env:CONFIG_ROOT\redis.conf,target=/usr/local/etc/redis/redis.conf,readonly" `
              --volume bankrotai-home-redis:/data `
              redis:7-alpine redis-server /usr/local/etc/redis/redis.conf | Out-Null
          } else {
            docker start $env:REDIS_CONTAINER | Out-Null
          }
          $redisPassword = [IO.File]::ReadAllText((Join-Path $env:CONFIG_ROOT 'redis-password.txt')).Trim()
          Write-Output "::add-mask::$redisPassword"
          foreach ($attempt in 1..30) {
            docker exec --env "REDISCLI_AUTH=$redisPassword" `
              $env:REDIS_CONTAINER redis-cli ping *> $null
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 2
          }
          if ($LASTEXITCODE -ne 0) { throw "Private Redis did not become ready" }

          $existing = docker ps -a --filter "name=^/${env:CONTAINER_NAME}$" --format '{{.Names}}'
          if ($existing -eq $env:CONTAINER_NAME) {
            docker rm --force $env:CONTAINER_NAME | Out-Null
          }
          docker run --detach --restart unless-stopped `
            --log-opt max-size=20m --log-opt max-file=5 `
            --name $env:CONTAINER_NAME `
            --network $env:DOCKER_NETWORK `
            --env-file (Join-Path $env:CONFIG_ROOT 'home-secondary.env') `
            --mount "type=bind,source=$env:CONFIG_ROOT\tbankrot-auth,target=/run/tbankrot-auth" `
            --shm-size 256m `
            --publish 127.0.0.1:18000:8000 `
            --read-only `
            --tmpfs /tmp:rw,noexec,nosuid,size=64m `
            "${env:IMAGE_NAME}:${env:GITHUB_SHA}" | Out-Null

          $workerSpecs = @(
            @{ Name = $env:WORKER_CONTAINER; Queue = 'ingestion,maintenance'; Node = 'ingestion@bankrotai-home'; Beat = $true },
            @{ Name = $env:GEO_WORKER_CONTAINER; Queue = 'geocoding'; Node = 'geocoding@bankrotai-home'; Beat = $false },
            @{ Name = $env:MAP_WORKER_CONTAINER; Queue = 'map'; Node = 'map@bankrotai-home'; Beat = $false }
          )
          foreach ($spec in $workerSpecs) {
            $existingWorker = docker ps -a --filter "name=^/$($spec.Name)$" --format '{{.Names}}'
            if ($existingWorker -eq $spec.Name) {
              docker rm --force $spec.Name | Out-Null
            }
            if ($spec.Name -eq $env:GEO_WORKER_CONTAINER) {
              # The Redis lock has a one-hour TTL. A forced deploy can kill the
              # only geocoding worker while it owns the lock, leaving a ghost
              # lock that blocks the replacement worker. At this point the old
              # GEO container is gone and GitHub serializes manual GEO runs with
              # this deploy, so there is no live owner to protect.
              $clearedGeoLock = docker exec --env "REDISCLI_AUTH=$redisPassword" `
                $env:REDIS_CONTAINER redis-cli DEL bankrotai:geocoding:batch
              if ($LASTEXITCODE -ne 0) { throw "Could not clear orphaned geocoding lock" }
              Write-Output "Cleared orphaned geocoding lock before replacement worker: $clearedGeoLock"
            }
            if ($spec.Name -eq $env:MAP_WORKER_CONTAINER) {
              # The map build lock outlives a force-removed worker for up to 30
              # minutes. The old map container has already been removed above,
              # so any remaining lock cannot have a live owner and would block
              # the mandatory current-dataset publication gate.
              $clearedMapLock = docker exec --env "REDISCLI_AUTH=$redisPassword" `
                $env:REDIS_CONTAINER redis-cli DEL bankrotai:map-dataset-build
              if ($LASTEXITCODE -ne 0) { throw "Could not clear orphaned map dataset build lock" }
              Write-Output "Cleared orphaned map dataset build lock before replacement worker: $clearedMapLock"
            }
            $workerArgs = @(
              'celery', '-A', 'bankrotai.tasks:celery_app', 'worker',
              "--hostname=$($spec.Node)", "--queues=$($spec.Queue)",
              '--loglevel=INFO', '--concurrency=1'
            )
            if ($spec.Beat) {
              $workerArgs += @('--beat', '--schedule', '/tmp/celerybeat-schedule')
            }
            docker run --detach --restart unless-stopped `
              --log-opt max-size=20m --log-opt max-file=5 `
              --name $spec.Name `
              --network $env:DOCKER_NETWORK `
              --env-file (Join-Path $env:CONFIG_ROOT 'home-ingestion-worker.env') `
              --mount "type=bind,source=$env:CONFIG_ROOT\tbankrot-auth,target=/run/tbankrot-auth,readonly" `
              --no-healthcheck `
              --read-only `
              --tmpfs /tmp:rw,noexec,nosuid,size=128m `
              "${env:IMAGE_NAME}:${env:GITHUB_SHA}" @workerArgs | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Could not start $($spec.Name)" }
          }

      - name: Ensure REG.RU S3 map dataset is published
        if: ${{ vars.MAP_OBJECT_STORE_ENABLED == 'true' }}
        shell: powershell
        run: |
          function Get-CurrentMapVersion {
            $output = docker exec $env:MAP_WORKER_CONTAINER python -c "from sqlalchemy import select; from bankrotai.db import SessionLocal,MapDataset; s=SessionLocal(); d=s.scalar(select(MapDataset).where(MapDataset.is_current.is_(True),MapDataset.status=='ready')); print(d.version if d else ''); s.close()"
            if ($LASTEXITCODE -ne 0) { throw "Could not inspect current map dataset" }
            return (($output | Select-Object -Last 1) -as [string]).Trim()
          }

          $desiredLayout = (docker exec $env:MAP_WORKER_CONTAINER python -c "from bankrotai.core import get_settings; print(get_settings().map_object_store_layout)" | Select-Object -Last 1).Trim()
          if ($LASTEXITCODE -ne 0) { throw "Could not inspect desired map object-store layout" }
          $desiredRevision = (docker exec $env:MAP_WORKER_CONTAINER python -c "from bankrotai.services.map_dataset_version import MAP_DATASET_REVISION; print(MAP_DATASET_REVISION)" | Select-Object -Last 1).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $desiredRevision) { throw "Could not inspect desired map pipeline revision" }

          function Test-CurrentDataset([string]$version, [string]$layout, [string]$revision) {
            if (-not $version) { return $false }
            if ($layout -eq 'regional-bundles-v1') {
              return $version -like "*-$revision-bundle-s3"
            }
            return ($version -like "*-$revision-s3") -and ($version -notlike '*-bundle-s3')
          }

          $current = Get-CurrentMapVersion
          if (-not (Test-CurrentDataset $current $desiredLayout $desiredRevision)) {
            Write-Output "Building REG.RU S3 map dataset for layout=$desiredLayout revision=$desiredRevision current=$current"
            docker exec $env:MAP_WORKER_CONTAINER python -c "import json; from bankrotai.tasks import build_map_dataset_task; print(json.dumps(build_map_dataset_task.run(), default=str))"
            if ($LASTEXITCODE -ne 0) {
              docker logs --tail 200 $env:MAP_WORKER_CONTAINER
              throw "REG.RU S3 map dataset build failed for requested layout"
            }
          }

          $published = $false
          foreach ($attempt in 1..180) {
            $current = Get-CurrentMapVersion
            if (Test-CurrentDataset $current $desiredLayout $desiredRevision) {
              $published = $true
              break
            }
            Start-Sleep -Seconds 5
          }
          if (-not $published) {
            docker logs --tail 200 $env:MAP_WORKER_CONTAINER
            throw "REG.RU S3 map dataset for layout=$desiredLayout revision=$desiredRevision was not promoted within 15 minutes"
          }

          docker exec $env:MAP_WORKER_CONTAINER python -c "import json,sys; from bankrotai.core import get_settings; from bankrotai.services.map_dataset_version import MAP_DATASET_REVISION; from bankrotai.services.map_object_store import _verify_public_manifest; m=_verify_public_manifest(get_settings(), sys.argv[1]); assert m.get('pipeline_revision') == MAP_DATASET_REVISION, (m.get('pipeline_revision'), MAP_DATASET_REVISION); print(json.dumps(m, default=str))" $current
          if ($LASTEXITCODE -ne 0) {
            throw "Current REG.RU S3 map manifest is not publicly readable or has the wrong pipeline revision"
          }
          Write-Output "REG.RU S3 current map dataset: $current revision=$desiredRevision"

      - name: Verify local API stability
        shell: powershell
        run: |
          foreach ($warmup in 1..30) {
            try {
              $ready = Invoke-WebRequest http://127.0.0.1:18000/health/ready -TimeoutSec 10 -UseBasicParsing
              if ($ready.StatusCode -eq 200) { break }
            } catch {}
            Start-Sleep -Seconds 2
          }
          if (-not $ready -or $ready.StatusCode -ne 200) {
            docker logs --tail 100 $env:CONTAINER_NAME
            throw "Local secondary did not become ready"
          }
          $statuses = @()
          foreach ($attempt in 1..30) {
            try {
              $live = Invoke-WebRequest http://127.0.0.1:18000/health/live -TimeoutSec 5 -UseBasicParsing
              $ready = Invoke-WebRequest http://127.0.0.1:18000/health/ready -TimeoutSec 10 -UseBasicParsing
              $statuses += "live=$($live.StatusCode),ready=$($ready.StatusCode)"
            } catch {
              docker logs --tail 100 $env:CONTAINER_NAME
              throw
            }
            Start-Sleep -Seconds 1
          }
          if ($statuses.Count -ne 30 -or $statuses.Where({ $_ -ne 'live=200,ready=200' }).Count -ne 0) {
            throw "Local secondary stability gate failed"
          }
          $workerGates = @(
            @{ Container = $env:WORKER_CONTAINER; Node = 'ingestion@bankrotai-home' },
            @{ Container = $env:GEO_WORKER_CONTAINER; Node = 'geocoding@bankrotai-home' },
            @{ Container = $env:MAP_WORKER_CONTAINER; Node = 'map@bankrotai-home' }
          )
          foreach ($gate in $workerGates) {
            docker exec $gate.Container celery -A bankrotai.tasks:celery_app inspect ping `
              --destination $gate.Node --timeout 10 *> $null
            if ($LASTEXITCODE -ne 0) {
              docker logs --tail 100 $gate.Container
              throw "$($gate.Node) did not answer Celery ping"
            }
          }
          foreach ($container in @($env:CONTAINER_NAME, $env:WORKER_CONTAINER, $env:GEO_WORKER_CONTAINER, $env:MAP_WORKER_CONTAINER)) {
            $logConfigJson = docker inspect --format '{{json .HostConfig.LogConfig}}' $container
            if ($LASTEXITCODE -ne 0 -or -not $logConfigJson) {
              throw "Could not inspect Docker log rotation for $container"
            }
            $logConfig = $logConfigJson | ConvertFrom-Json
            if (
              $logConfig.Config.'max-size' -ne '20m' -or
              $logConfig.Config.'max-file' -ne '5'
            ) {
              throw "Docker log rotation is not enforced for $container"
            }
          }
          $limitState = docker exec $env:WORKER_CONTAINER python -c "from bankrotai.tasks import nationwide_lot_sync_task, _DURABLE_NATIONWIDE_SOFT_TIME_LIMIT_SECONDS, _DURABLE_NATIONWIDE_HARD_TIME_LIMIT_SECONDS; print(f'{nationwide_lot_sync_task.soft_time_limit},{nationwide_lot_sync_task.time_limit},{_DURABLE_NATIONWIDE_SOFT_TIME_LIMIT_SECONDS},{_DURABLE_NATIONWIDE_HARD_TIME_LIMIT_SECONDS}')"
          if ($LASTEXITCODE -ne 0 -or -not $limitState) {
            throw "Could not inspect nationwide Celery task limits"
          }
          $limitParts = (($limitState | Select-Object -Last 1) -as [string]).Trim().Split(',')
          if ($limitParts.Count -ne 4 -or [int]$limitParts[0] -lt 14400 -or [int]$limitParts[1] -lt 18000 -or [int]$limitParts[2] -lt 14400 -or [int]$limitParts[3] -lt 18000) {
            throw "Nationwide Celery task limits are below durable production minimum: $limitState"
          }
          Write-Output "Nationwide Celery task limits: soft=$($limitParts[0]) hard=$($limitParts[1])"
          docker exec $env:WORKER_CONTAINER python -c `
            "import urllib.request; response = urllib.request.urlopen('http://bankrotai-photon:2322/api?q=Yaroslavl&limit=1', timeout=15); assert response.status == 200"
          if ($LASTEXITCODE -ne 0) {
            throw "Trusted ingestion worker cannot reach local Photon"
          }
          "Local secondary stability gate: 30/30 PASS"
          "Isolated ingestion/geocoding/map worker gates: PASS"
          "Local Photon connectivity gate: PASS"

      - name: Report aggregate geocoding quality
        continue-on-error: true
        shell: powershell
        run: |
          docker exec $env:GEO_WORKER_CONTAINER python -c "import json; from bankrotai.db import SessionLocal; from bankrotai.services.geo_backfill import geocoding_diagnostic_report; s=SessionLocal(); r=geocoding_diagnostic_report(s); s.close(); print(json.dumps({'progress': {k:r['progress'].get(k) for k in ('total','geocoded','actionable_remaining','eligible_now','waiting_for_retry','network_wait','deferred_no_match','deferred_validation','classified_percent','terminal_failures','percent','rate_per_second','eta_seconds','paused')}, 'network': r['progress'].get('network'), 'statistics': r['statistics'], 'failures': r['failures'], 'recent_batches': r['recent_batches'], 'quality': r['quality'], 'cfo': r['cfo']}, ensure_ascii=False, default=str))"
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Aggregate geocoding quality report could not be produced"
          }

      - name: Reclaim obsolete Docker layers after successful deployment
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $warningFreeGb = 20
          $criticalFreeGb = 10

          function Invoke-DockerCleanup {
            param([string[]]$Arguments, [int]$TimeoutSeconds = 300)
            $argLine = ($Arguments | ForEach-Object {
              if ($_ -match '\s') { '"' + ($_ -replace '"','\"') + '"' } else { $_ }
            }) -join ' '
            $process = Start-Process -FilePath 'docker.exe' -ArgumentList $argLine -PassThru -WindowStyle Hidden
            if (-not $process.WaitForExit($TimeoutSeconds * 1000)) {
              Write-Warning "Post-deploy Docker cleanup timed out: docker $argLine"
              & taskkill.exe /PID $process.Id /T /F *> $null
              return $false
            }
            if ($process.ExitCode -ne 0) {
              Write-Warning "Post-deploy Docker cleanup exited $($process.ExitCode): docker $argLine"
              return $false
            }
            return $true
          }

          $before = Get-PSDrive -Name C
          $beforeFreeGb = [math]::Round($before.Free / 1GB, 2)
          Write-Output "C: free before post-deploy maintenance: $beforeFreeGb GB"

          if ($beforeFreeGb -lt $warningFreeGb) {
            [void](Invoke-DockerCleanup -Arguments @('container','prune','--force') -TimeoutSeconds 120)
            [void](Invoke-DockerCleanup -Arguments @('image','prune','--force','--filter','until=168h') -TimeoutSeconds 180)
            [void](Invoke-DockerCleanup -Arguments @('builder','prune','--force','--filter','until=168h') -TimeoutSeconds 180)
          } else {
            Write-Output "Post-deploy cleanup skipped: $beforeFreeGb GB >= $warningFreeGb GB"
          }

          $after = Get-PSDrive -Name C
          $afterFreeGb = [math]::Round($after.Free / 1GB, 2)
          Write-Output "C: free after post-deploy maintenance: $afterFreeGb GB"
          if ($afterFreeGb -lt $criticalFreeGb) {
            throw "C: has only $afterFreeGb GB free after a healthy deployment; emergency floor is $criticalFreeGb GB"
          }
          if ($afterFreeGb -lt $warningFreeGb) {
            Write-Warning "C: free space is below the recommended $warningFreeGb GB headroom, but production deployment remains healthy"
          }
