name: Production reliability

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: production-reliability-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  python-lint:
    name: Python lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements-dev.lock && pip install --no-deps -e .
      - run: ruff check src tests
      - run: mypy src/bankrotai
      - run: bash -n scripts/*.sh

  python-security:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.11", cache: pip }
      - name: Audit locked Python runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check pip-audit==2.10.1
          pip-audit -r requirements.lock

  sqlite-tests:
    name: Python tests (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.11", cache: pip }
      - run: |
          sudo apt-get update
          sudo apt-get install -y libegl1
      - run: pip install -r requirements-dev.lock && pip install --no-deps -e .
      - run: pytest -m "not postgres"

  migration-tests:
    name: Database migration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements-dev.lock && pip install --no-deps -e .
      - run: pytest tests/test_database_reliability.py

  postgres-tests:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bankrotai_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d bankrotai_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/bankrotai_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.11", cache: pip }
      - run: |
          sudo apt-get update
          sudo apt-get install -y libegl1
      - run: pip install -r requirements-dev.lock && pip install --no-deps -e .
      - run: pytest -m postgres

  web:
    name: WEB typecheck lint tests and build
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: WEB } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: WEB/package-lock.json }
      - run: npm ci
      - name: Validate TBankrot auth broker JavaScript
        run: node --check ../tbankrot-auth/server.mjs
      - name: Audit npm dependencies with bounded registry retries
        run: |
          set -euo pipefail
          audit_with_retry() {
            for attempt in 1 2 3; do
              if timeout 180 npm audit "$@"; then
                return 0
              fi
              if test "$attempt" -eq 3; then
                return 1
              fi
              sleep "$((attempt * 10))"
            done
          }
          audit_with_retry --audit-level=high
          audit_with_retry --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - name: Build production WEB bundle with direct map tiles
        env:
          VITE_DIRECT_MAP_TILES: "true"
        run: npm run build
      - run: npx wrangler@4 deploy --dry-run --config edge-proxy/wrangler.jsonc

  tbankrot-auth-broker-smoke:
    name: TBankrot auth broker Docker smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build isolated browser broker
        run: docker build --file Dockerfile.tbankrot-auth --tag bankrotai-tbankrot-auth:ci .
      - name: Start read-only broker and verify health
        shell: bash
        run: |
          set -euo pipefail
          cleanup() { docker rm --force bankrotai-tbankrot-auth-ci >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run --detach             --name bankrotai-tbankrot-auth-ci             --env TBANKROT_AUTH_BROKER_TOKEN=ci-token-0123456789abcdef0123456789abcdef             --read-only             --tmpfs /tmp:rw,noexec,nosuid,size=512m             --shm-size 512m             bankrotai-tbankrot-auth:ci >/dev/null
          for attempt in $(seq 1 30); do
            if docker exec bankrotai-tbankrot-auth-ci node -e "fetch('http://127.0.0.1:18443/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
              exit 0
            fi
            sleep 2
          done
          docker logs bankrotai-tbankrot-auth-ci
          exit 1

  desktop-source-smoke:
    name: Windows desktop BAT smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements-dev.lock && pip install --no-deps -e .
      - name: Check source desktop through START_TORGI.bat
        shell: cmd
        run: START_TORGI.bat --check

  docker-smoke-readonly:
    name: Docker read-only production smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: WEB/package-lock.json }
      - working-directory: WEB
        run: npm ci && npx playwright install --with-deps chromium
      - run: bash scripts/docker-smoke-readonly.sh

  docker-smoke-operator:
    name: Docker operator queue smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/docker-smoke-operator.sh
