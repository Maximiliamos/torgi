name: Production reliability

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: production-reliability-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  downstream-paused:
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: echo "Downstream CI paused while upstream production gates complete"
