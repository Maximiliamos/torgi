name: Production reliability

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: production-reliability-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  python-lint:
    name: Python lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements-dev.lock && pip install --no-deps -e .
      - name: Verify version and lock consistency
        run: python scripts/check-repository-consistency.py
      - name: Prevent new oversized modules
        run: python scripts/check_module_sizes.py
      - name: Audit locked Python runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check pip-audit==2.10.1
          pip-audit -r requirements.lock
      - run: ruff check src tests
      - run: mypy src/bankrotai
      - run: bash -n scripts/*.sh


  python-security:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.11", cache: pip }
      - name: Audit locked Python runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check pip-audit==2.10.1
          pip-audit -r requirements.lock

  sqlite-tests:
    name: Python tests (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.11", cache: pip }
      - name: Install EGL dependency with bounded apt retries
        run: |
          set -euo pipefail
          apt_retry() {
            for attempt in 1 2 3; do
              if sudo timeout 180 apt-get "$@"; then
                return 0
              fi
              if test "$attempt" -eq 3; then
                echo "apt-get $* failed after bounded retries" >&2
                return 1
              fi
              sleep "$((attempt * 10))"
            done
          }
          apt_retry update
          apt_retry install -y libegl1
      - run: pip install -r requirements-dev.lock && pip install --no-deps -e .
      - run: pytest -m "not postgres"

  migration-tests:
    name: Database migration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements-dev.lock && pip install --no-deps -e .
      - run: pytest tests/test_database_reliability.py

  postgres-tests:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bankrotai_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d bankrotai_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/bankrotai_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.11", cache: pip }
      - name: Install EGL dependency with bounded apt retries
        run: |
          set -euo pipefail
          apt_retry() {
            for attempt in 1 2 3; do
              if sudo timeout 180 apt-get "$@"; then
                return 0
              fi
              if test "$attempt" -eq 3; then
                echo "apt-get $* failed after bounded retries" >&2
                return 1
              fi
              sleep "$((attempt * 10))"
            done
          }
          apt_retry update
          apt_retry install -y libegl1
      - run: pip install -r requirements-dev.lock && pip install --no-deps -e .
      - run: pytest -m postgres

  web:
    name: WEB typecheck lint tests and build
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: WEB } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: WEB/package-lock.json }
      - run: npm ci
      - name: Audit npm dependencies with bounded registry retries
        run: |
          set -euo pipefail
          audit_with_retry() {
            for attempt in 1 2 3; do
              if timeout 180 npm audit "$@"; then
                return 0
              fi
              if test "$attempt" -eq 3; then
                return 1
              fi
              sleep "$((attempt * 10))"
            done
          }

          # Production dependencies stay strict: any high/critical runtime finding fails CI.
          audit_with_retry --omit=dev --audit-level=high

          # GHSA-vfj7-8cjw-p6xm currently has no patched braces release. It is
          # reachable here only through dev tooling. Keep the full audit visible,
          # but accept exactly this one advisory and fail closed on anything else.
          full_audit=""
          full_status=0
          for attempt in 1 2 3; do
            set +e
            full_audit="$(timeout 180 npm audit --audit-level=high 2>&1)"
            full_status=$?
            set -e
            if test "$full_status" -eq 0 || printf '%s\n' "$full_audit" | grep -q 'GHSA-'; then
              break
            fi
            if test "$attempt" -lt 3; then
              sleep "$((attempt * 10))"
            fi
          done
          printf '%s\n' "$full_audit"
          if test "$full_status" -eq 0; then
            exit 0
          fi
          advisories="$(printf '%s\n' "$full_audit" | grep -oE 'GHSA-[a-z0-9-]+' | sort -u || true)"
          unexpected="$(printf '%s\n' "$advisories" | grep -vx 'GHSA-vfj7-8cjw-p6xm' || true)"
          if ! printf '%s\n' "$advisories" | grep -qx 'GHSA-vfj7-8cjw-p6xm' || test -n "$unexpected"; then
            echo "Unexpected high/critical npm advisory set: $advisories" >&2
            exit "$full_status"
          fi
          echo "::warning::Allowing unpatched dev-only GHSA-vfj7-8cjw-p6xm; runtime npm audit is clean."
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - name: Build production WEB bundle with direct map tiles
        env:
          VITE_DIRECT_MAP_TILES: "true"
        run: npm run build
      - run: npx wrangler@4 deploy --dry-run --config edge-proxy/wrangler.jsonc

  desktop-source-smoke:
    name: Windows desktop BAT smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements-dev.lock && pip install --no-deps -e .
      - name: Check source desktop through START_TORGI.bat
        shell: cmd
        run: START_TORGI.bat --check

  docker-smoke-readonly:
    name: Docker read-only production smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: WEB/package-lock.json }
      - working-directory: WEB
        run: |
          set -euo pipefail
          npm ci
          for attempt in 1 2 3; do
            if timeout 300 npx playwright install --with-deps chromium; then
              exit 0
            fi
            if test "$attempt" -eq 3; then
              echo "Playwright Chromium install failed after bounded retries" >&2
              exit 1
            fi
            sleep "$((attempt * 10))"
          done
      - run: bash scripts/docker-smoke-readonly.sh

  docker-smoke-operator:
    name: Docker operator queue smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/docker-smoke-operator.sh
