name: Production reliability

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: production-reliability-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  python-lint:
    name: Python lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements-dev.lock && pip install --no-deps -e .
      - name: Verify version and lock consistency
        run: python scripts/check-repository-consistency.py
      - name: Prevent new oversized modules
        run: python scripts/check_module_sizes.py
      - name: Enforce immutable GitHub Action refs
        run: python scripts/check_action_pins.py
      - name: Audit locked Python runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check pip-audit==2.10.1
          pip-audit -r requirements.lock
      - name: Verify offline performance benchmark audit
        run: |
          python benchmarks/read_only_pipeline.py --snapshot benchmarks/fixtures/run-42393273402.json --repo . --out /tmp/performance-baseline.json
          python - <<'PY'
          import json
          report = json.load(open("/tmp/performance-baseline.json", encoding="utf-8"))
          benchmark = report["benchmark"]
          audit = report["repository_audit"]
          print(json.dumps({
              "complete": benchmark["complete"],
              "seen": sum(row["seen"] for row in benchmark["sources"]),
              "changed": sum(row["changed"] for row in benchmark["sources"]),
              "critical_path_ms": benchmark["critical_path_ms"],
              "file_count": audit["file_count"],
              "tracked_bytes": audit["tracked_bytes"],
              "workflow_count": audit["workflow_count"],
              "home_runner_workflow_count": len(audit["home_runner_workflows"]),
              "home_runner_without_concurrency_group": audit["home_runner_without_concurrency_group"],
              "cross_group_contention_candidate_pairs": audit["cross_group_contention_candidate_pairs"],
              "import_cycle_candidates": audit["internal_import_cycles_possible"],
              "git_status_unchanged": audit["git_status_unchanged"],
          }, indent=2))
          PY
      - name: Compare M-ETS public detail hosts (diagnostic only, no credentials)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        timeout-minutes: 1
        run: python scripts/diagnose_mets_public_origins.py
      - run: ruff check src tests benchmarks
      - run: mypy src/bankrotai benchmarks/read_only_pipeline.py
      - run: bash -n scripts/*.sh


  python-security:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: { python-version: "3.11", cache: pip }
      - name: Audit locked Python runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check pip-audit==2.10.1
          pip-audit -r requirements.lock

  sqlite-tests:
    name: Python tests (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: { python-version: "3.11", cache: pip }
      - name: Install EGL dependency with bounded apt retries
        run: |
          set -euo pipefail
          apt_retry() {
            for attempt in 1 2 3; do
              if sudo timeout 180 apt-get "$@"; then
                return 0
              fi
              if test "$attempt" -eq 3; then
                echo "apt-get $* failed after bounded retries" >&2
                return 1
              fi
              sleep "$((attempt * 10))"
            done
          }
          apt_retry update
          apt_retry install -y libegl1
      - run: pip install -r requirements-dev.lock && pip install --no-deps -e .
      - name: Targeted offline performance benchmark tests
        run: pytest tests/test_performance_baseline_benchmark.py
      - name: Full offline SQLite pytest
        run: pytest -m "not postgres"

  migration-tests:
    name: Database migration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements-dev.lock && pip install --no-deps -e .
      - run: pytest tests/test_database_reliability.py

  postgres-tests:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_DB: bankrotai_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d bankrotai_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/bankrotai_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: { python-version: "3.11", cache: pip }
      - name: Install EGL dependency with bounded apt retries
        run: |
          set -euo pipefail
          apt_retry() {
            for attempt in 1 2 3; do
              if sudo timeout 180 apt-get "$@"; then
                return 0
              fi
              if test "$attempt" -eq 3; then
                echo "apt-get $* failed after bounded retries" >&2
                return 1
              fi
              sleep "$((attempt * 10))"
            done
          }
          apt_retry update
          apt_retry install -y libegl1
      - run: pip install -r requirements-dev.lock && pip install --no-deps -e .
      - run: pytest -m postgres

  web:
    name: WEB typecheck lint tests and build
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: WEB } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: 22, cache: npm, cache-dependency-path: WEB/package-lock.json }
      - run: npm ci
      - name: Audit npm dependencies with bounded registry retries
        run: |
          set -euo pipefail
          audit_with_retry() {
            for attempt in 1 2 3; do
              if timeout 180 npm audit "$@"; then
                return 0
              fi
              if test "$attempt" -eq 3; then
                return 1
              fi
              sleep "$((attempt * 10))"
            done
          }

          # Production dependencies stay strict: any high/critical runtime finding fails CI.
          audit_with_retry --omit=dev --audit-level=high

          # GHSA-vfj7-8cjw-p6xm currently has no patched braces release. It is
          # reachable here only through dev tooling. Keep the full audit visible,
          # but accept exactly this one advisory and fail closed on anything else.
          full_audit=""
          full_status=0
          for attempt in 1 2 3; do
            set +e
            full_audit="$(timeout 180 npm audit --audit-level=high 2>&1)"
            full_status=$?
            set -e
            if test "$full_status" -eq 0 || printf '%s\n' "$full_audit" | grep -q 'GHSA-'; then
              break
            fi
            if test "$attempt" -lt 3; then
              sleep "$((attempt * 10))"
            fi
          done
          printf '%s\n' "$full_audit"
          if test "$full_status" -eq 0; then
            exit 0
          fi
          advisories="$(printf '%s\n' "$full_audit" | grep -oE 'GHSA-[a-z0-9-]+' | sort -u || true)"
          unexpected="$(printf '%s\n' "$advisories" | grep -vx 'GHSA-vfj7-8cjw-p6xm' || true)"
          if ! printf '%s\n' "$advisories" | grep -qx 'GHSA-vfj7-8cjw-p6xm' || test -n "$unexpected"; then
            echo "Unexpected high/critical npm advisory set: $advisories" >&2
            exit "$full_status"
          fi
          echo "::warning::Allowing unpatched dev-only GHSA-vfj7-8cjw-p6xm; runtime npm audit is clean."
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - name: Build production WEB bundle with direct map tiles
        env:
          VITE_DIRECT_MAP_TILES: "true"
        run: npm run build
      - run: npx wrangler@4 deploy --dry-run --config edge-proxy/wrangler.jsonc

  desktop-source-smoke:
    name: Windows desktop BAT smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Parse guarded full-cycle operator script without executing it
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          $source = Join-Path $PWD 'scripts/launch-seven-source-gated.ps1'
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            $source, [ref]$tokens, [ref]$parseErrors
          )
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            throw 'Gated release PowerShell parser rejected the script'
          }
      - name: Smoke guarded launcher in dry-run with stubbed gh (no network, no writes)
        shell: pwsh
        run: |
          function gh {
            param([Parameter(ValueFromRemainingArguments=$true)][string[]]$Parts)
            # Stub MUST reject any attempt to call workflow dispatch.
            if ($Parts.Count -ne 4 -or
                $Parts[0] -ne 'api' -or
                $Parts[1] -ne 'repos/Maximiliamos/torgi/branches/main' -or
                $Parts[2] -ne '--jq' -or
                $Parts[3] -ne '.commit.sha') {
              throw "Guarded launcher unexpectedly invoked gh: $($Parts -join ' ')"
            }
            Write-Output $env:GITHUB_SHA
          }
          & ./scripts/launch-seven-source-gated.ps1 -ExpectedSha $env:GITHUB_SHA
          if (-not $?) { throw 'Guarded launcher dry-run smoke failed' }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements-dev.lock && pip install --no-deps -e .
      - name: Check source desktop through START_TORGI.bat
        shell: cmd
        run: START_TORGI.bat --check

  docker-smoke-readonly:
    name: Docker read-only production smoke
    # Playwright 1.55.1 is incompatible with ubuntu-26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: 22, cache: npm, cache-dependency-path: WEB/package-lock.json }
      - working-directory: WEB
        run: |
          set -euo pipefail
          npm ci
          for attempt in 1 2 3; do
            if timeout 300 npx playwright install --with-deps chromium; then
              exit 0
            fi
            if test "$attempt" -eq 3; then
              echo "Playwright Chromium install failed after bounded retries" >&2
              exit 1
            fi
            sleep "$((attempt * 10))"
          done
      - run: bash scripts/docker-smoke-readonly.sh

  docker-smoke-operator:
    name: Docker operator queue smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: bash scripts/docker-smoke-operator.sh
