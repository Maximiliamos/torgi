name: Production reliability

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  python-lint:
    name: Python lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements-dev.lock && pip install --no-deps -e .
      - run: ruff check src tests
      - run: mypy src/bankrotai

  sqlite-tests:
    name: Python tests (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: |
          sudo apt-get update
          sudo apt-get install -y libegl1
      - run: pip install -r requirements-dev.lock && pip install --no-deps -e .
      - run: pytest -m "not postgres"

  migration-tests:
    name: Database migration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements-dev.lock && pip install --no-deps -e .
      - run: pytest tests/test_database_reliability.py

  postgres-tests:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bankrotai_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d bankrotai_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/bankrotai_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: |
          sudo apt-get update
          sudo apt-get install -y libegl1
      - run: pip install -r requirements-dev.lock && pip install --no-deps -e .
      - run: pytest -m postgres

  web:
    name: WEB typecheck lint tests and build
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: WEB } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: WEB/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  desktop-source-smoke:
    name: Windows desktop BAT smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements-dev.lock && pip install --no-deps -e .
      - name: Check source desktop through START_TORGI.bat
        shell: cmd
        run: START_TORGI.bat --check

  docker-smoke:
    name: Docker full-stack smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: WEB/package-lock.json }
      - working-directory: WEB
        run: npm ci && npx playwright install --with-deps chromium
      - run: bash scripts/docker-smoke.sh
