name: Diagnose partial seven-source run

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-partial-seven-source.yml'

permissions:
  contents: read

jobs:
  inspect:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, bankrotai-home]
    timeout-minutes: 12
    steps:
      - name: Read exact production run without writes
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $worker = 'bankrotai-home-ingestion-worker'
          $state = (docker inspect --format '{{.State.Status}}' $worker).Trim()
          if ($LASTEXITCODE -ne 0 -or $state -ne 'running') { throw 'Trusted ingestion worker unavailable' }
          $code = @'
          import json
          from sqlalchemy import select
          from bankrotai.db import SessionLocal, LotSyncRun, LotSyncSourceRun, SourceHealthState

          target = "03351d17-e4bd-41ca-a8b5-fd7a9ce1e31c"
          with SessionLocal() as s:
              run = s.get(LotSyncRun, target)
              if run is None:
                  raise SystemExit("target run missing")
              rows = list(s.scalars(
                  select(LotSyncSourceRun)
                  .where(LotSyncSourceRun.sync_run_id == target)
                  .order_by(LotSyncSourceRun.source_system)
              ))
              active = s.scalar(
                  select(LotSyncRun)
                  .where(LotSyncRun.status.in_(("queued","running")))
                  .order_by(LotSyncRun.created_at.desc())
              )
              active_rows = []
              if active is not None:
                  active_rows = list(s.scalars(
                      select(LotSyncSourceRun)
                      .where(LotSyncSourceRun.sync_run_id == active.id)
                      .order_by(LotSyncSourceRun.source_system)
                  ))
              health = {
                  h.source_system: {
                      "status": h.status,
                      "last_started_at": str(h.last_started_at) if h.last_started_at else None,
                      "last_success_at": str(h.last_success_at) if h.last_success_at else None,
                      "last_failure_at": str(h.last_failure_at) if h.last_failure_at else None,
                      "last_error": (h.last_error or "")[:1200],
                      "items_seen": h.items_seen,
                      "metadata_json": h.metadata_json,
                  }
                  for h in s.scalars(select(SourceHealthState))
                  if h.source_system in {
                      "torgi.gov.ru","lot-online.ru","torgi-russia.ru",
                      "bidexpert.ru","m-ets.ru","cdtrf.ru","nistp.ru"
                  }
              }

          def src(r):
              return {
                  "source_system": r.source_system,
                  "status": r.status,
                  "complete_source_run": bool(r.complete_source_run),
                  "pages_scanned": r.pages_scanned,
                  "items_seen": r.items_seen,
                  "items_inserted": r.items_inserted,
                  "items_updated": r.items_updated,
                  "items_unchanged": r.items_unchanged,
                  "items_archived": r.items_archived,
                  "items_failed": r.items_failed,
                  "duration_ms": r.duration_ms,
                  "error_message": (r.error_message or "")[:2000],
                  "checkpoint_json": r.checkpoint_json,
                  "started_at": str(r.started_at) if r.started_at else None,
                  "finished_at": str(r.finished_at) if r.finished_at else None,
                  "progress_at": str(r.progress_at) if r.progress_at else None,
              }

          out = {
              "read_only": True,
              "target": {
                  "id": run.id,
                  "status": run.status,
                  "trigger_type": run.trigger_type,
                  "created_at": str(run.created_at),
                  "started_at": str(run.started_at),
                  "finished_at": str(run.finished_at),
                  "error_message": (run.error_message or "")[:2000],
                  "checkpoint_json": run.checkpoint_json,
                  "result_json": run.result_json,
                  "sources": [src(r) for r in rows],
              },
              "active": None if active is None else {
                  "id": active.id,
                  "status": active.status,
                  "trigger_type": active.trigger_type,
                  "created_at": str(active.created_at),
                  "started_at": str(active.started_at),
                  "heartbeat_at": str(active.heartbeat_at),
                  "lease_expires_at": str(active.lease_expires_at),
                  "error_message": (active.error_message or "")[:2000],
                  "result_json": active.result_json,
                  "sources": [src(r) for r in active_rows],
              },
              "source_health": health,
          }
          print(json.dumps(out, ensure_ascii=False, default=str))
          '@
          $output = @($code | docker exec -i $worker python -)
          if ($LASTEXITCODE -ne 0 -or $output.Count -lt 1) { throw 'Read-only run diagnostic failed' }
          $json = $output[-1]
          $json | Set-Content -LiteralPath "$env:RUNNER_TEMP/partial-run-diagnostic.json" -Encoding UTF8
          $json


      - name: Inspect exact M-ETS detail failures and Torgi Russia quarantine
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $worker = 'bankrotai-home-ingestion-worker'
          $code = @'
          import json
          from decimal import Decimal
          import requests

          from bankrotai.connectors.registry.etp_incremental import _property_ready
          from bankrotai.connectors.registry.mets_public import BASE as METS_BASE, MetsPublicPilot, parse_mets_lot
          from bankrotai.connectors.registry.mets_sync import MetsSourceCrawler
          from bankrotai.services.etp_mets_full_catalogue import _parse_page, _request_page
          from bankrotai.scraper_contracts import parse_money
          from bankrotai.torgi_russia import BASE_URL, TorgiRussiaClient
          from bankrotai.torgi_russia_title_recovery import recover_empty_title

          def safe_error(exc):
              return {
                  "type": type(exc).__name__,
                  "message": str(exc)[:500],
              }

          mets_session = requests.Session()
          pilot = MetsPublicPilot(session=mets_session)
          mets_pages = []
          try:
              for page_number in (1, 31):
                  page_response = _request_page(mets_session, page_number, sleep=lambda _s: None)
                  parsed = _parse_page(page_response.text, page_number)
                  rows = []
                  for external_id, catalogue_price, catalogue_status, title in parsed["observations"]:
                      row = {
                          "external_id": external_id,
                          "catalogue_price": catalogue_price,
                          "catalogue_status": catalogue_status,
                          "catalogue_title": title[:180],
                      }
                      expected_status = MetsSourceCrawler._expected_status(catalogue_status)
                      try:
                          html = pilot._get(f"{METS_BASE}/{external_id}")
                          lot = parse_mets_lot(html, f"{METS_BASE}/{external_id}")
                          prices = {
                              Decimal(str(value))
                              for value in (lot.start_price, lot.current_price)
                              if value is not None
                          }
                          if lot.external_id != external_id:
                              verdict = "identity_mismatch"
                          elif lot.auction_status != expected_status:
                              verdict = "status_mismatch"
                          elif Decimal(str(catalogue_price)) not in prices:
                              verdict = "price_mismatch"
                          elif not _property_ready(lot):
                              verdict = "property_evidence_missing"
                          else:
                              verdict = "accepted"
                          row.update({
                              "verdict": verdict,
                              "detail_status": lot.auction_status,
                              "detail_start_price": lot.start_price,
                              "detail_current_price": lot.current_price,
                              "detail_category": lot.category,
                              "has_address": bool(lot.address),
                              "has_cadastre": bool(lot.cadastral_number),
                              "detail_url": lot.lot_url,
                          })
                      except Exception as exc:
                          row.update({"verdict": "exception", "error": safe_error(exc)})
                      rows.append(row)
                  mets_pages.append({
                      "page": page_number,
                      "reported_total": parsed["total"],
                      "next_page": parsed.get("next_page"),
                      "rows": rows,
                  })
          finally:
              mets_session.close()

          tr = TorgiRussiaClient(timeout=20)
          target = "7266197"
          torgi = {"external_id": target}
          try:
              detail_response = tr._get_with_retry(f"{BASE_URL}/lot/{target}")
              torgi["detail_http_status"] = detail_response.status_code
              torgi["detail_url"] = detail_response.url
              detail_records = [
                  record for record in tr._extract_public_lot_records(
                      detail_response.text, require_linked=False
                  )
                  if str(record.get("id")) == target
              ]
              torgi["matching_detail_records"] = len(detail_records)
              if detail_records:
                  record = detail_records[0]
                  torgi["detail_title"] = str(record.get("title") or "")[:300]
                  torgi["detail_keys"] = sorted(str(k) for k in record.keys())[:80]
                  links = record.get("source_links")
                  if isinstance(links, list):
                      torgi["source_links"] = [
                          {
                              "title": str(x.get("title") or "")[:120],
                              "link": str(x.get("link") or "")[:500],
                          }
                          for x in links[:10] if isinstance(x, dict)
                      ]
              # Recreate only the fields needed by the exact recovery function.
              listing_item = dict(detail_records[0]) if detail_records else {"id": int(target), "title": ""}
              listing_item["id"] = int(target)
              listing_item["title"] = ""
              try:
                  recovered = recover_empty_title(
                      listing_item,
                      base_url=BASE_URL,
                      get_with_retry=tr._get_with_retry,
                      extract_records=tr._extract_public_lot_records,
                      parse_price=parse_money,
                  )
                  torgi["recovery"] = {
                      "status": "success",
                      "title": str(recovered.get("title") or "")[:300],
                      "title_evidence": recovered.get("title_evidence"),
                      "title_evidence_url": recovered.get("title_evidence_url"),
                  }
              except Exception as exc:
                  torgi["recovery"] = {"status": "failed", "error": safe_error(exc)}
          except Exception as exc:
              torgi["detail_fetch"] = {"status": "failed", "error": safe_error(exc)}

          report = {
              "read_only": True,
              "database_writes": 0,
              "mets": {"pages": mets_pages},
              "torgi_russia": torgi,
          }
          print(json.dumps(report, ensure_ascii=False, default=str))
          '@
          $output = @($code | docker exec -i $worker python -)
          if ($LASTEXITCODE -ne 0 -or $output.Count -lt 1) { throw 'Source page diagnostic failed' }
          $json = $output[-1]
          $json | Set-Content -LiteralPath "$env:RUNNER_TEMP/source-page-diagnostic.json" -Encoding UTF8
          $json

      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: partial-run-diagnostic
          path: |
            ${{ runner.temp }}/partial-run-diagnostic.json
            ${{ runner.temp }}/source-page-diagnostic.json
          if-no-files-found: warn
          retention-days: 3
