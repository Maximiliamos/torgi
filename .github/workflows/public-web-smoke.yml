name: Public WEB smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "47 */6 * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: public-web-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_BASE_URL: ${{ secrets.PUBLIC_WEB_URL }}
      E2E_USERNAME: ${{ vars.AUTH_BOOTSTRAP_USERNAME || 'reader' }}
      E2E_PASSWORD: ${{ secrets.AUTH_BOOTSTRAP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: WEB/package-lock.json }
      - working-directory: WEB
        run: npm ci
      - working-directory: WEB
        run: npx playwright install --with-deps chromium
      - working-directory: WEB
        run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: public-web-smoke-failure-${{ github.run_id }}
          path: WEB/test-results
          retention-days: 7

  notify-failure:
    needs: smoke
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = `Public WEB smoke failed: ${context.runId}`;
            const body = `Public Pages/REG.RU smoke failed. [Open workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`;
            await github.rest.issues.create({ ...context.repo, title, body });
