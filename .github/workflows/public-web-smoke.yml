name: Public browser network diagnostic (read only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-browser-network-diagnostic-20261120
  cancel-in-progress: false
jobs:
  diagnose:
    if: github.ref == 'refs/heads/codex/public-browser-network-20261120'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: 22, cache: npm, cache-dependency-path: WEB/package-lock.json}
      - working-directory: WEB
        run: npm ci
      - working-directory: WEB
        run: npx playwright install --with-deps chromium
      - name: Compare public navigation protocols without credentials or writes
        working-directory: WEB
        run: node scripts/public-network-diagnostic.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: public-browser-network-diagnostic
          path: WEB/public-network-diagnostic.json
          retention-days: 7
