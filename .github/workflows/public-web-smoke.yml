name: Public WEB smoke

on:
  workflow_dispatch:
    inputs:
      functional_audit:
        description: Run only the deep production journey for pre-merge branch verification
        required: false
        default: false
        type: boolean
  workflow_run:
    workflows: [Deploy Cloudflare edge proxy]
    types: [completed]
  schedule:
    - cron: "47 */6 * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: public-web-smoke
  cancel-in-progress: true

jobs:
  smoke:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_BASE_URL: https://dezster.ru
      # Keep this workflow on the critical path only. The scheduled/manual
      # production-functional workflow owns the deep real-data journey.
      E2E_PRODUCTION_AUDIT: ${{ inputs.functional_audit && '1' || '0' }}
      E2E_USERNAME: ${{ vars.AUTH_BOOTSTRAP_USERNAME || 'reader' }}
      E2E_PASSWORD: ${{ secrets.AUTH_BOOTSTRAP_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: WEB/package-lock.json }
      - working-directory: WEB
        run: npm ci
      - working-directory: WEB
        run: npx playwright install --with-deps chromium
      - name: Verify canonical production path and deployed SHA
        continue-on-error: ${{ github.ref != 'refs/heads/main' }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 \
            https://api.dezster.ru/health/live >/dev/null
          curl --fail --silent --show-error --max-time 20 \
            https://api.dezster.ru/health/ready >/dev/null
          test "$(curl --silent --show-error --max-time 30 -o /dev/null -w '%{http_code}' \
            https://dezster.ru/api/auth/me)" = "401"
          EXPECTED_SHA="$GITHUB_SHA"
          if test "$GITHUB_REF" != "refs/heads/main"; then
            EXPECTED_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          fi
          DEPLOYED_SHA="$(curl --fail --silent --show-error --max-time 20 \
            -H 'Cache-Control: no-cache' https://dezster.ru/deployment.json \
            | python -c 'import json,sys; print(json.load(sys.stdin)["commit"])')"
          test "$DEPLOYED_SHA" = "$EXPECTED_SHA"
      - name: Run fast critical-path smoke
        if: github.event_name != 'workflow_dispatch' || !inputs.functional_audit
        working-directory: WEB
        run: npx playwright test e2e/smoke.spec.ts
      - name: Run deep production branch audit
        if: github.event_name == 'workflow_dispatch' && inputs.functional_audit
        working-directory: WEB
        run: npx playwright test e2e/production-readonly.spec.ts
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: public-web-smoke-failure-${{ github.run_id }}
          path: WEB/test-results
          retention-days: 7

  notify-failure:
    needs: smoke
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const title = `Public WEB smoke failed: ${context.runId}`;
            const body = `Public Pages/REG.RU smoke failed. [Open workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`;
            await github.rest.issues.create({ ...context.repo, title, body });
