name: Deploy WEB and API to REG.RU

on:
  workflow_dispatch:
    inputs:
      diagnostics_only:
        description: Collect read-only production diagnostics without deploying or restarting
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - "requirements.lock"
      - "pyproject.toml"
      - "alembic/**"
      - "src/**"
      - "WEB/**"
      - ".github/workflows/regru-deploy.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: regru-production-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: maximiliamos/bankrotai-api
  SSH_HOST: 194.226.126.233
  # Port 443 is owned by Caddy after the initial bootstrap. Ongoing deploys
  # must use the dedicated SSH listener configured on the server.
  SSH_BOOTSTRAP_PORT: "2222"
  SSH_DEPLOY_PORT: "2222"
  API_HOSTNAME: 194-226-126-233.sslip.io

jobs:
  diagnostics:
    if: github.event_name == 'workflow_dispatch' && inputs.diagnostics_only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SSH_HOST: 194.226.126.233
      SSH_PORT: "2222"
    steps:
      - name: Prepare SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.REGRU_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/regru_diagnostics"
          chmod 600 "$HOME/.ssh/regru_diagnostics"
          ssh-keyscan -T 20 -p "$SSH_PORT" "$SSH_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Collect read-only API diagnostics
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/regru_diagnostics" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -p "$SSH_PORT" "root@$SSH_HOST" \
            'bash -s' <<'REMOTE'
          set -u
          section() { printf '\n===== %s =====\n' "$1"; }
          bounded() { timeout "$1" "${@:2}" 2>&1 || printf '[command exit=%s]\n' "$?"; }

          section timestamp
          date --iso-8601=seconds
          uptime
          section memory_and_disk
          free -h
          df -h
          section docker_ps
          bounded 15 docker ps -a --no-trunc
          section docker_stats
          bounded 15 docker stats --no-stream
          section api_inspect_allowlist
          bounded 15 docker inspect --format \
            'state={{json .State}} restart_count={{.RestartCount}} image={{.Config.Image}} memory={{.HostConfig.Memory}} nano_cpus={{.HostConfig.NanoCpus}} pids_limit={{.HostConfig.PidsLimit}} networks={{json .NetworkSettings.Networks}}' \
            bankrotai-api
          section api_logs
          bounded 20 docker logs --timestamps --tail 500 bankrotai-api
          section tunnel_logs
          bounded 20 docker logs --timestamps --tail 300 bankrotai-cloudflared \
            | sed -E 's/eyJ[A-Za-z0-9+\/_=-]+/[REDACTED]/g'
          section api_processes
          bounded 15 docker exec bankrotai-api ps aux
          bounded 15 docker top bankrotai-api -eo pid,ppid,nlwp,stat,etime,time,pcpu,pmem,wchan:32,args
          section api_proc_limits
          api_pid="$(docker inspect --format '{{.State.Pid}}' bankrotai-api 2>/dev/null || true)"
          if test -n "$api_pid" && test "$api_pid" != 0; then
            cat "/proc/$api_pid/status" 2>&1 || true
            cat "/proc/$api_pid/limits" 2>&1 || true
            printf 'fd_count='; find "/proc/$api_pid/fd" -mindepth 1 -maxdepth 1 2>/dev/null | wc -l
            printf 'wchan='; cat "/proc/$api_pid/wchan" 2>&1 || true
          fi
          section host_sockets
          bounded 15 ss -s
          bounded 15 ss -tanp
          section tunnel_inspect_allowlist
          bounded 15 docker inspect --format \
            'state={{json .State}} restart_count={{.RestartCount}} image={{.Config.Image}} memory={{.HostConfig.Memory}} networks={{json .NetworkSettings.Networks}}' \
            bankrotai-cloudflared
          section tunnel_metrics
          bounded 15 docker exec bankrotai-cloudflared wget -qO- http://127.0.0.1:20241/metrics \
            | grep -E '^(cloudflared_tunnel_ha_connections|cloudflared_tunnel_timer_retries|cloudflared_tunnel_tunnel_(authenticate|register)_(success|fail))'
          section host_network_counters
          bounded 15 ip -s link
          bounded 15 netstat -s
          bounded 15 sh -c 'test -r /proc/sys/net/netfilter/nf_conntrack_count && printf "conntrack_count=" && cat /proc/sys/net/netfilter/nf_conntrack_count; test -r /proc/sys/net/netfilter/nf_conntrack_max && printf "conntrack_max=" && cat /proc/sys/net/netfilter/nf_conntrack_max'
          bounded 15 sysctl net.core.rmem_default net.core.rmem_max net.core.wmem_default net.core.wmem_max net.ipv4.udp_rmem_min net.ipv4.udp_wmem_min
          section recent_network_kernel_messages
          bounded 15 dmesg --ctime --level=alert,crit,err,warn \
            | grep -Ei 'network|netdev|conntrack|drop|udp|tcp|eth|virtio|oom' \
            | tail -n 200
          section health_from_host
          bounded 12 curl --verbose --fail --show-error --connect-timeout 2 --max-time 8 http://127.0.0.1:8000/health/live
          printf '\n'
          bounded 20 curl --verbose --fail --show-error --connect-timeout 2 --max-time 15 http://127.0.0.1:8000/health/ready
          printf '\n'
          section health_from_api_network_ip
          api_ip="$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' bankrotai-api 2>/dev/null || true)"
          if test -n "$api_ip"; then
            bounded 12 curl --verbose --fail --show-error --connect-timeout 2 --max-time 8 "http://$api_ip:8000/health/live"
            printf '\n'
            bounded 20 curl --verbose --fail --show-error --connect-timeout 2 --max-time 15 "http://$api_ip:8000/health/ready"
            printf '\n'
          fi
          section health_from_tunnel_container
          bounded 15 docker exec bankrotai-cloudflared wget -S -O - -T 8 http://bankrotai-api:8000/health/live
          section api_tls_trust
          bounded 15 docker exec bankrotai-api sh -c 'ls -l /etc/ssl/certs/*ussian* 2>/dev/null || true'
          bounded 15 docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' bankrotai-api \
            | grep -E '^(REQUESTS_CA_BUNDLE|SSL_CERT_FILE)=' || true
          bounded 15 docker exec bankrotai-api python -c \
            'import ssl; print(ssl.get_default_verify_paths())'
          bounded 20 docker exec bankrotai-api python -c \
            'import socket,ssl; context=ssl.create_default_context(); context.check_hostname=False; context.verify_mode=ssl.CERT_NONE; raw=socket.create_connection(("torgi.gov.ru",443),5); tls=context.wrap_socket(raw,server_hostname="torgi.gov.ru"); print([certificate.get_info() for certificate in tls._sslobj.get_unverified_chain()])'
          bounded 20 docker exec bankrotai-api python -c \
            'import requests; response=requests.get("https://torgi.gov.ru/new/api/public/lotcards/search", timeout=(5, 10)); print(response.status_code)'
          REMOTE

  build-and-deploy:
    if: github.event_name != 'workflow_dispatch' || !inputs.diagnostics_only
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: WEB/package-lock.json

      - name: Build production WEB bundle
        working-directory: WEB
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm run lint
          npm test
          npm run build
          printf '{"commit":"%s"}\n' "$GITHUB_SHA" > dist/deployment.json
          tar -C dist -czf "$RUNNER_TEMP/bankrotai-web.tgz" .

      - name: Validate required secrets
        env:
          SSH_PRIVATE_KEY: ${{ secrets.REGRU_SSH_PRIVATE_KEY }}
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          DATABASE_MIGRATION_URL: ${{ secrets.NEON_DATABASE_MIGRATION_URL }}
          API_KEY: ${{ secrets.KOYEB_SERVICE_KEY }}
          SESSION_SECRET: ${{ secrets.AUTH_SESSION_SECRET }}
          AUTH_BOOTSTRAP_PASSWORD: ${{ secrets.AUTH_BOOTSTRAP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$DATABASE_URL"
          test -n "$DATABASE_MIGRATION_URL"
          test -n "$API_KEY"
          test -n "$SESSION_SECRET"
          test -n "$AUTH_BOOTSTRAP_PASSWORD"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish API image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Prepare SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.REGRU_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/regru_deploy"
          chmod 600 "$HOME/.ssh/regru_deploy"
          ssh-keyscan -T 20 -p "$SSH_BOOTSTRAP_PORT" "$SSH_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Prepare server and release HTTPS port
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/regru_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -p "$SSH_BOOTSTRAP_PORT" "root@$SSH_HOST" \
            "DEPLOY_PORT='$SSH_DEPLOY_PORT' bash -s" <<'REMOTE'
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl docker.io ufw
          systemctl enable --now docker

          if ! swapon --show=NAME --noheadings | grep -q .; then
            fallocate -l 1G /swapfile
            chmod 600 /swapfile
            mkswap /swapfile
            swapon /swapfile
            grep -qF '/swapfile none swap sw 0 0' /etc/fstab || \
              printf '%s\n' '/swapfile none swap sw 0 0' >> /etc/fstab
          fi

          printf 'Port %s\n' "$DEPLOY_PORT" > /etc/ssh/sshd_config.d/99-bankrotai.conf
          sshd -t
          ufw allow "$DEPLOY_PORT/tcp"
          ufw allow 80/tcp
          ufw allow 443/tcp
          systemctl daemon-reload
          systemctl restart ssh.socket
          REMOTE

      - name: Verify deployment SSH port
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if ssh-keyscan -T 10 -p "$SSH_DEPLOY_PORT" "$SSH_HOST" > "$HOME/.ssh/known_hosts.deploy" 2>/dev/null; then
              break
            fi
            sleep 5
          done
          test -s "$HOME/.ssh/known_hosts.deploy"
          ssh \
            -i "$HOME/.ssh/regru_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts.deploy" \
            -p "$SSH_DEPLOY_PORT" "root@$SSH_HOST" \
            'test "$(id -u)" = 0 && docker version >/dev/null'

      - name: Install production configuration
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          DATABASE_MIGRATION_URL: ${{ secrets.NEON_DATABASE_MIGRATION_URL }}
          API_KEY: ${{ secrets.KOYEB_SERVICE_KEY }}
          SESSION_SECRET: ${{ secrets.AUTH_SESSION_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          API_ENV_B64="$({
            printf '%s\n' 'APP_ENV=production'
            printf '%s\n' 'API_READ_ONLY=true'
            printf '%s\n' 'API_RATE_LIMIT_PER_MINUTE=60'
            printf '%s\n' 'DATABASE_POOL_SIZE=3'
            printf '%s\n' 'DATABASE_MAX_OVERFLOW=2'
            printf '%s\n' 'DATABASE_POOL_TIMEOUT=10'
            printf 'DATABASE_URL=%s\n' "$DATABASE_URL"
            printf 'DATABASE_MIGRATION_URL=%s\n' "$DATABASE_MIGRATION_URL"
            printf 'BANKROTAI_API_KEY=%s\n' "$API_KEY"
            printf 'AUTH_SESSION_SECRET=%s\n' "$SESSION_SECRET"
          } | base64 -w 0)"
          CADDY_ENV_B64="$(printf 'BANKROTAI_API_KEY=%s\n' "$API_KEY" | base64 -w 0)"

          printf '%s' "$API_ENV_B64" | ssh \
            -i "$HOME/.ssh/regru_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts.deploy" \
            -p "$SSH_DEPLOY_PORT" "root@$SSH_HOST" \
            'install -d -m 700 /opt/bankrotai; base64 -d > /opt/bankrotai/api.env; chmod 600 /opt/bankrotai/api.env'

          printf '%s' "$CADDY_ENV_B64" | ssh \
            -i "$HOME/.ssh/regru_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts.deploy" \
            -p "$SSH_DEPLOY_PORT" "root@$SSH_HOST" \
            'base64 -d > /opt/bankrotai/caddy.env; chmod 600 /opt/bankrotai/caddy.env'

          scp \
            -i "$HOME/.ssh/regru_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts.deploy" \
            -P "$SSH_DEPLOY_PORT" \
            "$RUNNER_TEMP/bankrotai-web.tgz" "root@$SSH_HOST:/opt/bankrotai/web-release.tgz"

          scp \
            -i "$HOME/.ssh/regru_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts.deploy" \
            -P "$SSH_DEPLOY_PORT" \
            scripts/regru-api-watchdog.sh "root@$SSH_HOST:/opt/bankrotai/api-watchdog.sh"

          ssh \
            -i "$HOME/.ssh/regru_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts.deploy" \
            -p "$SSH_DEPLOY_PORT" "root@$SSH_HOST" \
            "API_HOSTNAME='$API_HOSTNAME' bash -s" <<'REMOTE'
          set -euo pipefail
          rm -rf /opt/bankrotai/web.next
          install -d -m 755 /opt/bankrotai/web.next
          tar -xzf /opt/bankrotai/web-release.tgz -C /opt/bankrotai/web.next
          test -s /opt/bankrotai/web.next/index.html
          test -s /opt/bankrotai/web.next/deployment.json
          find /opt/bankrotai/web.next -type d -exec chmod 755 {} +
          find /opt/bankrotai/web.next -type f -exec chmod 644 {} +
          rm -rf /opt/bankrotai/web.previous
          if [ -d /opt/bankrotai/web ]; then
            mv /opt/bankrotai/web /opt/bankrotai/web.previous
          fi
          mv /opt/bankrotai/web.next /opt/bankrotai/web
          rm -f /opt/bankrotai/web-release.tgz

          cat > /opt/bankrotai/Caddyfile <<CADDY
          ${API_HOSTNAME} {
            encode zstd gzip

            @backend path /api /api/* /health /health/*
            handle @backend {
              reverse_proxy bankrotai-api:8000 {
                header_up X-API-Key "{\$BANKROTAI_API_KEY}"
                header_up X-Request-ID "{http.request.header.X-Request-ID}"
              }
            }

            handle {
              root * /srv
              try_files {path} /index.html
              file_server
            }

            @assets path /assets/*
            header @assets Cache-Control "public, max-age=31536000, immutable"
            header {
              X-Content-Type-Options nosniff
              X-Frame-Options DENY
              Referrer-Policy no-referrer
              Permissions-Policy "camera=(), microphone=(), geolocation=()"
            }
            log {
              output stdout
              format json
            }
          }
          CADDY
          chmod 644 /opt/bankrotai/Caddyfile
          chmod 700 /opt/bankrotai/api-watchdog.sh

          cat > /etc/systemd/system/bankrotai-api-watchdog.service <<'UNIT'
          [Unit]
          Description=BankrotAI API liveness watchdog
          After=docker.service network-online.target
          Wants=network-online.target

          [Service]
          Type=oneshot
          ExecStart=/opt/bankrotai/api-watchdog.sh
          UNIT

          cat > /etc/systemd/system/bankrotai-api-watchdog.timer <<'UNIT'
          [Unit]
          Description=Run BankrotAI API watchdog every minute

          [Timer]
          OnBootSec=2min
          OnUnitActiveSec=1min
          AccuracySec=10s
          Persistent=true

          [Install]
          WantedBy=timers.target
          UNIT
          systemctl daemon-reload
          systemctl enable --now bankrotai-api-watchdog.timer
          REMOTE

      - name: Pull and start production containers
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | ssh \
            -i "$HOME/.ssh/regru_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts.deploy" \
            -p "$SSH_DEPLOY_PORT" "root@$SSH_HOST" \
            "docker login ghcr.io -u '$GITHUB_ACTOR' --password-stdin"

          ssh \
            -i "$HOME/.ssh/regru_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts.deploy" \
            -p "$SSH_DEPLOY_PORT" "root@$SSH_HOST" \
            "IMAGE='$IMAGE' bash -s" <<'REMOTE'
          set -euo pipefail
          # Keep the currently running release, but reclaim stopped containers,
          # dangling layers and old unreferenced images before downloading the
          # next release. Small REG.RU disks otherwise fail during docker pull.
          docker container prune -f
          docker image prune -af --filter 'until=24h'

          pull_with_retry() {
            image="$1"
            for attempt in 1 2 3 4; do
              if docker pull "$image"; then
                return 0
              fi
              if [ "$attempt" -eq 4 ]; then
                return 1
              fi
              sleep $((attempt * 5))
            done
          }

          pull_with_retry "$IMAGE"
          pull_with_retry caddy:2-alpine
          docker run --rm \
            --env-file /opt/bankrotai/api.env \
            "$IMAGE" \
            python -m bankrotai.cli init-db
          docker run --rm \
            --env-file /opt/bankrotai/caddy.env \
            -v /opt/bankrotai/Caddyfile:/etc/caddy/Caddyfile:ro \
            caddy:2-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker network inspect bankrotai >/dev/null 2>&1 || docker network create bankrotai
          docker rm -f bankrotai-api bankrotai-caddy >/dev/null 2>&1 || true
          docker run -d \
            --name bankrotai-api \
            --restart unless-stopped \
            --network bankrotai \
            -p 127.0.0.1:8000:8000 \
            --env-file /opt/bankrotai/api.env \
            --memory 512m \
            --cpus 1.0 \
            --log-opt max-size=10m \
            --log-opt max-file=3 \
            "$IMAGE"
          docker run -d \
            --name bankrotai-caddy \
            --restart unless-stopped \
            --network bankrotai \
            --env-file /opt/bankrotai/caddy.env \
            -p 80:80 \
            -p 443:443 \
            -v /opt/bankrotai/Caddyfile:/etc/caddy/Caddyfile:ro \
            -v /opt/bankrotai/web:/srv:ro \
            -v bankrotai_caddy_data:/data \
            -v bankrotai_caddy_config:/config \
            --log-opt max-size=10m \
            --log-opt max-file=3 \
            caddy:2-alpine
          # The tunnel resolves Docker service names inside the bankrotai
          # network. Restart it after replacing the API container so it cannot
          # retain the previous container address during the public smoke.
          if docker container inspect bankrotai-cloudflared >/dev/null 2>&1; then
            docker restart bankrotai-cloudflared >/dev/null
            tunnel_started_at="$(docker inspect --format '{{.State.StartedAt}}' bankrotai-cloudflared)"
            timeout 45 bash -c \
              'until docker logs --since "'$tunnel_started_at'" bankrotai-cloudflared 2>&1 | grep -F "Registered tunnel connection" >/dev/null; do sleep 2; done'
          fi
          docker logout ghcr.io
          docker image prune -af --filter 'until=168h'
          REMOTE

      - name: Collect safe deployment diagnostics
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          ssh \
            -i "$HOME/.ssh/regru_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts.deploy" \
            -p "$SSH_DEPLOY_PORT" "root@$SSH_HOST" \
            'df -h; docker system df; docker ps -a --format "table {{.Names}}\t{{.Status}}\t{{.Image}}"'

      - name: Verify public health endpoints
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --connect-timeout 3 --max-time 10 \
            --retry 18 --retry-delay 5 --retry-all-errors \
            "https://$API_HOSTNAME/health/live"
          printf '\n'
          curl --fail --silent --show-error \
            --connect-timeout 3 --max-time 15 \
            --retry 12 --retry-delay 5 --retry-all-errors \
            "https://$API_HOSTNAME/health/ready"
          printf '\n'
          curl --fail --silent --show-error \
            --connect-timeout 3 --max-time 15 \
            --retry 18 --retry-delay 5 --retry-all-errors \
            "https://api.dezster.ru/health/ready"
          printf '\n'
          for stability_check in $(seq 1 6); do
            test "$(curl --silent --show-error --max-time 20 -o /dev/null -w '%{http_code}' \
              https://api.dezster.ru/health/live || true)" = "200"
            test "$(curl --silent --show-error --max-time 30 -o /dev/null -w '%{http_code}' \
              https://dezster.ru/api/auth/me || true)" = "401"
            if test "$stability_check" != 6; then
              sleep 5
            fi
          done

      - name: Verify deployed WEB release
        shell: bash
        run: |
          set -euo pipefail
          test "$(curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors \
            "https://$API_HOSTNAME/deployment.json" | python -c 'import json,sys; print(json.load(sys.stdin)["commit"])')" = "$GITHUB_SHA"
          INDEX_HTML="$(curl --fail --silent --show-error "https://$API_HOSTNAME/")"
          ASSET_PATH="$(printf '%s' "$INDEX_HTML" | grep -oE '/assets/index-[^"]+\.js' | head -n 1)"
          test -n "$ASSET_PATH"
          curl --fail --silent --show-error "https://$API_HOSTNAME$ASSET_PATH" > "$RUNNER_TEMP/public-app.js"
          grep -Fq 'replace-lots' "$RUNNER_TEMP/public-app.js"
          grep -Fq 'Объединено публикаций' "$RUNNER_TEMP/public-app.js"

      - name: Verify canonical Cloudflare production path
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            AUTH_STATUS="$(curl --silent --show-error --max-time 30 -o /dev/null -w '%{http_code}' \
              https://dezster.ru/api/auth/me || true)"
            DEPLOYED_SHA="$(curl --fail --silent --show-error --max-time 20 \
              -H 'Cache-Control: no-cache' https://dezster.ru/deployment.json 2>/dev/null \
              | python -c 'import json,sys; print(json.load(sys.stdin).get("commit", ""))' 2>/dev/null || true)"
            if test "$AUTH_STATUS" = "401" && test "$DEPLOYED_SHA" = "$GITHUB_SHA"; then
              exit 0
            fi
            sleep 5
          done
          echo "Canonical production path did not reach the expected release" >&2
          exit 1

      - name: Install Playwright Chromium
        working-directory: WEB
        run: npx playwright install --with-deps chromium

      - name: Run public WEB smoke
        working-directory: WEB
        env:
          E2E_BASE_URL: https://dezster.ru
          E2E_USERNAME: ${{ vars.AUTH_BOOTSTRAP_USERNAME || 'reader' }}
          E2E_PASSWORD: ${{ secrets.AUTH_BOOTSTRAP_PASSWORD }}
        run: npm run test:e2e

