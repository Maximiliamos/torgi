name: Force cancel obsolete reconciliation

on:
  push:
    branches:
      - ops/cancel-stale-p7-monitor

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_RUN: "37387148605"
    steps:
      - name: Force cancel obsolete reconciliation
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$TARGET_RUN" \
            | python -c 'import json,sys; print(json.load(sys.stdin).get("status",""))')"
          echo "target status=$status"
          if [ "$status" != "completed" ]; then
            curl --fail --silent --show-error \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$TARGET_RUN/force-cancel" \
              >/dev/null
            echo "Force cancellation requested for $TARGET_RUN"
          fi
