name: Cancel obsolete queued runs

on:
  push:
    branches:
      - ops/cancel-stale-p7-monitor

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Cancel obsolete workflow runs
        shell: bash
        run: |
          set -euo pipefail
          for run_id in 37383423157; do
            status="$(curl --fail --silent --show-error               -H "Authorization: Bearer $GH_TOKEN"               -H 'Accept: application/vnd.github+json'               "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$run_id"               | python -c 'import json,sys; print(json.load(sys.stdin).get("status",""))')"
            echo "$run_id status=$status"
            if [ "$status" != "completed" ]; then
              curl --fail --silent --show-error                 -X POST                 -H "Authorization: Bearer $GH_TOKEN"                 -H 'Accept: application/vnd.github+json'                 "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel"                 >/dev/null
              echo "Cancellation requested for $run_id"
            fi
          done
