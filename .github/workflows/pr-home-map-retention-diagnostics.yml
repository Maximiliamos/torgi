name: PR home map retention diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pr-home-map-retention-diagnostics.yml'

permissions:
  contents: read

concurrency:
  group: pr-home-map-retention-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64, bankrotai-home]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Inspect retained map datasets without writes
        shell: powershell
        run: |
          $script = @'
          import json
          from sqlalchemy import select
          from bankrotai.db import MapDataset, SessionLocal

          with SessionLocal() as session:
              rows = list(session.scalars(
                  select(MapDataset).order_by(MapDataset.id.desc()).limit(20)
              ))
              current = session.scalar(
                  select(MapDataset)
                  .where(MapDataset.is_current.is_(True), MapDataset.status == "ready")
                  .order_by(MapDataset.id.desc())
              )
              recent_ready = list(session.scalars(
                  select(MapDataset)
                  .where(MapDataset.status == "ready")
                  .order_by(MapDataset.id.desc())
                  .limit(5)
              ))
              failed_rows = list(session.scalars(
                  select(MapDataset)
                  .where(MapDataset.status == "failed")
                  .order_by(MapDataset.id.desc())
              ))
              failed_count = len(failed_rows)
              building_count = len(list(session.scalars(
                  select(MapDataset.id).where(MapDataset.status == "building")
              )))
              legacy_versions = (
                  "20260924T225230284059Z-s3",
                  "20260924T222246446795Z-s3",
                  "20260924T214633134097Z-s3",
                  "20260924T205816771500Z-s3",
                  "20260924T205000633559Z-s3",
                  "20260924T204308197270Z-s3",
              )
              legacy_rows = list(session.scalars(
                  select(MapDataset).where(MapDataset.version.in_(legacy_versions))
              ))
              print(json.dumps({
                  "current": None if current is None else {
                      "id": current.id,
                      "version": current.version,
                      "published_at": current.published_at,
                      "point_count": current.point_count,
                      "tile_count": current.tile_count,
                      "status": current.status,
                  },
                  "recent_ready": [{
                      "id": row.id,
                      "version": row.version,
                      "published_at": row.published_at,
                      "point_count": row.point_count,
                      "tile_count": row.tile_count,
                      "is_current": bool(row.is_current),
                  } for row in recent_ready],
                  "failed_count": failed_count,
                  "failed_versions": [row.version for row in failed_rows],
                  "building_count": building_count,
                  "legacy_db_rows": [{
                      "id": row.id,
                      "version": row.version,
                      "status": row.status,
                      "is_current": bool(row.is_current),
                      "published_at": row.published_at,
                  } for row in legacy_rows],
                  "recent": [{
                      "id": row.id,
                      "version": row.version,
                      "status": row.status,
                      "is_current": bool(row.is_current),
                      "published_at": row.published_at,
                      "point_count": row.point_count,
                      "tile_count": row.tile_count,
                  } for row in rows],
              }, default=str, ensure_ascii=False))
          '@
          $script | docker exec -i bankrotai-home-map-worker python -

      - name: Inspect seven-source run and archival aggregates without writes
        shell: powershell
        run: |
          $script = @'
          import json
          from datetime import datetime
          from sqlalchemy import func, select
          from bankrotai.db import LotSyncRun, LotSyncSourceRun, SessionLocal, SourceLot

          target_runs = (
              "3fd5f3bf-fbf5-4463-b402-86c8a40d5243",
              "79b84f12-b68b-49fb-a600-79de6438e027",
              "097bf5f9-9838-4bc6-a38b-5c660fdbde29",
          )
          cutoff = datetime(2026, 11, 7, 4, 0)
          with SessionLocal() as session:
              runs = list(session.scalars(
                  select(LotSyncRun).where(LotSyncRun.id.in_(target_runs))
              ))
              source_runs = list(session.scalars(
                  select(LotSyncSourceRun)
                  .where(LotSyncSourceRun.sync_run_id.in_(target_runs))
                  .order_by(LotSyncSourceRun.sync_run_id, LotSyncSourceRun.source_system)
              ))
              archives = list(session.execute(
                  select(
                      SourceLot.source_system,
                      SourceLot.archive_reason,
                      func.count(SourceLot.id),
                  )
                  .where(SourceLot.archived_at >= cutoff)
                  .group_by(SourceLot.source_system, SourceLot.archive_reason)
                  .order_by(SourceLot.source_system, SourceLot.archive_reason)
              ))
              active = list(session.execute(
                  select(SourceLot.source_system, func.count(SourceLot.id))
                  .where(SourceLot.is_active.is_(True), SourceLot.is_archived.is_(False))
                  .group_by(SourceLot.source_system)
                  .order_by(SourceLot.source_system)
              ))
              print(json.dumps({
                  "runs": [{
                      "id": row.id, "status": row.status,
                      "started_at": row.started_at, "finished_at": row.finished_at,
                      "error": row.error_message,
                  } for row in runs],
                  "source_runs": [{
                      "run_id": row.sync_run_id, "source": row.source_system,
                      "status": row.status, "complete": row.complete_source_run,
                      "pages": row.pages_scanned, "seen": row.items_seen,
                      "inserted": row.items_inserted, "updated": row.items_updated,
                      "unchanged": row.items_unchanged, "archived": row.items_archived,
                      "failed": row.items_failed,
                      "error": row.error_message,
                  } for row in source_runs],
                  "archives_since_2026_11_07_04_utc": [{
                      "source": source, "reason": reason, "count": count,
                  } for source, reason, count in archives],
                  "active_nonarchived_by_source": [
                      {"source": source, "count": count} for source, count in active
                  ],
              }, default=str, ensure_ascii=False))
          '@
          $script | docker exec -i bankrotai-home-ingestion-worker python -
