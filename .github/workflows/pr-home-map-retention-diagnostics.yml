name: PR home map retention diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pr-home-map-retention-diagnostics.yml'

permissions:
  contents: read

concurrency:
  group: pr-home-map-retention-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64, bankrotai-home]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Inspect retained map datasets without writes
        shell: powershell
        run: |
          $script = @'
          import json
          from sqlalchemy import select
          from bankrotai.db import MapDataset, SessionLocal

          with SessionLocal() as session:
              rows = list(session.scalars(
                  select(MapDataset).order_by(MapDataset.id.desc()).limit(20)
              ))
              current = session.scalar(
                  select(MapDataset)
                  .where(MapDataset.is_current.is_(True), MapDataset.status == "ready")
                  .order_by(MapDataset.id.desc())
              )
              recent_ready = list(session.scalars(
                  select(MapDataset)
                  .where(MapDataset.status == "ready")
                  .order_by(MapDataset.id.desc())
                  .limit(5)
              ))
              failed_rows = list(session.scalars(
                  select(MapDataset)
                  .where(MapDataset.status == "failed")
                  .order_by(MapDataset.id.desc())
              ))
              failed_count = len(failed_rows)
              building_count = len(list(session.scalars(
                  select(MapDataset.id).where(MapDataset.status == "building")
              )))
              legacy_versions = (
                  "20260924T225230284059Z-s3",
                  "20260924T222246446795Z-s3",
                  "20260924T214633134097Z-s3",
                  "20260924T205816771500Z-s3",
                  "20260924T205000633559Z-s3",
                  "20260924T204308197270Z-s3",
              )
              legacy_rows = list(session.scalars(
                  select(MapDataset).where(MapDataset.version.in_(legacy_versions))
              ))
              print(json.dumps({
                  "current": None if current is None else {
                      "id": current.id,
                      "version": current.version,
                      "published_at": current.published_at,
                      "point_count": current.point_count,
                      "tile_count": current.tile_count,
                      "status": current.status,
                  },
                  "recent_ready": [{
                      "id": row.id,
                      "version": row.version,
                      "published_at": row.published_at,
                      "point_count": row.point_count,
                      "tile_count": row.tile_count,
                      "is_current": bool(row.is_current),
                  } for row in recent_ready],
                  "failed_count": failed_count,
                  "failed_versions": [row.version for row in failed_rows],
                  "building_count": building_count,
                  "legacy_db_rows": [{
                      "id": row.id,
                      "version": row.version,
                      "status": row.status,
                      "is_current": bool(row.is_current),
                      "published_at": row.published_at,
                  } for row in legacy_rows],
                  "recent": [{
                      "id": row.id,
                      "version": row.version,
                      "status": row.status,
                      "is_current": bool(row.is_current),
                      "published_at": row.published_at,
                      "point_count": row.point_count,
                      "tile_count": row.tile_count,
                  } for row in rows],
              }, default=str, ensure_ascii=False))
          '@
          $script | docker exec -i bankrotai-home-map-worker python -
