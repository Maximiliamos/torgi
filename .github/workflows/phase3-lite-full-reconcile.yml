name: Phase 3 Lite full source reconciliation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase3-lite-full-reconcile.yml'

permissions:
  actions: read
  contents: read

concurrency:
  group: phase3-lite-full-reconcile
  cancel-in-progress: false

jobs:
  wait-home-deploy:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Wait for the same main revision on the home origin
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 160); do
            state="$(curl --fail --silent --show-error               -H "Authorization: Bearer $GH_TOKEN"               -H 'Accept: application/vnd.github+json'               "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&event=push&per_page=50"               | python -c 'import json,sys; runs=json.load(sys.stdin).get("workflow_runs", []); r=next((x for x in runs if x.get("name")=="Deploy home secondary origin"), None); print("missing" if r is None else "{}:{}".format(r.get("status"), r.get("conclusion")))')"
            if [ "$state" = "completed:success" ]; then exit 0; fi
            case "$state" in
              completed:*) echo "Home deploy failed: $state" >&2; exit 1 ;;
            esac
            sleep 15
          done
          echo "Timed out waiting for home deployment of $GITHUB_SHA" >&2
          exit 1

  reconcile:
    needs: wait-home-deploy
    runs-on: [self-hosted, Windows, X64, bankrotai-home]
    timeout-minutes: 90
    steps:
      - name: Require canonical ingestion worker
        shell: powershell
        run: |
          $container = docker ps --filter 'name=^/bankrotai-home-ingestion-worker$' --format '{{.Names}}'
          if ($container -ne 'bankrotai-home-ingestion-worker') {
            throw 'Canonical home ingestion worker is not running'
          }
      - name: Request one durable full reconciliation
        id: start
        shell: powershell
        run: |
          $runId = docker exec bankrotai-home-ingestion-worker python -c "from bankrotai.tasks import schedule_nationwide_lot_sync; print(schedule_nationwide_lot_sync(triggered_by='phase3-lite', mode='full'))"
          if ($LASTEXITCODE -ne 0 -or -not $runId) { throw 'Could not queue full reconciliation' }
          $runId = ($runId | Select-Object -Last 1).Trim()
          "run_id=$runId" >> $env:GITHUB_OUTPUT
          Write-Output "Queued durable full reconciliation run $runId"
      - name: Wait for full reconciliation to finish
        shell: powershell
        env:
          RUN_ID: ${{ steps.start.outputs.run_id }}
        run: |
          $deadline = (Get-Date).ToUniversalTime().AddMinutes(45)
          do {
            $json = docker exec bankrotai-home-ingestion-worker python -c "import json, os; from bankrotai.db import SessionLocal, LotSyncRun, LotSyncSourceRun; s=SessionLocal(); run=s.get(LotSyncRun, os.environ['PHASE3_RUN_ID']); rows=s.query(LotSyncSourceRun).filter_by(sync_run_id=os.environ['PHASE3_RUN_ID']).all(); print(json.dumps({'status':None if run is None else run.status,'error':None if run is None else run.error_message,'sources':[{'source':x.source_system,'status':x.status,'complete':x.complete_source_run,'error':x.error_message} for x in rows]}, default=str)); s.close()" --env PHASE3_RUN_ID=$env:RUN_ID
            if ($LASTEXITCODE -ne 0) { throw 'Could not query full reconciliation state' }
            $state = ($json | Select-Object -Last 1) | ConvertFrom-Json
            $state | ConvertTo-Json -Depth 8
            if ($state.status -in @('success','partial')) {
              $rows = @($state.sources)
              if ($rows.Count -lt 5) { throw "Full reconciliation ended without all configured source runs: $($rows.Count)/5" }
              if (@($rows | Where-Object { $_.status -in @('queued','running') }).Count -gt 0) {
                throw 'Full reconciliation left a source run active'
              }
              exit 0
            }
            if ($state.status -eq 'failed') {
              throw "Full reconciliation failed: $($state.error)"
            }
            Start-Sleep -Seconds 20
          } while ((Get-Date).ToUniversalTime() -lt $deadline)
          throw 'Full reconciliation did not reach a terminal state within 45 minutes'
