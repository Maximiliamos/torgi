name: Phase 3 Lite full source reconciliation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase3-lite-full-reconcile.yml'
      - '.github/workflows/home-secondary-deploy.yml'
      - 'src/bankrotai/services/map_builder.py'
      - 'src/bankrotai/services/ingestion.py'
      - 'src/bankrotai/torgi_russia.py'
      - 'src/bankrotai/connectors/registry/torgi_russia.py'

permissions:
  actions: read
  contents: read

concurrency:
  group: phase3-lite-full-reconcile
  cancel-in-progress: false

jobs:
  wait-home-deploy:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Wait for the same main revision on the home origin
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 1120); do
            state="$(curl --fail --silent --show-error               -H "Authorization: Bearer $GH_TOKEN"               -H 'Accept: application/vnd.github+json'               "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&event=push&per_page=50"               | python -c 'import json,sys; runs=json.load(sys.stdin).get("workflow_runs", []); r=next((x for x in runs if x.get("name")=="Deploy home secondary origin"), None); print("missing" if r is None else "{}:{}".format(r.get("status"), r.get("conclusion")))')"
            if [ "$state" = "completed:success" ]; then exit 0; fi
            case "$state" in
              completed:*) echo "Home deploy failed: $state" >&2; exit 1 ;;
            esac
            sleep 15
          done
          echo "Timed out waiting for home deployment of $GITHUB_SHA after extended runner backlog allowance" >&2
          exit 1

  reconcile:
    needs: wait-home-deploy
    runs-on: [self-hosted, Windows, X64, bankrotai-home]
    timeout-minutes: 240
    steps:
      - name: Require canonical ingestion worker
        shell: powershell
        run: |
          $container = docker ps --filter 'name=^/bankrotai-home-ingestion-worker$' --format '{{.Names}}'
          if ($container -ne 'bankrotai-home-ingestion-worker') {
            throw 'Canonical home ingestion worker is not running'
          }
      - name: Request or adopt one durable full reconciliation and reclaim expired lease
        id: start
        shell: powershell
        run: |
          $probe = @'
          import json
          from bankrotai.db import LotSyncRun, SessionLocal
          from bankrotai.services.ingestion import SyncAlreadyRunningError, default_source_specs
          from bankrotai.tasks import _unpaused_source_specs, schedule_nationwide_lot_sync

          configured_specs = _unpaused_source_specs(default_source_specs())
          configured_sources = [spec.source_id for spec in configured_specs]
          configured_count = len(configured_specs)
          # create_run() transactionally marks expired queued/running leases failed before scheduling.
          try:
              run_id = schedule_nationwide_lot_sync(triggered_by="phase3-lite", mode="full")
              print(json.dumps({
                  "state": "queued",
                  "run_id": run_id,
                  "configured_source_count": configured_count,
                  "configured_sources": configured_sources,
              }))
          except SyncAlreadyRunningError as exc:
              session = SessionLocal()
              try:
                  run = session.get(LotSyncRun, exc.run_id)
                  print(json.dumps({
                      "state": "busy",
                      "run_id": exc.run_id,
                      "status": None if run is None else run.status,
                      "trigger_type": None if run is None else run.trigger_type,
                      "total_sources": None if run is None else run.total_sources,
                      "configured_source_count": configured_count,
                      "configured_sources": configured_sources,
                  }))
              finally:
                  session.close()
          '@

          $deadline = (Get-Date).ToUniversalTime().AddMinutes(45)
          $selectedRunId = $null
          do {
            $json = $probe | docker exec -i bankrotai-home-ingestion-worker python -
            if ($LASTEXITCODE -ne 0 -or -not $json) {
              throw 'Could not inspect or queue full reconciliation'
            }
            $state = ($json | Select-Object -Last 1) | ConvertFrom-Json
            $state | ConvertTo-Json -Depth 6

            if ($state.state -eq 'queued') {
              $selectedRunId = [string]$state.run_id
              Write-Output "Queued durable full reconciliation run $selectedRunId"
              break
            }

            if ($state.state -eq 'busy') {
              $isFull = (
                $state.trigger_type -in @('manual_full', 'scheduled_full') -and
                [int]$state.total_sources -eq [int]$state.configured_source_count
              )
              if ($isFull -and $state.status -in @('queued', 'running')) {
                $selectedRunId = [string]$state.run_id
                Write-Output "Adopting already-active full reconciliation run $selectedRunId"
                break
              }
              Write-Output "Waiting for active non-full sync $($state.run_id) ($($state.trigger_type), $($state.status))"
              Start-Sleep -Seconds 15
              continue
            }

            throw "Unexpected reconciliation scheduling state: $($state.state)"
          } while ((Get-Date).ToUniversalTime() -lt $deadline)

          if (-not $selectedRunId) {
            throw 'Could not obtain a durable full reconciliation within 45 minutes'
          }
          "run_id=$selectedRunId" >> $env:GITHUB_OUTPUT
      - name: Wait for full reconciliation to finish
        shell: powershell
        env:
          RUN_ID: ${{ steps.start.outputs.run_id }}
        run: |
          function Convert-DbUtc([string]$Value) {
            if (-not $Value) { return $null }
            return [datetime]::Parse(
              $Value,
              [System.Globalization.CultureInfo]::InvariantCulture,
              [System.Globalization.DateTimeStyles]::AssumeUniversal -bor [System.Globalization.DateTimeStyles]::AdjustToUniversal
            )
          }

          $deadline = $null
          do {
            $json = docker exec --env "PHASE3_RUN_ID=$env:RUN_ID" bankrotai-home-ingestion-worker python -c "import json, os; from bankrotai.db import SessionLocal, LotSyncRun, LotSyncSourceRun; from bankrotai.services.ingestion import default_source_specs; from bankrotai.tasks import _unpaused_source_specs; s=SessionLocal(); run=s.get(LotSyncRun, os.environ['PHASE3_RUN_ID']); rows=s.query(LotSyncSourceRun).filter_by(sync_run_id=os.environ['PHASE3_RUN_ID']).all(); configured=[x.source_id for x in _unpaused_source_specs(default_source_specs())]; print(json.dumps({'status':None if run is None else run.status,'error':None if run is None else run.error_message,'heartbeat_at':None if run is None else run.heartbeat_at,'lease_expires_at':None if run is None else run.lease_expires_at,'configured_source_count':len(configured),'configured_sources':configured,'sources':[{'source':x.source_system,'status':x.status,'complete':x.complete_source_run,'pages_scanned':x.pages_scanned,'items_seen':x.items_seen,'items_inserted':x.items_inserted,'items_updated':x.items_updated,'items_unchanged':x.items_unchanged,'items_archived':x.items_archived,'items_failed':x.items_failed,'duplicates_merged':x.duplicates_merged,'progress_at':x.progress_at,'checkpoint':x.checkpoint_json,'error':x.error_message} for x in rows]}, default=str)); s.close()"
            if ($LASTEXITCODE -ne 0) { throw 'Could not query full reconciliation state' }
            $state = ($json | Select-Object -Last 1) | ConvertFrom-Json
            $state | ConvertTo-Json -Depth 8
            if ($state.status -in @('queued','running')) {
              if (-not $state.heartbeat_at -or -not $state.lease_expires_at) {
                throw 'Active reconciliation is missing heartbeat/lease evidence'
              }
              $heartbeat = Convert-DbUtc ([string]$state.heartbeat_at)
              $leaseExpiry = Convert-DbUtc ([string]$state.lease_expires_at)
              if ($leaseExpiry -le (Get-Date).ToUniversalTime()) {
                throw "Full reconciliation lease expired at $leaseExpiry"
              }
              $leaseWindowSeconds = [math]::Max(1, ($leaseExpiry - $heartbeat).TotalSeconds)
              $progressTimes = @($state.sources | Where-Object { $_.progress_at } | ForEach-Object {
                Convert-DbUtc ([string]$_.progress_at)
              })
              $latestProgress = if ($progressTimes.Count -gt 0) {
                $progressTimes | Sort-Object -Descending | Select-Object -First 1
              } else {
                $heartbeat
              }
              $deadline = $latestProgress.AddSeconds($leaseWindowSeconds * 2)
              if ((Get-Date).ToUniversalTime() -ge $deadline) {
                throw "Full reconciliation stalled: no durable source progress since $latestProgress"
              }
            }
            if ($state.status -in @('success','partial')) {
              $rows = @($state.sources)
              $expectedSources = @($state.configured_sources)
              $observedSources = @($rows | ForEach-Object { [string]$_.source })
              $missingSources = @($expectedSources | Where-Object { $_ -notin $observedSources })
              $unexpectedSources = @($observedSources | Where-Object { $_ -notin $expectedSources })
              if ($missingSources.Count -gt 0 -or $unexpectedSources.Count -gt 0) {
                throw "Full reconciliation source set mismatch: missing=$($missingSources -join ',') unexpected=$($unexpectedSources -join ',')"
              }
              if ($rows.Count -ne [int]$state.configured_source_count) {
                throw "Full reconciliation ended with wrong source-run count: $($rows.Count)/$($state.configured_source_count)"
              }
              if (@($rows | Where-Object { $_.status -in @('queued','running') }).Count -gt 0) {
                throw 'Full reconciliation left a source run active'
              }
              if ('tbankrot.ru' -in $expectedSources -or @($observedSources | Where-Object { $_ -eq 'tbankrot.ru' }).Count -gt 0) {
                throw 'TBankrot must remain paused and absent from automatic full reconciliation'
              }
              $incompleteRows = @($rows | Where-Object { $_.status -ne 'success' -or -not [bool]$_.complete })
              if ($incompleteRows.Count -gt 0) {
                $retryDeadline = (Get-Date).ToUniversalTime().AddMinutes(85)
                $latestRetryFinishedAt = $null
                foreach ($failedRow in @($incompleteRows)) {
                  $source = [string]$failedRow.source
                  if (-not $source -or $source -eq 'tbankrot.ru') {
                    throw "Refusing targeted retry for invalid or paused source: $source"
                  }

                  $retryRunId = $null
                  do {
                    $retryProbe = @'
          import json
          import os
          from bankrotai.services.ingestion import SyncAlreadyRunningError
          from bankrotai.tasks import schedule_nationwide_lot_sync

          source = os.environ["PHASE3_RETRY_SOURCE"]
          try:
              run_id = schedule_nationwide_lot_sync(
                  triggered_by="phase3-lite-targeted-retry",
                  mode=f"source:{source}",
              )
              print(json.dumps({"state": "queued", "run_id": run_id}))
          except SyncAlreadyRunningError as exc:
              print(json.dumps({"state": "busy", "run_id": exc.run_id}))
          '@
                    $retryJson = $retryProbe | docker exec -i --env "PHASE3_RETRY_SOURCE=$source" bankrotai-home-ingestion-worker python -
                    if ($LASTEXITCODE -ne 0 -or -not $retryJson) {
                      throw "Could not queue targeted retry for $source"
                    }
                    $retryQueueState = ($retryJson | Select-Object -Last 1) | ConvertFrom-Json
                    if ($retryQueueState.state -eq 'queued') {
                      $retryRunId = [string]$retryQueueState.run_id
                      Write-Output "Queued targeted full retry for $source as $retryRunId"
                      break
                    }
                    if ($retryQueueState.state -eq 'busy') {
                      Write-Output "Waiting for active sync $($retryQueueState.run_id) before targeted retry of $source"
                      Start-Sleep -Seconds 15
                      continue
                    }
                    throw "Unexpected targeted retry queue state for ${source}: $($retryQueueState.state)"
                  } while ((Get-Date).ToUniversalTime() -lt $retryDeadline)

                  if (-not $retryRunId) {
                    throw "Could not obtain targeted retry run for $source within retry deadline"
                  }

                  $retryState = $null
                  $retryProgressDeadline = $null
                  do {
                    $retryJson = docker exec --env "PHASE3_RETRY_RUN_ID=$retryRunId" bankrotai-home-ingestion-worker python -c "import json, os; from bankrotai.db import SessionLocal, LotSyncRun, LotSyncSourceRun; s=SessionLocal(); run=s.get(LotSyncRun, os.environ['PHASE3_RETRY_RUN_ID']); rows=s.query(LotSyncSourceRun).filter_by(sync_run_id=os.environ['PHASE3_RETRY_RUN_ID']).all(); print(json.dumps({'status':None if run is None else run.status,'error':None if run is None else run.error_message,'finished_at':None if run is None else run.finished_at,'heartbeat_at':None if run is None else run.heartbeat_at,'lease_expires_at':None if run is None else run.lease_expires_at,'sources':[{'source':x.source_system,'status':x.status,'complete':x.complete_source_run,'pages_scanned':x.pages_scanned,'items_seen':x.items_seen,'items_inserted':x.items_inserted,'items_updated':x.items_updated,'items_unchanged':x.items_unchanged,'items_archived':x.items_archived,'items_failed':x.items_failed,'duplicates_merged':x.duplicates_merged,'progress_at':x.progress_at,'checkpoint':x.checkpoint_json,'error':x.error_message} for x in rows]}, default=str)); s.close()"
                    if ($LASTEXITCODE -ne 0 -or -not $retryJson) {
                      throw "Could not inspect targeted retry $retryRunId for $source"
                    }
                    $retryState = ($retryJson | Select-Object -Last 1) | ConvertFrom-Json
                    if ($retryState.status -in @('queued','running')) {
                      if (-not $retryState.heartbeat_at -or -not $retryState.lease_expires_at) {
                        throw "Targeted retry $retryRunId for $source is missing heartbeat/lease evidence"
                      }
                      $retryHeartbeat = Convert-DbUtc ([string]$retryState.heartbeat_at)
                      $retryLeaseExpiry = Convert-DbUtc ([string]$retryState.lease_expires_at)
                      if ($retryLeaseExpiry -le (Get-Date).ToUniversalTime()) {
                        throw "Targeted retry $retryRunId for $source lost its lease"
                      }
                      $retryLeaseWindowSeconds = [math]::Max(1, ($retryLeaseExpiry - $retryHeartbeat).TotalSeconds)
                      $retryProgressTimes = @($retryState.sources | Where-Object { $_.progress_at } | ForEach-Object {
                        Convert-DbUtc ([string]$_.progress_at)
                      })
                      $retryLatestProgress = if ($retryProgressTimes.Count -gt 0) {
                        $retryProgressTimes | Sort-Object -Descending | Select-Object -First 1
                      } else {
                        $retryHeartbeat
                      }
                      $retryProgressDeadline = $retryLatestProgress.AddSeconds($retryLeaseWindowSeconds * 2)
                      if ((Get-Date).ToUniversalTime() -ge $retryProgressDeadline) {
                        throw "Targeted retry for $source stalled: no durable progress since $retryLatestProgress"
                      }
                    }
                    if ($retryState.status -eq 'success') {
                      $retryRows = @($retryState.sources)
                      if ($retryRows.Count -ne 1 -or [string]$retryRows[0].source -ne $source -or $retryRows[0].status -ne 'success' -or -not [bool]$retryRows[0].complete) {
                        throw "Targeted retry for $source did not finish as one complete successful source"
                      }
                      $rows = @($rows | Where-Object { [string]$_.source -ne $source }) + @($retryRows)
                      if ($retryState.finished_at) {
                        $finished = Convert-DbUtc ([string]$retryState.finished_at)
                        if ($null -eq $latestRetryFinishedAt -or $finished -gt $latestRetryFinishedAt) {
                          $latestRetryFinishedAt = $finished
                        }
                      }
                      Write-Output "Targeted retry for $source completed successfully"
                      break
                    }
                    if ($retryState.status -eq 'failed') {
                      $sourceErrors = @($retryState.sources | Where-Object { $_.error } | ForEach-Object { "$($_.source): $($_.error)" })
                      throw "Targeted retry for $source failed: run_error=$($retryState.error) source_errors=$($sourceErrors -join '; ')"
                    }
                    Start-Sleep -Seconds 20
                  } while ($null -eq $retryProgressDeadline -or (Get-Date).ToUniversalTime() -lt $retryProgressDeadline)

                  if ($null -eq $retryState -or $retryState.status -ne 'success') {
                    throw "Targeted retry for $source stalled before reaching success"
                  }
                }

                $incompleteRows = @($rows | Where-Object { $_.status -ne 'success' -or -not [bool]$_.complete })
                if ($incompleteRows.Count -gt 0) {
                  $failedSummary = @($incompleteRows | ForEach-Object { "$($_.source):status=$($_.status),complete=$($_.complete),error=$($_.error)" })
                  throw "Final 4/4 gate failed after targeted retries: $($failedSummary -join '; ')"
                }

                # A retry is a separate durable run. Force one immutable map
                # publication after the final accepted source state so the
                # acceptance chain is explicitly 4/4 -> MapDataset -> S3.
                if ($null -ne $latestRetryFinishedAt) {
                  $mapTaskId = docker exec bankrotai-home-map-worker python -c "from bankrotai.tasks import build_map_dataset_task; r=build_map_dataset_task.delay(); print(r.id)"
                  if ($LASTEXITCODE -ne 0 -or -not $mapTaskId) {
                    throw 'Could not queue post-retry MapDataset publication'
                  }
                  $mapDeadline = (Get-Date).ToUniversalTime().AddMinutes(20)
                  do {
                    $mapJson = docker exec bankrotai-home-map-worker python -c "import json; from sqlalchemy import select; from bankrotai.db import SessionLocal,MapDataset; s=SessionLocal(); d=s.scalar(select(MapDataset).where(MapDataset.is_current.is_(True),MapDataset.status=='ready')); print(json.dumps(None if d is None else {'version':d.version,'published_at':d.published_at}, default=str)); s.close()"
                    if ($LASTEXITCODE -ne 0 -or -not $mapJson) {
                      throw 'Could not inspect forced post-retry MapDataset publication'
                    }
                    $mapState = ($mapJson | Select-Object -Last 1) | ConvertFrom-Json
                    if ($null -ne $mapState -and $mapState.published_at) {
                      $published = Convert-DbUtc ([string]$mapState.published_at)
                      if ($published -ge $latestRetryFinishedAt) {
                        Write-Output "Post-retry MapDataset $($mapState.version) published after final retry"
                        break
                      }
                    }
                    Start-Sleep -Seconds 10
                  } while ((Get-Date).ToUniversalTime() -lt $mapDeadline)
                  if ($null -eq $mapState -or -not $mapState.published_at -or (Convert-DbUtc ([string]$mapState.published_at)) -lt $latestRetryFinishedAt) {
                    throw 'Post-retry MapDataset was not promoted within 20 minutes'
                  }
                }
              }
              $torgiRussia = @($rows | Where-Object { $_.source -eq 'torgi-russia.ru' }) | Select-Object -First 1
              if ($null -eq $torgiRussia -or [int64]$torgiRussia.items_seen -le 0) {
                throw "Torgi Russia production parser returned no lots"
              }
              @(
                "## Final source reconciliation",
                "",
                "| Source | Status | Complete | Pages | Seen | Inserted | Updated | Unchanged | Archived | Failed |",
                "|---|---|---:|---:|---:|---:|---:|---:|---:|---:|"
              ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
              foreach ($row in ($rows | Sort-Object source)) {
                "| $($row.source) | $($row.status) | $($row.complete) | $($row.pages_scanned) | $($row.items_seen) | $($row.items_inserted) | $($row.items_updated) | $($row.items_unchanged) | $($row.items_archived) | $($row.items_failed) |" |
                  Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
              }
              exit 0
            }
            if ($state.status -eq 'failed') {
              throw "Full reconciliation failed: $($state.error)"
            }
            Start-Sleep -Seconds 20
          } while ($null -eq $deadline -or (Get-Date).ToUniversalTime() -lt $deadline)
          throw 'Full reconciliation stalled before reaching a terminal state'

      - name: Verify post-reconciliation MapDataset and REG.RU S3 manifest
        shell: powershell
        env:
          RUN_ID: ${{ steps.start.outputs.run_id }}
        run: |
          $deadline = (Get-Date).ToUniversalTime().AddMinutes(20)
          $selected = $null
          do {
            $json = docker exec --env "PHASE3_RUN_ID=$env:RUN_ID" bankrotai-home-map-worker python -c "import json, os; from sqlalchemy import select; from bankrotai.db import SessionLocal, LotSyncRun, LotSyncSourceRun, MapDataset; s=SessionLocal(); run=s.get(LotSyncRun, os.environ['PHASE3_RUN_ID']); rows=s.query(LotSyncSourceRun).filter_by(sync_run_id=os.environ['PHASE3_RUN_ID']).all(); current=s.scalar(select(MapDataset).where(MapDataset.is_current.is_(True), MapDataset.status=='ready')); result=(run.result_json or {}) if run is not None else {}; build=(result.get('map_dataset_build') or {}); changed=bool(int(result.get('expired_after_auction') or 0) or any(int(x.items_inserted or 0) or int(x.items_updated or 0) or int(x.items_archived or 0) or int(x.duplicates_merged or 0) for x in rows)); fresh=bool(run is not None and run.finished_at is not None and current is not None and current.published_at is not None and current.published_at >= run.finished_at); print(json.dumps({'run_status':None if run is None else run.status,'run_finished_at':None if run is None else run.finished_at,'map_affecting_changes':changed,'map_build':build,'dataset':None if current is None else {'version':current.version,'status':current.status,'published_at':current.published_at,'point_count':current.point_count,'tile_count':current.tile_count},'fresh_after_run':fresh}, default=str)); s.close()"
            if ($LASTEXITCODE -ne 0 -or -not $json) {
              throw 'Could not inspect post-reconciliation map state'
            }
            $state = ($json | Select-Object -Last 1) | ConvertFrom-Json
            $state | ConvertTo-Json -Depth 8
            if ($null -eq $state.dataset) {
              Start-Sleep -Seconds 10
              continue
            }

            $buildStatus = [string]$state.map_build.status
            if (-not [bool]$state.map_affecting_changes) {
              $selected = $state.dataset
              break
            }
            if ($buildStatus -eq 'schedule_failed') {
              throw "Map dataset scheduling failed after reconciliation: $($state.map_build.error)"
            }
            if ([bool]$state.fresh_after_run) {
              $selected = $state.dataset
              break
            }
            Start-Sleep -Seconds 10
          } while ((Get-Date).ToUniversalTime() -lt $deadline)

          if ($null -eq $selected) {
            throw 'A post-reconciliation map dataset was not promoted within 20 minutes'
          }

          $verify = docker exec --env "PHASE3_MAP_VERSION=$($selected.version)" bankrotai-home-map-worker python -c "import json, os; from sqlalchemy import select; from bankrotai.core import get_settings; from bankrotai.db import SessionLocal, MapDataset; from bankrotai.services.map_dataset_version import MAP_DATASET_REVISION; from bankrotai.services.map_object_store import _verify_public_manifest; s=SessionLocal(); d=s.scalar(select(MapDataset).where(MapDataset.is_current.is_(True), MapDataset.status=='ready')); assert d is not None; assert d.version == os.environ['PHASE3_MAP_VERSION'], (d.version, os.environ['PHASE3_MAP_VERSION']); m=_verify_public_manifest(get_settings(), d.version); assert m.get('version') == d.version, (m.get('version'), d.version); assert m.get('pipeline_revision') == MAP_DATASET_REVISION, (m.get('pipeline_revision'), MAP_DATASET_REVISION); assert int(m.get('point_count', -1)) == int(d.point_count), (m.get('point_count'), d.point_count); assert int(m.get('tile_count', -1)) == int(d.tile_count), (m.get('tile_count'), d.tile_count); print(json.dumps({'version':d.version,'point_count':d.point_count,'tile_count':d.tile_count,'pipeline_revision':MAP_DATASET_REVISION,'public_manifest_verified':True}, default=str)); s.close()"
          if ($LASTEXITCODE -ne 0 -or -not $verify) {
            throw 'DB MapDataset and public REG.RU S3 manifest verification failed'
          }
          $verified = ($verify | Select-Object -Last 1) | ConvertFrom-Json
          $verified | ConvertTo-Json -Depth 6
          @(
            "",
            "## Map publication proof",
            "",
            "- version: $($verified.version)",
            "- point_count: $($verified.point_count)",
            "- tile_count: $($verified.tile_count)",
            "- pipeline_revision: $($verified.pipeline_revision)",
            "- public_manifest_verified: $($verified.public_manifest_verified)"
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

