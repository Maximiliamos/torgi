name: Phase 3 Lite production health

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/phase3-lite-health.yml"
      - "src/bankrotai/services/lot_issue_report_export.py"
  schedule:
    - cron: '17,47 * * * *'
  workflow_run:
    workflows: ['Deploy home secondary origin', 'Phase 3 Lite full source reconciliation']
    types: [completed]

permissions:
  contents: read
  issues: write

concurrency:
  group: phase3-lite-production-health
  cancel-in-progress: true

jobs:
  inspect:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, Windows, X64, bankrotai-home]
    timeout-minutes: 15
    outputs:
      warning_count: ${{ steps.health.outputs.warning_count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run Phase 3 production health
        id: health
        shell: powershell
        run: |
          .\scripts\phase3-production-health.ps1 `
            -OutputPath "$env:RUNNER_TEMP\phase3-health.json"
          $report = Get-Content -LiteralPath "$env:RUNNER_TEMP\phase3-health.json" -Raw | ConvertFrom-Json
          "warning_count=$([int]$report.warning_count)" >> $env:GITHUB_OUTPUT
      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: phase3-health-${{ github.run_id }}
          path: ${{ runner.temp }}\phase3-health.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Export developer lot issue reports read-only
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $inside = '/tmp/lot-issue-reports.json'
          $insideScript = '/tmp/lot-issue-report-export.py'
          $outside = Join-Path $env:RUNNER_TEMP 'lot-issue-reports.json'
          $source = Join-Path $env:GITHUB_WORKSPACE 'src\bankrotai\services\lot_issue_report_export.py'
          if (-not (Test-Path -LiteralPath $source)) { throw 'Exporter source is missing from checkout' }
          docker cp $source "bankrotai-home-ingestion-worker:$insideScript"
          if ($LASTEXITCODE -ne 0) { throw 'Could not stage exporter source in worker tmpfs' }
          docker exec bankrotai-home-ingestion-worker python $insideScript --limit 200 --output $inside
          if ($LASTEXITCODE -ne 0) { throw 'Read-only report export failed' }
          docker cp "bankrotai-home-ingestion-worker:$inside" $outside
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $outside)) {
            throw 'Could not copy report export from worker'
          }
          docker exec bankrotai-home-ingestion-worker python -c "import os; [os.remove(p) for p in (r'/tmp/lot-issue-reports.json', r'/tmp/lot-issue-report-export.py') if os.path.exists(p)]"
      - name: Upload developer lot issue reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lot-issue-reports-${{ github.run_id }}
          path: ${{ runner.temp }}\lot-issue-reports.json
          if-no-files-found: error
          retention-days: 3

  alert:
    needs: inspect
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const title = '[Phase 3] Production health alert';
            const body = `Phase 3 Lite production health failed.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nThe health report artifact contains container, API, source freshness, GEO, map and backup checks.`;
            const {data: issues} = await github.rest.issues.listForRepo({...context.repo, state: 'open', per_page: 100});
            const existing = issues.find(issue => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({...context.repo, issue_number: existing.number, body});
            } else {
              await github.rest.issues.create({...context.repo, title, body});
            }

  recovery:
    needs: inspect
    if: success()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const title = '[Phase 3] Production health alert';
            const {data: issues} = await github.rest.issues.listForRepo({...context.repo, state: 'open', per_page: 100});
            const existing = issues.find(issue => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({...context.repo, issue_number: existing.number, body: `Recovered on run ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}.`});
              await github.rest.issues.update({...context.repo, issue_number: existing.number, state: 'closed'});
            }


  source-warning:
    needs: inspect
    if: needs.inspect.result == 'success' && needs.inspect.outputs.warning_count != '0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const title = '[Phase 3] Source health warning';
            const body = `Production is up, but Phase 3 reported ${{ needs.inspect.outputs.warning_count }} degraded source freshness/coverage warning(s).\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const {data: issues} = await github.rest.issues.listForRepo({...context.repo, state: 'open', per_page: 100});
            const existing = issues.find(issue => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({...context.repo, issue_number: existing.number, body});
            } else {
              await github.rest.issues.create({...context.repo, title, body});
            }

  source-warning-recovery:
    needs: inspect
    if: needs.inspect.result == 'success' && needs.inspect.outputs.warning_count == '0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const title = '[Phase 3] Source health warning';
            const {data: issues} = await github.rest.issues.listForRepo({...context.repo, state: 'open', per_page: 100});
            const existing = issues.find(issue => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({...context.repo, issue_number: existing.number, body: `Source freshness/coverage recovered on run ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}.`});
              await github.rest.issues.update({...context.repo, issue_number: existing.number, state: 'closed'});
            }
