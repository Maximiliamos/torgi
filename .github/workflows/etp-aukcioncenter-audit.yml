name: ETP AukcionCenter read-only audit

on:
  pull_request:
    paths:
      - "scripts/etp_aukcioncenter_audit.py"
      - ".github/workflows/etp-aukcioncenter-audit.yml"
      - "src/bankrotai/connectors/etp_sources/**"
      - "tests/test_etp_aukcioncenter_contract.py"

concurrency:
  group: etp-aukcioncenter-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  readonly-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # pinned
        with:
          python-version: "3.11"
      - name: Install project and focused-test dependencies
        run: python -m pip install --disable-pip-version-check -e . pytest
      - name: Run focused AukcionCenter contract tests
        run: PYTHONPATH=src pytest -q tests/test_etp_aukcioncenter_contract.py
      - name: Run two-pass AukcionCenter source-contract probe
        run: |
          python scripts/etp_aukcioncenter_audit.py --details 30 --pause 0.35 --output aukcioncenter-audit.json
      - name: Upload sanitized audit evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # pinned
        with:
          name: aukcioncenter-readonly-audit
          path: aukcioncenter-audit.json
          if-no-files-found: error
          retention-days: 7
