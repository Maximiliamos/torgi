name: Managed stale NSPD recovery

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Lots per batch (1-100)"
        required: true
        default: "100"
        type: number
      max_batches:
        description: "Maximum sequential batches (1-20)"
        required: true
        default: "1"
        type: number
      apply:
        description: "Persist live-proven coordinates and advance the recovery cursor"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: home-secondary-production
  cancel-in-progress: false

jobs:
  recover:
    runs-on: [self-hosted, Windows, X64, bankrotai-home]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Require exact deployed Home revision and safe limits
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $batchSize = [int]"${{ inputs.batch_size }}"
          $maxBatches = [int]"${{ inputs.max_batches }}"
          if ($batchSize -lt 1 -or $batchSize -gt 100) { throw 'batch_size must be 1..100' }
          if ($maxBatches -lt 1 -or $maxBatches -gt 20) { throw 'max_batches must be 1..20' }
          $name = docker ps --filter 'name=^/bankrotai-home-geocoding-worker$' --format '{{.Names}}'
          if ($name -ne 'bankrotai-home-geocoding-worker') { throw 'Canonical GEO worker is not running' }
          $image = docker inspect bankrotai-home-geocoding-worker --format '{{.Config.Image}}'
          if ($image -notmatch $env:GITHUB_SHA) {
            throw "Home GEO worker is not on workflow SHA $env:GITHUB_SHA; refusing recovery"
          }
          $freeGb = (Get-PSDrive C).Free / 1GB
          if ($freeGb -lt 10) { throw "C: has only $freeGb GB free" }
          Write-Output "Managed recovery preflight PASS: image=$image disk_free_gb=$freeGb"

      - name: Run bounded resumable recovery
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $batchSize = [int]"${{ inputs.batch_size }}"
          $maxBatches = [int]"${{ inputs.max_batches }}"
          $apply = "${{ inputs.apply }}" -eq "true"
          if (-not $apply) { $maxBatches = 1 }

          $evidence = "$env:RUNNER_TEMP\managed-stale-nspd-recovery.jsonl"
          New-Item -ItemType File -Force -Path $evidence | Out-Null

          foreach ($batch in 1..$maxBatches) {
            $args = @(
              'exec',
              'bankrotai-home-geocoding-worker',
              'python',
              '-m',
              'bankrotai.services.managed_stale_cadastral_recovery',
              '--batch-size',
              [string]$batchSize
            )
            if ($apply) { $args += '--apply' }

            $previous = $ErrorActionPreference
            $ErrorActionPreference = 'Continue'
            $output = & docker @args 2>&1
            $exitCode = $LASTEXITCODE
            $ErrorActionPreference = $previous

            $output | ForEach-Object { Write-Output $_ }
            $jsonLine = @($output | ForEach-Object { "$_" } | Where-Object { $_.TrimStart().StartsWith('{') }) | Select-Object -Last 1
            if (-not $jsonLine) {
              throw "Managed recovery batch $batch produced no JSON result"
            }
            Add-Content -LiteralPath $evidence -Value $jsonLine -Encoding utf8
            $state = $jsonLine | ConvertFrom-Json

            Write-Output ("Managed GEO batch={0} status={1} source={2} selected={3} accepted={4} updated={5} operational_failures={6}" -f
              $batch, $state.status, $state.source, $state.selected, $state.accepted,
              $state.updated, $state.operational_failures)

            if ($exitCode -eq 75 -or $state.status -eq 'retry_required') {
              throw "Managed recovery paused safely for operational retry at source=$($state.source) cursor=$($state.cursor_after)"
            }
            if ($exitCode -ne 0) {
              throw "Managed recovery batch $batch failed with exit code $exitCode"
            }
            if ($state.status -eq 'completed') {
              Write-Output 'Managed stale NSPD recovery campaign completed'
              break
            }
          }

      - name: Upload managed recovery evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: managed-stale-nspd-recovery-${{ github.run_id }}
          path: ${{ runner.temp }}\managed-stale-nspd-recovery.jsonl
          if-no-files-found: warn
          retention-days: 30
