services:
  photon:
    image: ghcr.io/rtuszik/photon-docker:2.4.0
    container_name: bankrotai-photon
    environment:
      IMPORT_MODE: jsonl
      REGION: russia
      LANGUAGES: ru,en
      LOG_LEVEL: INFO
      JAVA_PARAMS: -Xms2g -Xmx10g
    volumes:
      - ${PHOTON_DATA_DIR:-photon_data}:/photon/data
    networks:
      - bankrotai-home
    ports:
      - "127.0.0.1:2322:2322"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 12G

volumes:
  photon_data:

networks:
  bankrotai-home:
    external: true
